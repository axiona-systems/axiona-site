name: R91 Social Preview PR Migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: r91-social-preview-pr-migrate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'feature/social-preview-r91'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/social-preview-r91
          fetch-depth: 0
          persist-credentials: false

      - name: Apply R91 migration and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r91_migrate_once.py
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          python3 - <<'PY'
          from pathlib import Path
          import struct
          path = Path('assets/social/axiona-keeper-social-preview-r91.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('keeper social asset is not PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1200, 630):
              raise SystemExit(f'keeper social asset dimensions are {width}x{height}')
          print('OK_R91_KEEPER_PNG_1200x630')
          PY

      - name: Remove migration scaffolding and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/r91-social-preview-migrate.yml
          rm -f .github/workflows/r91-social-preview-pr-migrate.yml
          rm -f scripts/r91_migrate_once.py
          git config user.name "AXIONA Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No migration changes to commit"; exit 1; }
          git commit -m "Complete R91 social preview migration"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/social-preview-r91
