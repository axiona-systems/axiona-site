# Existing-on-main trigger for R139 live motion proof.
name: AXIONA R139 Motion Live Proof Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r139-motion-live-proof-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Wait for R139 live binding
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            key="${GITHUB_SHA}-r139-${attempt}"
            html="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/?axiona_verify=${key}" || true)"
            if grep -Fq '/assets/motion-r138.css?release=R138' <<<"$html" \
              && grep -Fq '/assets/js/motion-r138.js?release=R139' <<<"$html" \
              && grep -Fq 'motion-r138.js?release=R139" defer' <<<"$html"; then
              echo "OK_R139_LIVE_BINDING attempt=${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo STOP_R139_LIVE_BINDING_NOT_CONVERGED >&2
          exit 1

      - name: Verify browser runtime
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || { echo STOP_R139_CHROME_MISSING; exit 1; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Verify live one-shot smooth motion
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ['--no-sandbox'] });
          const routes = ['/', '/systems.html', '/process.html', '/security.html', '/solutions.html', '/contact.html', '/support.html', '/keeper.html', '/en/security.html', '/de/solutions.html'];
          const revealSelector = '[data-ax112-reveal],[data-system-reveal],[data-process-reveal],[data-security-reveal],[data-solutions-reveal],[data-contact-reveal],[data-support-reveal],[data-keeper125-reveal],[data-policy-reveal]';
          const results = [];

          for (const route of routes) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const url = `https://axiona.systems${route}${route.includes('?') ? '&' : '?'}axiona_verify=${process.env.GITHUB_SHA}-r139`;
            await page.goto(url, { waitUntil: 'networkidle' });

            const binding = await page.evaluate(() => ({
              css: [...document.styleSheets].filter(s => (s.href || '').includes('/assets/motion-r138.css?release=R138')).length,
              js: [...document.scripts].filter(s => (s.src || '').includes('/assets/js/motion-r138.js?release=R139') && s.defer).length
            }));
            if (binding.css !== 1 || binding.js !== 1) throw new Error(`${route} binding ${JSON.stringify(binding)}`);

            const count = await page.locator(revealSelector).count();
            if (!count) {
              results.push(`${route}:no-reveal-nodes`);
              await page.close();
              continue;
            }

            let target = null;
            for (let i = 0; i < count; i++) {
              const candidate = page.locator(revealSelector).nth(i);
              const box = await candidate.boundingBox();
              if (box && box.y > 950) { target = candidate; break; }
            }
            if (!target) target = page.locator(revealSelector).last();

            await target.scrollIntoViewIfNeeded();
            await page.waitForTimeout(1100);
            const entered = await target.evaluate(el => ({
              settled: el.classList.contains('ax-reveal-settled'),
              opacity: getComputedStyle(el).opacity,
              transform: getComputedStyle(el).transform
            }));
            if (!entered.settled || Number(entered.opacity) < .99) throw new Error(`${route} failed to settle ${JSON.stringify(entered)}`);

            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
            await page.waitForTimeout(700);
            const exited = await target.evaluate(el => ({
              settled: el.classList.contains('ax-reveal-settled'),
              opacity: getComputedStyle(el).opacity,
              transform: getComputedStyle(el).transform
            }));
            if (!exited.settled || Number(exited.opacity) < .99) throw new Error(`${route} reset after leaving viewport ${JSON.stringify(exited)}`);

            results.push(`${route}:PASS`);
            await page.close();
          }

          await browser.close();
          console.log(results.join('\n'));
          console.log('OK_AXIONA_R139_LIVE_ONE_SHOT_MOTION');
          NODE

      - name: Record live proof and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/status/R139_MOTION_LIVE_PROOF.md <<'EOF'
          # AXIONA R139 smooth-motion live proof

          Public `axiona.systems` Chromium verification passed.

          Verified:
          - R138 smooth-motion CSS is loaded exactly once;
          - the common coordinator is cache-busted as R139 and executes deferred after page-specific scripts;
          - reveal nodes settle after their first entrance;
          - leaving the viewport does not visually reset an already revealed node;
          - dynamic reveal-node pages are covered, not only Systems and Process;
          - HU primary pages plus representative EN/DE routes were tested.

          Result: LIVE PASS
          EOF
          rm -f .github/workflows/axiona-r139-motion-live-proof-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'R139: record live smooth-motion proof'
          git push origin HEAD:main
