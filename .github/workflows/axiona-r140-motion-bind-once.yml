name: AXIONA R140 Motion Bind Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r140-motion-bind-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind R140 motion assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(['git','ls-files','*.html'], text=True).splitlines()
          checked = 0
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if '</head>' not in text or '</body>' not in text:
                  continue
              text = text.replace('/assets/motion-r138.css?release=R138', '/assets/motion-r138.css?release=R140')
              text = text.replace('/assets/js/motion-r138.js?release=R139', '/assets/js/motion-r138.js?release=R140')
              if text.count('/assets/motion-r138.css?release=R140') != 1:
                  raise SystemExit(f'STOP_R140_CSS {name}')
              if text.count('/assets/js/motion-r138.js?release=R140') != 1:
                  raise SystemExit(f'STOP_R140_JS {name}')
              p.write_text(text, encoding='utf-8')
              checked += 1
          if checked < 10:
              raise SystemExit(f'STOP_R140_TOO_FEW={checked}')
          print(f'OK_R140_BINDINGS={checked}')
          PY
      - name: Commit bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/status
          cat > docs/status/R140_MOTION_TUNING.md <<'EOF'
          # AXIONA R140 motion tuning

          - reveal distance: 9 px desktop, 6 px mobile
          - start opacity: 0.86 desktop, 0.90 mobile
          - transform duration: 620 ms desktop, 500 ms mobile
          - subtle list stagger: 18/36 ms
          - return reveal is supported
          - reset only after the element is well outside the viewport (28% hysteresis)
          - prefers-reduced-motion remains static

          Binding: PASS
          EOF
          rm -f .github/workflows/axiona-r140-motion-bind-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'R140: bind restrained bidirectional motion'
          git push origin HEAD:main
