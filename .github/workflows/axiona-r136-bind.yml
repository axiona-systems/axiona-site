name: AXIONA R136 Bind

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/axiona-r136-bind.yml"

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bind R136 as final stylesheet on public navigation pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              "index.html", "systems.html", "process.html", "security.html", "solutions.html", "contact.html", "support.html",
              "en/index.html", "en/systems.html", "en/process.html", "en/security.html", "en/solutions.html", "en/contact.html", "en/support.html",
              "de/index.html", "de/systems.html", "de/process.html", "de/security.html", "de/solutions.html", "de/contact.html", "de/support.html",
          ]
          link = '<link href="/assets/r136-ux-fixes.css?release=R136" rel="stylesheet"/>'
          old = re.compile(r'<link\s+href="/assets/r13[56]-ux-fixes\.css\?release=R13[56]"\s+rel="stylesheet"\s*/?>')

          for name in targets:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f"missing target: {name}")
              text = p.read_text(encoding="utf-8")
              text = old.sub("", text)
              if "</head>" not in text:
                  raise SystemExit(f"missing </head>: {name}")
              text = text.replace("</head>", link + "</head>", 1)
              if text.count("r136-ux-fixes.css?release=R136") != 1:
                  raise SystemExit(f"bad R136 binding count: {name}")
              p.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/axiona-r136-bind.yml")
          workflow.unlink()
          print(f"OK_R136_BOUND_TARGETS={len(targets)}")
          PY

      - name: Commit canonical binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AXIONA Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html systems.html process.html security.html solutions.html contact.html support.html en de .github/workflows/axiona-r136-bind.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "STOP_R136_NO_CHANGES" >&2; exit 1; }
          git commit -m "R136: bind UX fixes across public navigation pages"
          git push origin HEAD:main
