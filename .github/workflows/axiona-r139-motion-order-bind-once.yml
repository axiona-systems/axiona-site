# Existing-on-main trigger for R139 motion ordering.
name: AXIONA R139 Motion Order Bind Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r139-motion-order-bind-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Make R138 coordinator the final deferred motion script
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(['git','ls-files','*.html'], text=True).splitlines()
          old = '<script src="/assets/js/motion-r138.js?release=R138"></script>'
          new = '<script src="/assets/js/motion-r138.js?release=R139" defer></script>'
          checked = 0
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if '</body>' not in text:
                  continue
              if old not in text and new not in text:
                  raise SystemExit(f'STOP_R139_R138_BINDING_MISSING {name}')
              text = text.replace(old, new)
              if text.count(new) != 1:
                  raise SystemExit(f'STOP_R139_SCRIPT_BINDING_COUNT {name} count={text.count(new)}')
              p.write_text(text, encoding='utf-8')
              checked += 1
          if checked < 10:
              raise SystemExit(f'STOP_R139_TOO_FEW_HTML={checked}')
          print(f'OK_R139_DEFERRED_BINDINGS={checked}')
          PY

      - name: Record and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/status
          cat > docs/status/R139_MOTION_ORDER_FIX.md <<'EOF'
          # AXIONA R139 motion execution-order correction

          The common one-shot motion coordinator now runs as the final deferred script.
          This guarantees that page-specific deferred scripts can mark their reveal nodes first.

          - common motion coordinator remains `assets/js/motion-r138.js`
          - cache-busted script binding uses `?release=R139`
          - script is `defer` and remains last in document order
          - dynamic reveal attributes on Security, Solutions, Contact, Support, Keeper and policy pages are visible to the coordinator

          Binding: PASS
          EOF
          rm -f .github/workflows/axiona-r139-motion-order-bind-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'R139: order smooth-motion coordinator after page scripts'
          git push origin HEAD:main
