name: Keeper R94 Contrast Fix

on:
  push:
    branches:
      - feature/keeper-product-story-r94
    paths:
      - ".github/workflows/keeper-r94-contrast-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Raise matter-view text contrast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/keeper-r94.css')
          text = path.read_text(encoding='utf-8')
          rules = {
              'color:#707873;': 'color:#646d68;',
              'color:#6e7773;': 'color:#606964;',
          }
          for old, new in rules.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'STOP_R94_CONTRAST_ANCHOR {old} count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('OK_KEEPER_R94_CONTRAST_PATCH')
          PY
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check

      - name: Commit clean contrast fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/keeper-r94-contrast-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Raise Keeper matter-view text contrast"
          git push origin HEAD:feature/keeper-product-story-r94
