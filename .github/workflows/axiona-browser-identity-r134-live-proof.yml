name: AXIONA Browser Identity R134 Live Proof

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'en/*.html'
      - 'de/*.html'
      - 'favicon.svg'
      - 'favicon-16x16.png'
      - 'favicon-32x32.png'
      - 'apple-touch-icon.png'
      - 'site.webmanifest'
      - 'assets/brand/axiona-icon-192.png'
      - 'assets/brand/axiona-icon-512.png'
      - '.github/workflows/axiona-browser-identity-r134-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prove live browser identity bindings
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            / /systems.html /process.html /security.html /solutions.html /keeper.html /contact.html /privacy.html /legal.html /support.html
            /en/ /en/systems.html /en/process.html /en/security.html /en/solutions.html /en/keeper.html /en/contact.html /en/privacy.html /en/legal.html /en/support.html
            /de/ /de/systems.html /de/process.html /de/security.html /de/solutions.html /de/keeper.html /de/contact.html /de/privacy.html /de/legal.html /de/support.html
          )

          for attempt in {1..36}; do
            ok=1
            for route in "${routes[@]}"; do
              file="/tmp/r134-$(echo "$route" | tr '/:' '__').html"
              code="$(curl -sS -L -o "$file" -w '%{http_code}' "https://axiona.systems${route}?proof=${GITHUB_SHA}" || true)"
              [ "$code" = 200 ] || ok=0
              grep -Fq '<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>' "$file" || ok=0
              grep -Fq '<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32"/>' "$file" || ok=0
              grep -Fq '<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16"/>' "$file" || ok=0
              grep -Fq '<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"/>' "$file" || ok=0
              grep -Fq '<link rel="manifest" href="/site.webmanifest"/>' "$file" || ok=0
              ! grep -Eqi 'rel="shortcut icon"|rel="icon shortcut"' "$file" || ok=0
            done

            file="/tmp/r134-404.html"
            code="$(curl -sS -L -o "$file" -w '%{http_code}' "https://axiona.systems/__r134-${GITHUB_SHA}?proof=${GITHUB_SHA}" || true)"
            [ "$code" = 404 ] || ok=0
            grep -Fq '<link rel="manifest" href="/site.webmanifest"/>' "$file" || ok=0
            grep -Fq '<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"/>' "$file" || ok=0

            curl -fsS "https://axiona.systems/site.webmanifest?proof=${GITHUB_SHA}" -o /tmp/site.webmanifest || ok=0
            curl -fsS "https://axiona.systems/assets/brand/axiona-icon-192.png?proof=${GITHUB_SHA}" -o /tmp/icon-192.png || ok=0
            curl -fsS "https://axiona.systems/assets/brand/axiona-icon-512.png?proof=${GITHUB_SHA}" -o /tmp/icon-512.png || ok=0

            if [ "$ok" = 1 ]; then
              python3 - <<'PY' || ok=0
          import json, struct
          from pathlib import Path
          manifest=json.loads(Path('/tmp/site.webmanifest').read_text())
          expected=[
              {'src':'/assets/brand/axiona-icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'/assets/brand/axiona-icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
          ]
          assert manifest.get('icons') == expected
          def dims(path):
              raw=Path(path).read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n' and raw[12:16] == b'IHDR'
              return struct.unpack('>II', raw[16:24])
          assert dims('/tmp/icon-192.png') == (192,192)
          assert dims('/tmp/icon-512.png') == (512,512)
          PY
            fi

            if [ "$ok" = 1 ]; then
              echo 'OK_AXIONA_BROWSER_IDENTITY_R134_LIVE'
              echo "PROVEN_PAGES_SOURCE_SHA=${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done

          echo "STOP_AXIONA_BROWSER_IDENTITY_R134_NOT_LIVE_FOR_SHA=${GITHUB_SHA}"
          exit 1
