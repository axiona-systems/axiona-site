name: R149 Unified Hero Proof Once

on:
  push:
    branches:
      - feature/r149-multilingual-hero-reveal
    paths:
      - .github/workflows/r149-unify-hero-proof-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/r149-multilingual-hero-reveal
          fetch-depth: 2

      - name: Apply unified hero verifier patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5f2e09ea7d35979ec6c9a981ef20063341020f91"
          python3 scripts/r149_unify_hero_proof_once.py
          node --check scripts/verify_render_contract.mjs
          git rm .github/workflows/r149-unify-hero-proof-once.yml scripts/r149_unify_hero_proof_once.py
          git diff --check
          git config user.name "Zoltán Asztalos"
          git config user.email "254342788+fakukac1980@users.noreply.github.com"
          git add scripts/verify_render_contract.mjs
          git commit -m "R149: unify multilingual hero proof"
          git push origin HEAD:feature/r149-multilingual-hero-reveal
