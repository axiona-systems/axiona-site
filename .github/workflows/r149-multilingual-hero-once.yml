name: R149 Multilingual Hero Patch Once

on:
  push:
    branches:
      - feature/r149-multilingual-hero-reveal
    paths:
      - .github/workflows/r149-multilingual-hero-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/r149-multilingual-hero-reveal
          fetch-depth: 2

      - name: Apply exact R149 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a97c952f0eafed81ea3c6a9d3eaa04215837dddd"
          python3 - <<'PY'
          from pathlib import Path

          def exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"STOP_R149_EXACT path={path} expected={count} actual={actual} old={old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          exact(
              "assets/js/overview-r116.js",
              "/* AXIONA R146 — solution-first one-shot hero reveal with fitted second line. */",
              "/* AXIONA R149 — localized one-shot hero reveal with fitted second line. */",
          )
          exact(
              "assets/js/overview-r116.js",
              "  const heading = document.getElementById('ax112-hero-title');",
              "  const heading = document.querySelector('body.page-overview .ax112-hero h1[id^=\"ax112-hero-title\"]');",
          )

          css_path = Path("assets/visual-r116.css")
          css = css_path.read_text(encoding="utf-8")
          old_comment = "/* R146 — slower one-shot reveal with a single fitted solution line. */"
          if css.count(old_comment) != 1:
              raise SystemExit("STOP_R149_CSS_COMMENT")
          css = css.replace(old_comment, "/* R149 — localized one-shot reveal with a single fitted solution line. */")
          old_selector = "body.page-overview #ax112-hero-title"
          if css.count(old_selector) != 7:
              raise SystemExit(f"STOP_R149_CSS_SELECTOR count={css.count(old_selector)}")
          css = css.replace(old_selector, 'body.page-overview .ax112-hero h1[id^="ax112-hero-title"]')
          if css.count("ax-r146-hero-character-in") != 2:
              raise SystemExit("STOP_R149_CSS_KEYFRAME")
          css = css.replace("ax-r146-hero-character-in", "ax-r149-hero-character-in")
          css_path.write_text(css, encoding="utf-8")

          exact("index.html", "/assets/visual-r116.css?release=R146", "/assets/visual-r116.css?release=R149")
          exact("index.html", "/assets/js/overview-r116.js?release=R146", "/assets/js/overview-r116.js?release=R149")
          for path in ("en/index.html", "de/index.html"):
              exact(path, "/assets/visual-r116.css?release=R116", "/assets/visual-r116.css?release=R149")
              exact(path, "/assets/js/overview-r116.js?release=R116", "/assets/js/overview-r116.js?release=R149")

          render_path = Path("scripts/verify_render_contract.mjs")
          render = render_path.read_text(encoding="utf-8")
          replacements = (
              ("r146Css", "r149Css", 2),
              ("r146Js", "r149Js", 2),
              ("/assets/visual-r116.css?release=R146", "/assets/visual-r116.css?release=R149", 1),
              ("/assets/js/overview-r116.js?release=R146", "/assets/js/overview-r116.js?release=R149", 1),
              ("overview: R146 asset binding", "overview: R149 asset binding", 1),
          )
          for old, new, expected in replacements:
              actual = render.count(old)
              if actual != expected:
                  raise SystemExit(f"STOP_R149_RENDER_REPLACE old={old!r} expected={expected} actual={actual}")
              render = render.replace(old, new)

          anchor = "  {\n    const page = await open('/', 1440, 900);\n"
          if render.count(anchor) != 1:
              raise SystemExit("STOP_R149_RENDER_ANCHOR")
          localized_lines = [
              "  for (const [route, expectedLabel] of [['/en/', 'Real problem. Working system.'], ['/de/', 'Reales Problem. Funktionierendes System.']]) {",
              "    const page = await open(route, 1440, 900);",
              "    await page.waitForTimeout(5200);",
              "    const hero = await page.evaluate(() => {",
              "      const heading = document.querySelector('body.page-overview .ax112-hero h1[id^=\\\"ax112-hero-title\\\"]');",
              "      if (!heading) return null;",
              "      const glyphs = [...heading.querySelectorAll('.ax-hero-char')];",
              "      const secondLine = heading.querySelector(':scope > .ax-hero-second-line');",
              "      const tops = secondLine ? [...secondLine.querySelectorAll('.ax-hero-char')].map(glyph => glyph.getBoundingClientRect().top) : [];",
              "      const styles = [...document.styleSheets].map(sheet => sheet.href || '');",
              "      const scripts = [...document.scripts].map(script => script.src || '');",
              "      return {",
              "        state: heading.dataset.axHeroType || '',",
              "        label: heading.getAttribute('aria-label') || '',",
              "        glyphs: glyphs.length,",
              "        rows: tops.length ? Math.max(...tops) - Math.min(...tops) : 999,",
              "        overflow: secondLine ? secondLine.scrollWidth - secondLine.clientWidth : 999,",
              "        fit: secondLine?.dataset.axHeroFit || '',",
              "        css: styles.filter(url => url.includes('/assets/visual-r116.css?release=R149')).length,",
              "        js: scripts.filter(url => url.includes('/assets/js/overview-r116.js?release=R149')).length,",
              "        hidden: glyphs.filter(glyph => Number.parseFloat(getComputedStyle(glyph).opacity) < .99).length,",
              "        running: glyphs.flatMap(glyph => glyph.getAnimations()).filter(animation => animation.playState === 'running').length,",
              "        iterations: [...new Set(glyphs.map(glyph => getComputedStyle(glyph).animationIterationCount))]",
              "      };",
              "    });",
              "    const expectedGlyphs = Array.from(expectedLabel.replace(/\\s/gu, '')).length;",
              "    if (!hero || hero.state !== 'complete' || hero.label !== expectedLabel || hero.glyphs !== expectedGlyphs) {",
              "      throw new Error(`${route}: localized hero reveal structure ${JSON.stringify(hero)}`);",
              "    }",
              "    if (hero.rows > 1 || hero.overflow > 2 || !['native', 'scaled'].includes(hero.fit) || hero.css !== 1 || hero.js !== 1) {",
              "      throw new Error(`${route}: localized hero binding/fit ${JSON.stringify(hero)}`);",
              "    }",
              "    if (hero.hidden !== 0 || hero.running !== 0 || hero.iterations.length !== 1 || hero.iterations[0] !== '1') {",
              "      throw new Error(`${route}: localized hero did not settle once ${JSON.stringify(hero)}`);",
              "    }",
              "    await page.setViewportSize({ width: 390, height: 844 });",
              "    await page.waitForTimeout(180);",
              "    const mobile = await page.evaluate(() => {",
              "      const secondLine = document.querySelector('body.page-overview .ax112-hero h1[id^=\\\"ax112-hero-title\\\"] > .ax-hero-second-line');",
              "      if (!secondLine) return null;",
              "      const tops = [...secondLine.querySelectorAll('.ax-hero-char')].map(glyph => glyph.getBoundingClientRect().top);",
              "      return { rows: tops.length ? Math.max(...tops) - Math.min(...tops) : 999, overflow: secondLine.scrollWidth - secondLine.clientWidth };",
              "    });",
              "    if (!mobile || mobile.rows > 1 || mobile.overflow > 2) throw new Error(`${route}: localized mobile hero fit ${JSON.stringify(mobile)}`);",
              "    await page.waitForTimeout(800);",
              "    const settled = await page.evaluate(() => {",
              "      const heading = document.querySelector('body.page-overview .ax112-hero h1[id^=\\\"ax112-hero-title\\\"]');",
              "      const glyphs = heading ? [...heading.querySelectorAll('.ax-hero-char')] : [];",
              "      return { state: heading?.dataset.axHeroType || '', running: glyphs.flatMap(glyph => glyph.getAnimations()).filter(animation => animation.playState === 'running').length };",
              "    });",
              "    if (settled.state !== 'complete' || settled.running !== 0) throw new Error(`${route}: localized hero restarted ${JSON.stringify(settled)}`);",
              "    console.log(`OK_AXIONA_LOCALIZED_HERO_REVEAL_ONCE route=${route}`);",
              "    await page.close();",
              "  }",
              "",
              "",
          ]
          localized_proof = "\n".join(localized_lines)
          render = render.replace(anchor, localized_proof + anchor)
          render_path.write_text(render, encoding="utf-8")
          PY

          git rm .github/workflows/r149-multilingual-hero-once.yml
          git diff --check
          git config user.name "Zoltán Asztalos"
          git config user.email "254342788+fakukac1980@users.noreply.github.com"
          git add assets/js/overview-r116.js assets/visual-r116.css index.html en/index.html de/index.html scripts/verify_render_contract.mjs
          git commit -m "R149: enable hero reveal on all locales"
          git push origin HEAD:feature/r149-multilingual-hero-reveal
