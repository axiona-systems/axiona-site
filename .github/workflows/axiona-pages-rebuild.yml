name: AXIONA Pages Rebuild

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "en/**"
      - "de/**"
      - "assets/**"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/axiona-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: axiona-pages-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild and verify live Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Request GitHub Pages rebuild
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds" \
            > /tmp/pages-build.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/pages-build.json', encoding='utf-8'))
          print('REQUESTED_PAGES_BUILD_ID=' + str(data.get('id', 'unknown')))
          print('REQUESTED_PAGES_BUILD_STATUS=' + str(data.get('status', 'unknown')))
          PY

      - name: Wait for Pages build completion
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest" \
              > /tmp/pages-latest.json
            STATUS="$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/pages-latest.json', encoding='utf-8'))
          print(data.get('status', 'unknown'))
          PY
          )"
            echo "PAGES_BUILD_ATTEMPT=${attempt} STATUS=${STATUS}"
            case "$STATUS" in
              built)
                echo "OK_AXIONA_PAGES_BUILD_COMPLETED"
                exit 0
                ;;
              errored)
                cat /tmp/pages-latest.json
                echo "STOP_AXIONA_PAGES_BUILD_ERRORED"
                exit 1
                ;;
            esac
            sleep 5
          done
          cat /tmp/pages-latest.json || true
          echo "STOP_AXIONA_PAGES_BUILD_TIMEOUT"
          exit 1

      - name: Verify live R92 social metadata and assets
        id: live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            HU="$(curl --fail --silent --show-error --location https://axiona.systems/systems.html || true)"
            EN="$(curl --fail --silent --show-error --location https://axiona.systems/en/systems.html || true)"
            DE="$(curl --fail --silent --show-error --location https://axiona.systems/de/systems.html || true)"
            KEEPER_HU="$(curl --fail --silent --show-error --location https://axiona.systems/keeper.html || true)"
            if grep -Fq 'axiona-social-preview-r92-hu.png' <<<"$HU" \
              && grep -Fq 'axiona-social-preview-r92-en.png' <<<"$EN" \
              && grep -Fq 'axiona-social-preview-r92-de.png' <<<"$DE" \
              && grep -Fq 'axiona-keeper-social-preview-r92-hu.png' <<<"$KEEPER_HU" \
              && curl --fail --silent --show-error --head https://axiona.systems/assets/social/axiona-social-preview-r92-hu.png >/dev/null \
              && curl --fail --silent --show-error --head https://axiona.systems/assets/social/axiona-keeper-social-preview-r92-hu.png >/dev/null; then
              echo "OK_AXIONA_LIVE_R92_SOCIAL_PREVIEWS"
              exit 0
            fi
            echo "LIVE_R92_NOT_READY_ATTEMPT=${attempt}"
            sleep 5
          done
          echo "STOP_AXIONA_LIVE_R92_SOCIAL_PREVIEWS_NOT_PUBLISHED"
          exit 1

      - name: Record live deployment proof
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          STATUS_PATH="Docs/LIVE_DEPLOYMENT_STATUS.json"
          export STATUS_PATH
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          result = "PASS" if os.environ.get("LIVE_OUTCOME") == "success" else "FAIL"
          payload = {
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "result": result,
              "source_sha": os.environ.get("SOURCE_SHA"),
              "run_id": os.environ.get("RUN_ID"),
              "request_outcome": os.environ.get("REQUEST_OUTCOME"),
              "build_outcome": os.environ.get("BUILD_OUTCOME"),
              "live_outcome": os.environ.get("LIVE_OUTCOME"),
              "expected": {
                  "hu": "axiona-social-preview-r92-hu.png",
                  "en": "axiona-social-preview-r92-en.png",
                  "de": "axiona-social-preview-r92-de.png",
                  "keeper_hu": "axiona-keeper-social-preview-r92-hu.png"
              }
          }
          with open('/tmp/live-status.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          HTTP_CODE="$(curl --silent --show-error --output /tmp/status-meta.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/contents/${STATUS_PATH}?ref=main")"

          EXISTING_SHA=""
          if [ "$HTTP_CODE" = "200" ]; then
            EXISTING_SHA="$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/status-meta.json', encoding='utf-8'))
          print(data.get('sha', ''))
          PY
          )"
          elif [ "$HTTP_CODE" != "404" ]; then
            cat /tmp/status-meta.json
            echo "STOP_AXIONA_LIVE_STATUS_READ_FAILED=$HTTP_CODE"
            exit 1
          fi

          python3 - <<'PY'
          import base64, json, os
          raw = open('/tmp/live-status.json', 'rb').read()
          body = {
              'message': 'Record AXIONA live deployment proof',
              'content': base64.b64encode(raw).decode('ascii'),
              'branch': 'main'
          }
          sha = os.environ.get('EXISTING_SHA', '')
          if sha:
              body['sha'] = sha
          with open('/tmp/status-put.json', 'w', encoding='utf-8') as f:
              json.dump(body, f)
          PY
          export EXISTING_SHA
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/status-put.json \
            "https://api.github.com/repos/${REPOSITORY}/contents/${STATUS_PATH}" \
            >/dev/null
          echo "OK_AXIONA_LIVE_DEPLOYMENT_PROOF_RECORDED"
