name: AXIONA Pages Verify

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "en/**"
      - "de/**"
      - "assets/**"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/axiona-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: axiona-pages-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Publish and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Request GitHub Pages rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds" \
            >/dev/null

      - name: Wait for Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            STATUS="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')"
            case "$STATUS" in
              built) exit 0 ;;
              errored) echo "Pages build failed" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Pages build timed out" >&2
          exit 1

      - name: Verify live public surface
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            CACHE_BUST="${GITHUB_SHA}-${attempt}"
            HOME_HU="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/?axiona_verify=${CACHE_BUST}" || true)"
            HOME_EN="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/en/?axiona_verify=${CACHE_BUST}" || true)"
            HOME_DE="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/de/?axiona_verify=${CACHE_BUST}" || true)"
            KEEPER_HU="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/keeper.html?axiona_verify=${CACHE_BUST}" || true)"
            if grep -Fq 'AXIONA Systems' <<<"$HOME_HU" \
              && grep -Fq 'AXIONA Systems' <<<"$HOME_EN" \
              && grep -Fq 'AXIONA Systems' <<<"$HOME_DE" \
              && grep -Fq 'AXIONA KEEPER' <<<"$KEEPER_HU"; then
              echo "OK_AXIONA_LIVE_PUBLIC_SURFACE"
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Live public surface did not converge" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify live process pages match canonical release
        shell: bash
        run: |
          set -euo pipefail

          release_from_file() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r'<meta content="([^"]+)" name="axiona-release"\s*/?>', text)
          if not match:
              raise SystemExit(f"missing axiona-release in {sys.argv[1]}")
          print(match.group(1))
          PY
          }

          EXPECTED_HU="$(release_from_file process.html)"
          EXPECTED_EN="$(release_from_file en/process.html)"
          EXPECTED_DE="$(release_from_file de/process.html)"

          for attempt in $(seq 1 24); do
            CACHE_BUST="${GITHUB_SHA}-process-${attempt}"
            PROCESS_HU="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/process.html?axiona_verify=${CACHE_BUST}" || true)"
            PROCESS_EN="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/en/process.html?axiona_verify=${CACHE_BUST}" || true)"
            PROCESS_DE="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/de/process.html?axiona_verify=${CACHE_BUST}" || true)"

            if grep -Fq "content=\"${EXPECTED_HU}\" name=\"axiona-release\"" <<<"$PROCESS_HU" \
              && grep -Fq "content=\"${EXPECTED_EN}\" name=\"axiona-release\"" <<<"$PROCESS_EN" \
              && grep -Fq "content=\"${EXPECTED_DE}\" name=\"axiona-release\"" <<<"$PROCESS_DE"; then
              echo "OK_AXIONA_LIVE_PROCESS_RELEASE HU=${EXPECTED_HU} EN=${EXPECTED_EN} DE=${EXPECTED_DE}"
              exit 0
            fi
            sleep 5
          done

          echo "Live process pages do not match canonical release" >&2
          echo "EXPECTED HU=${EXPECTED_HU} EN=${EXPECTED_EN} DE=${EXPECTED_DE}" >&2
          exit 1

      - name: Verify live security pages match canonical release
        shell: bash
        run: |
          set -euo pipefail

          release_from_file() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r'<meta content="([^"]+)" name="axiona-release"\s*/?>', text)
          if not match:
              raise SystemExit(f"missing axiona-release in {sys.argv[1]}")
          print(match.group(1))
          PY
          }

          EXPECTED_HU="$(release_from_file security.html)"
          EXPECTED_EN="$(release_from_file en/security.html)"
          EXPECTED_DE="$(release_from_file de/security.html)"

          for attempt in $(seq 1 24); do
            CACHE_BUST="${GITHUB_SHA}-security-${attempt}"
            SECURITY_HU="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/security.html?axiona_verify=${CACHE_BUST}" || true)"
            SECURITY_EN="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/en/security.html?axiona_verify=${CACHE_BUST}" || true)"
            SECURITY_DE="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/de/security.html?axiona_verify=${CACHE_BUST}" || true)"

            if grep -Fq "content=\"${EXPECTED_HU}\" name=\"axiona-release\"" <<<"$SECURITY_HU" \
              && grep -Fq 'security-trust section-pad' <<<"$SECURITY_HU" \
              && grep -Fq "content=\"${EXPECTED_EN}\" name=\"axiona-release\"" <<<"$SECURITY_EN" \
              && grep -Fq 'security-trust section-pad' <<<"$SECURITY_EN" \
              && grep -Fq "content=\"${EXPECTED_DE}\" name=\"axiona-release\"" <<<"$SECURITY_DE" \
              && grep -Fq 'security-trust section-pad' <<<"$SECURITY_DE"; then
              echo "OK_AXIONA_LIVE_SECURITY_RELEASE HU=${EXPECTED_HU} EN=${EXPECTED_EN} DE=${EXPECTED_DE}"
              exit 0
            fi
            sleep 5
          done

          echo "Live security pages do not match canonical release" >&2
          echo "EXPECTED HU=${EXPECTED_HU} EN=${EXPECTED_EN} DE=${EXPECTED_DE}" >&2
          exit 1

      - name: Verify live solutions pages match canonical release
        shell: bash
        run: |
          set -euo pipefail

          release_from_file() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r'<meta content="([^"]+)" name="axiona-release"\s*/?>', text)
          if not match:
              raise SystemExit(f"missing axiona-release in {sys.argv[1]}")
          print(match.group(1))
          PY
          }

          EXPECTED_HU="$(release_from_file solutions.html)"
          EXPECTED_EN="$(release_from_file en/solutions.html)"
          EXPECTED_DE="$(release_from_file de/solutions.html)"

          for attempt in $(seq 1 24); do
            CACHE_BUST="${GITHUB_SHA}-solutions-${attempt}"
            SOLUTIONS_HU="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/solutions.html?axiona_verify=${CACHE_BUST}" || true)"
            SOLUTIONS_EN="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/en/solutions.html?axiona_verify=${CACHE_BUST}" || true)"
            SOLUTIONS_DE="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/de/solutions.html?axiona_verify=${CACHE_BUST}" || true)"

            if grep -Fq "content=\"${EXPECTED_HU}\" name=\"axiona-release\"" <<<"$SOLUTIONS_HU" \
              && grep -Fq 'solution-fit section-pad' <<<"$SOLUTIONS_HU" \
              && grep -Fq "content=\"${EXPECTED_EN}\" name=\"axiona-release\"" <<<"$SOLUTIONS_EN" \
              && grep -Fq 'solution-fit section-pad' <<<"$SOLUTIONS_EN" \
              && grep -Fq "content=\"${EXPECTED_DE}\" name=\"axiona-release\"" <<<"$SOLUTIONS_DE" \
              && grep -Fq 'solution-fit section-pad' <<<"$SOLUTIONS_DE"; then
              echo "OK_AXIONA_LIVE_SOLUTIONS_RELEASE HU=${EXPECTED_HU} EN=${EXPECTED_EN} DE=${EXPECTED_DE}"
              exit 0
            fi
            sleep 5
          done

          echo "Live solutions pages do not match canonical release" >&2
          echo "EXPECTED HU=${EXPECTED_HU} EN=${EXPECTED_EN} DE=${EXPECTED_DE}" >&2
          exit 1
