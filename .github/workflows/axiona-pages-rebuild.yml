name: AXIONA Pages Verify

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "en/**"
      - "de/**"
      - "assets/**"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/axiona-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: axiona-pages-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Publish and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Request GitHub Pages rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds" \
            >/dev/null

      - name: Wait for Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            STATUS="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')"
            case "$STATUS" in
              built) exit 0 ;;
              errored) echo "Pages build failed" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Pages build timed out" >&2
          exit 1

      - name: Verify live public surface
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            HOME_HU="$(curl --fail --silent --show-error --location https://axiona.systems/ || true)"
            HOME_EN="$(curl --fail --silent --show-error --location https://axiona.systems/en/ || true)"
            HOME_DE="$(curl --fail --silent --show-error --location https://axiona.systems/de/ || true)"
            KEEPER_HU="$(curl --fail --silent --show-error --location https://axiona.systems/keeper.html || true)"
            if grep -Fq 'AXIONA Systems' <<<"$HOME_HU" \
              && grep -Fq 'AXIONA Systems' <<<"$HOME_EN" \
              && grep -Fq 'AXIONA Systems' <<<"$HOME_DE" \
              && grep -Fq 'AXIONA KEEPER' <<<"$KEEPER_HU"; then
              echo "OK_AXIONA_LIVE_PUBLIC_SURFACE"
              exit 0
            fi
            sleep 5
          done
          echo "Live public surface did not converge" >&2
          exit 1
