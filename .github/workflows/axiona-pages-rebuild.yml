name: AXIONA Pages Publish Verify

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
      - ".well-known/**"
      - "naplo/feed.xml"
      - "sitemap.xml"
      - "llms.txt"
      - "robots.txt"
      - "site.webmanifest"
      - "CNAME"
      - ".nojekyll"
      - "scripts/verify_served_site.py"
      - ".github/workflows/axiona-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: axiona-pages-publish
  cancel-in-progress: true

jobs:
  publish-verify:
    name: Publish exact main and verify live canonical surface
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Request GitHub Pages rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds" \
            >/dev/null

      - name: Wait for exact Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            PAYLOAD="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest")"
            read -r STATUS COMMIT < <(printf '%s' "$PAYLOAD" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status","unknown"), d.get("commit","missing"))')
            echo "PAGES_ATTEMPT=${attempt} STATUS=${STATUS} COMMIT=${COMMIT} EXPECTED=${GITHUB_SHA}"
            if [ "$COMMIT" = "$GITHUB_SHA" ]; then
              case "$STATUS" in
                built) echo "OK_AXIONA_PAGES_EXACT_BUILD=${GITHUB_SHA}"; break ;;
                errored) echo "STOP_AXIONA_PAGES_EXACT_BUILD_ERRORED" >&2; exit 1 ;;
              esac
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "STOP_AXIONA_PAGES_EXACT_BUILD_TIMEOUT expected=${GITHUB_SHA}" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify live site equals exact source
        shell: bash
        run: python3 scripts/verify_served_site.py --mode live --attempts 18
