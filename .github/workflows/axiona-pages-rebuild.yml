name: AXIONA Pages Publish Verify

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "en/**"
      - "de/**"
      - "assets/**"
      - ".well-known/**"
      - "sitemap.xml"
      - "robots.txt"
      - "site.webmanifest"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/axiona-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: axiona-pages-publish
  cancel-in-progress: true

jobs:
  publish-verify:
    name: Publish exact main and verify live canonical surface
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Request GitHub Pages rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds" \
            >/dev/null

      - name: Wait for exact Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            PAYLOAD="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest")"
            read -r STATUS COMMIT < <(printf '%s' "$PAYLOAD" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status","unknown"), d.get("commit","missing"))')
            echo "PAGES_ATTEMPT=${attempt} STATUS=${STATUS} COMMIT=${COMMIT} EXPECTED=${GITHUB_SHA}"
            if [ "$COMMIT" = "$GITHUB_SHA" ]; then
              case "$STATUS" in
                built) echo "OK_AXIONA_PAGES_EXACT_BUILD=${GITHUB_SHA}"; break ;;
                errored) echo "STOP_AXIONA_PAGES_EXACT_BUILD_ERRORED" >&2; exit 1 ;;
              esac
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "STOP_AXIONA_PAGES_EXACT_BUILD_TIMEOUT expected=${GITHUB_SHA}" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Resolve canonical runtime bindings from source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          patterns={
            'AX_R137': r'(/assets/r137-ux-fixes\.css\?release=[A-Za-z0-9_-]+)',
            'AX_MOTION_CSS': r'(/assets/motion-r138\.css\?release=[A-Za-z0-9_-]+)',
            'AX_MOTION_JS': r'(/assets/js/motion-r138\.js\?release=[A-Za-z0-9_-]+)',
          }
          for key, pattern in patterns.items():
            match=re.search(pattern,text)
            if not match: raise SystemExit(f'missing canonical binding {key}')
            print(f'{key}={match.group(1)}')
          PY

      - name: Verify live canonical routes and security contact
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/" "/systems.html" "/process.html" "/security.html" "/solutions.html"
            "/contact.html" "/support.html" "/keeper.html" "/privacy.html" "/legal.html"
            "/en/" "/de/"
          )
          for attempt in $(seq 1 30); do
            key="${GITHUB_SHA}-live-${attempt}"
            ok=1
            for route in "${routes[@]}"; do
              html="$(curl --fail --silent --show-error --location --retry 2 --retry-all-errors --header 'Cache-Control: no-cache' "https://axiona.systems${route}?axiona_verify=${key}" || true)"
              grep -Fq "$AX_R137" <<<"$html" || ok=0
              grep -Fq "$AX_MOTION_CSS" <<<"$html" || ok=0
              grep -Fq "$AX_MOTION_JS" <<<"$html" || ok=0
              grep -Fq '<main' <<<"$html" || ok=0
            done
            security_txt="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/.well-known/security.txt?axiona_verify=${key}" || true)"
            grep -Fq 'Canonical: https://axiona.systems/.well-known/security.txt' <<<"$security_txt" || ok=0
            grep -Fq 'Policy: https://axiona.systems/security.html' <<<"$security_txt" || ok=0
            if [ "$ok" -eq 1 ]; then
              echo "OK_AXIONA_LIVE_CANONICAL_SURFACE attempt=${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "STOP_AXIONA_LIVE_CANONICAL_SURFACE_NOT_CONVERGED" >&2
          exit 1
