name: One-time public repository cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-public-cleanup.yml"

permissions:
  contents: write
  pages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Build clean active public surface
        shell: bash
        run: |
          set -euo pipefail

          cat assets/styles-r71.css assets/multipage-r78.css > assets/site.css
          cat assets/keeper-r87.css assets/keeper-r94.css assets/keeper-r96.css > assets/keeper.css

          mv assets/policy-r81.css assets/policy.css
          mv assets/share-r86.css assets/share.css
          mv assets/support-r85.css assets/support.css
          mv assets/js/share-r86.js assets/js/share.js
          mv assets/js/visit-counter-r80.js assets/js/visit-counter.js

          mv assets/social/axiona-social-preview-r92-hu.png assets/social/axiona-social-hu.png
          mv assets/social/axiona-social-preview-r92-en.png assets/social/axiona-social-en.png
          mv assets/social/axiona-social-preview-r92-de.png assets/social/axiona-social-de.png
          mv assets/social/axiona-keeper-social-preview-r92-hu.png assets/social/axiona-keeper-social-hu.png
          mv assets/social/axiona-keeper-social-preview-r92-en.png assets/social/axiona-keeper-social-en.png
          mv assets/social/axiona-keeper-social-preview-r92-de.png assets/social/axiona-keeper-social-de.png

          rm -f \
            assets/styles-r71.css \
            assets/multipage-r74.css \
            assets/multipage-r78.css \
            assets/keeper-r87.css \
            assets/keeper-r94.css \
            assets/keeper-r96.css \
            assets/social/axiona-social-preview-r86.png \
            assets/social/axiona-social-preview-r91.png \
            assets/social/axiona-keeper-social-preview-r91.png

          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              "/assets/styles-r71.css": "/assets/site.css",
              "/assets/policy-r81.css": "/assets/policy.css",
              "/assets/share-r86.css": "/assets/share.css",
              "/assets/support-r85.css": "/assets/support.css",
              "/assets/keeper-r87.css": "/assets/keeper.css",
              "/assets/js/share-r86.js": "/assets/js/share.js",
              "/assets/js/visit-counter-r80.js": "/assets/js/visit-counter.js",
              "axiona-social-preview-r92-hu.png": "axiona-social-hu.png",
              "axiona-social-preview-r92-en.png": "axiona-social-en.png",
              "axiona-social-preview-r92-de.png": "axiona-social-de.png",
              "axiona-keeper-social-preview-r92-hu.png": "axiona-keeper-social-hu.png",
              "axiona-keeper-social-preview-r92-en.png": "axiona-keeper-social-en.png",
              "axiona-keeper-social-preview-r92-de.png": "axiona-keeper-social-de.png",
          }

          pages = list(Path('.').glob('*.html')) + list(Path('en').glob('*.html')) + list(Path('de').glob('*.html'))
          for path in pages:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              lines = []
              for line in text.splitlines():
                  if 'multipage-r78.css' in line or 'keeper-r94.css' in line or 'keeper-r96.css' in line:
                      continue
                  if re.search(r'<meta\s+content="R\d+"\s+name="axiona-release"\s*/?>', line):
                      continue
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          # Remove unreferenced duplicate brand assets while preserving manifest icons.
          for candidate in assets/brand/axiona_icon_color.png assets/brand/favicon.svg; do
            if [ -f "$candidate" ]; then
              name="$(basename "$candidate")"
              if ! grep -RFl --exclude-dir=.git "$name" . | grep -vF "$candidate" >/dev/null; then
                rm -f "$candidate"
              fi
            fi
          done

          python3 scripts/verify_site.py

          # This workflow is intentionally absent from the final public tree.
          rm -f .github/workflows/one-time-public-cleanup.yml

      - name: Publish clean single-commit main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tar --exclude=.git -cf /tmp/public-tree.tar .
          git checkout --orphan public-clean
          git rm -rf . >/dev/null 2>&1 || true
          tar -xf /tmp/public-tree.tar
          git add -A
          git commit -m "AXIONA Systems public website"
          git push --force origin HEAD:main

          # Keep Pages on main when the repository uses branch-based publishing.
          PAGE_CONFIG="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages" || true)"
          SOURCE_BRANCH="$(python3 - <<'PY' "$PAGE_CONFIG"
          import json, sys
          try:
              data = json.loads(sys.argv[1])
          except Exception:
              print('')
          else:
              print((data.get('source') or {}).get('branch') or '')
          PY
          )"

          if [ -n "$SOURCE_BRANCH" ] && [ "$SOURCE_BRANCH" != "main" ]; then
            HTTP_CODE="$(curl --silent --show-error --output /tmp/pages-update.json --write-out '%{http_code}' \
              --request PUT \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --header "Content-Type: application/json" \
              --data '{"source":{"branch":"main","path":"/"}}' \
              "https://api.github.com/repos/${REPOSITORY}/pages" || true)"
            if [ "$HTTP_CODE" = "204" ]; then
              SOURCE_BRANCH="main"
            else
              git push --force origin HEAD:"$SOURCE_BRANCH"
            fi
          fi

          # Delete obsolete public branches. Preserve only main and a still-required Pages source.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' || true
          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "main" ] && continue
            [ -n "$SOURCE_BRANCH" ] && [ "$branch" = "$SOURCE_BRANCH" ] && continue
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            curl --fail --silent --show-error \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded}" \
              >/dev/null
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          # Remove obsolete tags if any exist.
          git fetch --tags --force || true
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            git push origin ":refs/tags/$tag"
          done < <(git tag -l)

          # Trigger and verify the public Pages build explicitly because GITHUB_TOKEN pushes do not start new workflows.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds" \
            >/dev/null

          for attempt in $(seq 1 36); do
            STATUS="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')"
            [ "$STATUS" = "built" ] && break
            [ "$STATUS" = "errored" ] && exit 1
            sleep 5
          done

          for attempt in $(seq 1 24); do
            HOME="$(curl --fail --silent --show-error --location https://axiona.systems/ || true)"
            KEEPER="$(curl --fail --silent --show-error --location https://axiona.systems/keeper.html || true)"
            if grep -Fq 'AXIONA Systems' <<<"$HOME" && grep -Fq 'AXIONA KEEPER' <<<"$KEEPER"; then
              echo "OK_AXIONA_PUBLIC_CLEANUP"
              exit 0
            fi
            sleep 5
          done
          echo "Public site verification failed" >&2
          exit 1
