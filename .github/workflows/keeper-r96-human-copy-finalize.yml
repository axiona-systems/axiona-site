name: Keeper R96 Human Copy Finalize

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/keeper-intelligence-story-r96'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/keeper-intelligence-story-r96
      - name: Humanize final Keeper copy and run gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changes = {
            'keeper.html': [
              ('Az AXIONA Keeper fejlesztés alatt álló, local-first dokumentum-asszisztens:', 'Az AXIONA Keeper fejlesztés alatt álló, privát dokumentum-asszisztens:'),
              ('<article class="keeper96-process-step"><span>03 / MEGÉRTÉS</span><h3>Felismeri, milyen iratról lehet szó.</h3><p>Dokumentumtípus-, kategória- és fontosadat-javaslat készülhet. A bizonytalan eredmény nem válik csendben biztos adattá.</p><small>KEEPER: FELISMERI ÉS ÖSSZEFOGLALJA</small></article>', '<article class="keeper96-process-step"><span>03 / MEGÉRTÉS</span><h3>Megérti, mi érkezett.</h3><p>Rövid, közérthető összefoglalót készíthet, és javaslatot adhat a dokumentum típusára és kategóriájára. Ha valami bizonytalan, ellenőrzésre hagyja.</p><small>KEEPER: MEGÉRTI ÉS ÖSSZEFOGLALJA</small></article>'),
              ('<article class="keeper96-trust-card"><span>01</span><h3>Helyi működés az alap.</h3><p>A termék local-first irányra épül: a dokumentumfeldolgozás elsődleges helye a saját készülék.</p></article>', '<article class="keeper96-trust-card"><span>01</span><h3>Lehetőleg a saját készülékeden dolgozik.</h3><p>Az alapelv az, hogy a dokumentum feldolgozása helyben történjen, és ne kelljen feleslegesen továbbítani az irataidat.</p></article>'),
            ],
            'en/keeper.html': [
              ('AXIONA Keeper is a local-first document assistant in development', 'AXIONA Keeper is a private document assistant in development'),
              ('<article class="keeper96-process-step"><span>03 / UNDERSTAND</span><h3>Recognize what kind of document it may be.</h3><p>Keeper can prepare document-type, category and key-field candidates. Uncertainty must not be silently promoted to certainty.</p><small>KEEPER: RECOGNIZES AND SUMMARIZES</small></article>', '<article class="keeper96-process-step"><span>03 / UNDERSTAND</span><h3>Understand what arrived.</h3><p>Keeper can prepare a short plain-language summary and suggest the document type and category. Uncertain results stay open for review.</p><small>KEEPER: UNDERSTANDS AND SUMMARIZES</small></article>'),
              ('<article class="keeper96-trust-card"><span>01</span><h3>Local-first by design.</h3><p>The product direction puts the device at the centre of document processing rather than treating remote processing as the default.</p></article>', '<article class="keeper96-trust-card"><span>01</span><h3>Designed to work on your device where possible.</h3><p>The default direction is to process documents locally instead of sending them elsewhere without a clear need.</p></article>'),
            ],
            'de/keeper.html': [
              ('AXIONA Keeper ist ein local-first Dokumentenassistent in Entwicklung', 'AXIONA Keeper ist ein privater Dokumentenassistent in Entwicklung'),
              ('<article class="keeper96-process-step"><span>03 / VERSTEHEN</span><h3>Erkennen, welche Art Dokument vorliegen könnte.</h3><p>Keeper kann Vorschläge zu Dokumentart, Kategorie und wichtigen Feldern vorbereiten. Unsicherheit darf nicht stillschweigend zu Gewissheit werden.</p><small>KEEPER: ERKENNT UND FASST ZUSAMMEN</small></article>', '<article class="keeper96-process-step"><span>03 / VERSTEHEN</span><h3>Verstehen, was eingegangen ist.</h3><p>Keeper kann eine kurze verständliche Zusammenfassung erstellen und Dokumentart sowie Kategorie vorschlagen. Unsichere Ergebnisse bleiben zur Prüfung offen.</p><small>KEEPER: VERSTEHT UND FASST ZUSAMMEN</small></article>'),
              ('<article class="keeper96-trust-card"><span>01</span><h3>Local-first als Grundlage.</h3><p>Die Produktrichtung stellt das eigene Gerät in den Mittelpunkt der Dokumentverarbeitung, statt entfernte Verarbeitung zum Standard zu machen.</p></article>', '<article class="keeper96-trust-card"><span>01</span><h3>Wo möglich, arbeitet Keeper auf Ihrem Gerät.</h3><p>Grundprinzip ist die lokale Dokumentverarbeitung, damit Unterlagen nicht ohne klaren Grund weitergegeben werden müssen.</p></article>'),
            ],
          }
          for rel, pairs in changes.items():
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'STOP_R96_FINAL_COPY_{rel}_COUNT={count}: {old[:50]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          print('OK_KEEPER_R96_HUMAN_COPY_FINALIZED')
          PY
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/keeper-r96-human-copy-finalize.yml
          git add keeper.html en/keeper.html de/keeper.html
          git commit -m "Finalize human Keeper R96 copy"
          git push origin HEAD:feature/keeper-intelligence-story-r96
