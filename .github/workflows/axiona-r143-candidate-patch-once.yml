name: AXIONA R143 Candidate Patch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r143-candidate-patch-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axiona-r143-candidate-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout main control worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/r143-repo-cleanup-hardening
          path: candidate
          fetch-depth: 2

      - name: Apply exact candidate corrections
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C candidate rev-parse HEAD)"
          EXPECTED=58cc64a90c6eb4f6b291f5996e45ae69f198dc63
          test "$ACTUAL" = "$EXPECTED" || { echo "STOP_R143_PATCH_HEAD expected=${EXPECTED} actual=${ACTUAL}"; exit 1; }
          python3 <<'PY'
          from pathlib import Path

          p=Path('candidate/assets/multipage-r78.css')
          text=p.read_text(encoding='utf-8')
          old='@import url("/assets/multipage-r74.css");\n@import url("/assets/motion-r105.css");\n'
          new='@import url("/assets/visual-r109.css");\n@import url("/assets/visual-r109-compat.css");\n'
          if text.count(old) != 1:
              raise SystemExit('STOP_R143_MULTIPAGE_IMPORT_PATTERN')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('candidate/assets/js/share-r86.js')
          text=p.read_text(encoding='utf-8')
          start="  const motionStyleId = 'axiona-motion-r108';\n"
          end="  const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;\n"
          i=text.find(start); j=text.find(end)
          if i < 0 or j < 0 or j <= i:
              raise SystemExit('STOP_R143_SHARE_BOOTSTRAP_PATTERN')
          text=text[:i]+end+text[j+len(end):]
          p.write_text(text,encoding='utf-8')

          p=Path('candidate/.github/workflows/axiona-browser-audit.yml')
          text=p.read_text(encoding='utf-8')
          if text.count('axe-core@4.12.1') != 1:
              raise SystemExit('STOP_R143_AXE_VERSION_PATTERN')
          p.write_text(text.replace('axe-core@4.12.1','axe-core@4.13.0'),encoding='utf-8')
          PY

      - name: Verify corrected candidate source
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 scripts/verify_asset_references.py
          python3 scripts/verify_workflow_hardening.py
          python3 scripts/verify_site.py
          git diff --check

      - name: Commit corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate config user.name 'AXIONA Release Automation'
          git -C candidate config user.email 'actions@users.noreply.github.com'
          git -C candidate add -A
          git -C candidate commit -m 'R143: flatten remaining compatibility imports and refresh axe'
          git -C candidate push origin HEAD:agent/r143-repo-cleanup-hardening

      - name: Remove one-shot patcher from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/axiona-r143-candidate-patch-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R143: remove completed candidate patcher'
          git push origin HEAD:main
