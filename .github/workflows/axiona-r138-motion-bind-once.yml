name: AXIONA R138 Motion Bind Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r138-motion-bind-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind R138 assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(['git','ls-files','*.html'], text=True).splitlines()
          css = '<link href="/assets/motion-r138.css?release=R138" rel="stylesheet"/>'
          js = '<script src="/assets/js/motion-r138.js?release=R138"></script>'
          checked = 0
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if '</head>' not in text or '</body>' not in text:
                  continue
              text = text.replace(css, '').replace(js, '')
              text = text.replace('</head>', css + '</head>', 1)
              text = text.replace('</body>', js + '</body>', 1)
              p.write_text(text, encoding='utf-8')
              if text.count('/assets/motion-r138.css?release=R138') != 1:
                  raise SystemExit(f'STOP_R138_CSS_BINDING {name}')
              if text.count('/assets/js/motion-r138.js?release=R138') != 1:
                  raise SystemExit(f'STOP_R138_JS_BINDING {name}')
              checked += 1
          if checked < 10:
              raise SystemExit(f'STOP_R138_TOO_FEW_HTML={checked}')
          print(f'OK_R138_BINDINGS={checked}')
          PY

      - name: Record and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/status
          cat > docs/status/R138_SMOOTH_MOTION.md <<'EOF'
          # AXIONA R138 smooth motion

          R138 replaces viewport-edge reveal toggling with a smooth one-shot settled state.

          - 18 px reveal travel on desktop, 12 px on mobile
          - 900 ms transform duration on desktop, 760 ms on mobile
          - cubic-bezier(.16,1,.3,1) easing
          - once revealed, an element stays settled when scrolling away and back
          - prefers-reduced-motion remains static
          - continuous decorative motion remains unchanged

          Binding: PASS
          EOF
          rm -f .github/workflows/axiona-r138-motion-bind-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'R138: bind smooth one-shot motion across public site'
          git push origin HEAD:main
