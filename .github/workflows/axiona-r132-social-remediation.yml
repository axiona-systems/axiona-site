name: AXIONA R132 Social Metadata Remediation

on:
  push:
    branches: [feature/social-metadata-invariants-r132]
    paths:
      - .github/workflows/axiona-r132-social-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/social-metadata-invariants-r132
          fetch-depth: 0

      - name: Restore core social metadata on Support and Policy families
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('support.html'), Path('en/support.html'), Path('de/support.html'),
              Path('privacy.html'), Path('en/privacy.html'), Path('de/privacy.html'),
              Path('legal.html'), Path('en/legal.html'), Path('de/legal.html'),
          ]

          def attr(tag: str, name: str) -> str:
              m = re.search(rf'\b{name}=["\']([^"\']*)["\']', tag, re.I)
              if not m:
                  raise RuntimeError(f'missing {name} in {tag}')
              return m.group(1)

          for path in targets:
              text = path.read_text(encoding='utf-8')
              for marker in ('og:site_name', 'og:title', 'og:description', 'og:type', 'og:url',
                             'twitter:card', 'twitter:title', 'twitter:description'):
                  if marker in text:
                      raise RuntimeError(f'{path}: expected missing marker already present: {marker}')

              title_match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
              if not title_match:
                  raise RuntimeError(f'{path}: title missing')
              title = title_match.group(1).strip()

              desc_tag_match = re.search(r'<meta\b(?=[^>]*\bname=["\']description["\'])[^>]*>', text, re.I)
              if not desc_tag_match:
                  raise RuntimeError(f'{path}: description meta missing')
              description = attr(desc_tag_match.group(0), 'content')

              canonical_tag_match = re.search(r'<link\b(?=[^>]*\brel=["\']canonical["\'])[^>]*>', text, re.I)
              if not canonical_tag_match:
                  raise RuntimeError(f'{path}: canonical missing')
              canonical = attr(canonical_tag_match.group(0), 'href')

              image_match = re.search(r'<meta\b(?=[^>]*\bproperty=["\']og:image["\'])[^>]*>', text, re.I)
              if not image_match:
                  raise RuntimeError(f'{path}: og:image anchor missing')

              block = (
                  f'<meta content="AXIONA Systems" property="og:site_name"/>'
                  f'<meta content="{title}" property="og:title"/>'
                  f'<meta content="{description}" property="og:description"/>'
                  f'<meta content="website" property="og:type"/>'
                  f'<meta content="{canonical}" property="og:url"/>'
                  f'<meta content="summary_large_image" name="twitter:card"/>'
                  f'<meta content="{title}" name="twitter:title"/>'
                  f'<meta content="{description}" name="twitter:description"/>'
              )
              text = text[:image_match.start()] + block + text[image_match.start():]
              path.write_text(text, encoding='utf-8')
          PY

          python3 scripts/verify_site.py
          python3 scripts/verify_social_metadata.py
          git diff --check

      - name: Commit remediation and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/axiona-r132-social-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add support.html en/support.html de/support.html privacy.html en/privacy.html de/privacy.html legal.html en/legal.html de/legal.html
          git commit -m 'R132: restore social metadata parity'
          git push origin HEAD:feature/social-metadata-invariants-r132
