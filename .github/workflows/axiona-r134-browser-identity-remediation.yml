# Branch-local, self-removing migration. Must not survive into main.
name: AXIONA R134 Browser Identity Remediation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/axiona-r134-browser-identity-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'feature/browser-identity-r134'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/browser-identity-r134
          fetch-depth: 0

      - name: Repair 512 manifest icon without distortion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import binascii
          import struct
          import zlib

          path = Path('assets/brand/axiona-icon-512.png')
          raw = path.read_bytes()
          sig = b'\x89PNG\r\n\x1a\n'
          if not raw.startswith(sig):
              raise RuntimeError('512 icon is not PNG')

          pos = 8
          chunks = []
          while pos < len(raw):
              length = struct.unpack('>I', raw[pos:pos+4])[0]
              ctype = raw[pos+4:pos+8]
              data = raw[pos+8:pos+8+length]
              chunks.append((ctype, data))
              pos += 12 + length
              if ctype == b'IEND':
                  break

          ihdr = next(data for ctype, data in chunks if ctype == b'IHDR')
          width, height, bit_depth, color_type, compression, filter_method, interlace = struct.unpack('>IIBBBBB', ihdr)
          if (width, height) == (512, 512):
              print('OK_R134_ICON_ALREADY_SQUARE')
              raise SystemExit(0)
          if (width, height, bit_depth, color_type, compression, filter_method, interlace) != (512, 474, 8, 6, 0, 0, 0):
              raise RuntimeError(f'unexpected source PNG geometry/format: {(width, height, bit_depth, color_type, compression, filter_method, interlace)}')

          compressed = b''.join(data for ctype, data in chunks if ctype == b'IDAT')
          scan = zlib.decompress(compressed)
          bpp = 4
          stride = width * bpp
          expected_len = height * (stride + 1)
          if len(scan) != expected_len:
              raise RuntimeError(f'unexpected decompressed PNG length: {len(scan)} != {expected_len}')

          def paeth(a, b, c):
              p = a + b - c
              pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c

          rows = []
          prev = bytearray(stride)
          offset = 0
          for _ in range(height):
              f = scan[offset]
              src = bytearray(scan[offset+1:offset+1+stride])
              offset += stride + 1
              out = bytearray(stride)
              for i, value in enumerate(src):
                  left = out[i-bpp] if i >= bpp else 0
                  up = prev[i]
                  up_left = prev[i-bpp] if i >= bpp else 0
                  if f == 0:
                      recon = value
                  elif f == 1:
                      recon = (value + left) & 0xff
                  elif f == 2:
                      recon = (value + up) & 0xff
                  elif f == 3:
                      recon = (value + ((left + up) // 2)) & 0xff
                  elif f == 4:
                      recon = (value + paeth(left, up, up_left)) & 0xff
                  else:
                      raise RuntimeError(f'unsupported PNG filter: {f}')
                  out[i] = recon
              rows.append(bytes(out))
              prev = out

          pad_total = 512 - height
          top = pad_total // 2
          bottom = pad_total - top
          transparent = bytes(stride)
          square_rows = [transparent] * top + rows + [transparent] * bottom
          encoded = b''.join(b'\x00' + row for row in square_rows)

          def chunk(ctype, data):
              return struct.pack('>I', len(data)) + ctype + data + struct.pack('>I', binascii.crc32(ctype + data) & 0xffffffff)

          new_ihdr = struct.pack('>IIBBBBB', 512, 512, 8, 6, 0, 0, 0)
          out = sig + chunk(b'IHDR', new_ihdr) + chunk(b'IDAT', zlib.compress(encoded, 9)) + chunk(b'IEND', b'')
          path.write_bytes(out)
          print('OK_R134_ICON_PADDED_512X512')
          PY

      - name: Normalize identity links on all public HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          routes=(
              'index.html','systems.html','process.html','security.html','solutions.html',
              'keeper.html','contact.html','privacy.html','legal.html','support.html'
          )
          targets=[Path(route) for route in routes]
          targets += [Path('en')/route for route in routes]
          targets += [Path('de')/route for route in routes]
          targets += [Path('404.html')]

          block=(
              '<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>'
              '<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32"/>'
              '<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16"/>'
              '<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"/>'
              '<link rel="manifest" href="/site.webmanifest"/>'
          )

          link_re=re.compile(r'<link\b[^>]*>',re.I)
          rel_re=re.compile(r'\brel=["\']([^"\']+)["\']',re.I)

          for path in targets:
              text=path.read_text(encoding='utf-8')
              def keep_or_remove(match):
                  tag=match.group(0)
                  rel=rel_re.search(tag)
                  if not rel:
                      return tag
                  tokens={token.lower() for token in rel.group(1).split()}
                  if tokens & {'icon','apple-touch-icon','manifest'}:
                      return ''
                  return tag
              text=link_re.sub(keep_or_remove,text)
              if '</head>' not in text:
                  raise RuntimeError(f'{path}: </head> missing')
              text=text.replace('</head>',block+'</head>',1)
              text=re.sub(r'[ \t]+(?=\n|$)', '', text)
              path.write_text(text,encoding='utf-8')
          PY

          python3 scripts/verify_site.py
          python3 scripts/verify_social_metadata.py
          python3 scripts/verify_browser_identity.py
          git diff --check

      - name: Commit remediation and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/axiona-r134-browser-identity-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' en/*.html de/*.html assets/brand/axiona-icon-512.png
          git commit -m 'R134: normalize browser identity bindings'
          git push origin HEAD:feature/browser-identity-r134
