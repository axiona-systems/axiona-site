name: AXIONA Utility R127 Route Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 404.html
      - en/404.html
      - de/404.html
      - assets/not-found-r126.css
      - assets/js/not-found-r126.js
      - .github/workflows/axiona-utility-r127-route-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-contract:
    name: Verify single-source localized 404 routing
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify single physical 404 source
        shell: bash
        run: |
          set -euo pipefail
          test -f 404.html
          test ! -e en/404.html
          test ! -e de/404.html
          grep -Fq '/assets/not-found-r126.css?release=R126' 404.html
          grep -Fq '/assets/js/not-found-r126.js?release=R126' 404.html
          grep -Fq 'name="axiona-release" content="R126"' 404.html
          ! grep -R -E 'impact\.html|applications\.html|automation\.html|company\.html|case-study\.html|practical-tips\.html' --include='404.html' .
          echo OK_AXIONA_R127_SINGLE_PHYSICAL_404_SOURCE
      - name: Prepare 404-aware browser server
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || exit 1
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          cat >/tmp/r127-server.mjs <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.cwd();
          const types={'.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8','.js':'text/javascript; charset=utf-8','.png':'image/png','.ico':'image/x-icon'};
          http.createServer((req,res)=>{
            const pathname=decodeURIComponent(new URL(req.url,'http://local').pathname);
            let file=path.join(root, pathname==='/' ? 'index.html' : pathname.replace(/^\//,''));
            let status=200;
            if(!fs.existsSync(file)||fs.statSync(file).isDirectory()){file=path.join(root,'404.html');status=404;}
            res.writeHead(status,{'Content-Type':types[path.extname(file)]||'application/octet-stream','Cache-Control':'no-store'});
            fs.createReadStream(file).pipe(res);
          }).listen(4184,'127.0.0.1');
          NODE
          node /tmp/r127-server.mjs >/tmp/r127-http.log 2>&1 &
          for i in {1..20}; do code="$(curl -sS -o /tmp/r127-probe -w '%{http_code}' http://127.0.0.1:4184/en/404.html || true)"; [ "$code" = 404 ] && exit 0; sleep .25; done
          cat /tmp/r127-http.log || true
          exit 1
      - name: Verify physical aliases and missing routes resolve through root SSOT
        shell: bash
        env:
          BASE: http://127.0.0.1:4184
        run: |
          set -euo pipefail
          mkdir -p /tmp/r127-shots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
          const cases=[
            ['/missing-r127','hu','Ez az oldal nincs itt.','/solutions.html'],
            ['/en/404.html','en','This page is not here.','/en/solutions.html'],
            ['/en/missing-r127','en','This page is not here.','/en/solutions.html'],
            ['/de/404.html','de','Diese Seite ist nicht hier.','/de/solutions.html'],
            ['/de/missing-r127','de','Diese Seite ist nicht hier.','/de/solutions.html']
          ];
          for(const [route,lang,heading,solutionsHref] of cases){
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const response=await page.goto(process.env.BASE+route,{waitUntil:'networkidle'});
            if(response.status()!==404) throw Error(route+' expected 404 got '+response.status());
            const r=await page.evaluate(()=>({
              release:document.querySelector('meta[name="axiona-release"]')?.content,
              lang:document.documentElement.lang,
              h1:(document.querySelector('main h1')?.textContent||'').trim(),
              css:[...document.styleSheets].some(x=>(x.href||'').includes('/assets/not-found-r126.css?release=R126')),
              js:[...document.scripts].some(x=>(x.src||'').includes('/assets/js/not-found-r126.js?release=R126')),
              solutions:document.querySelector('.not-found-route[data-route="solutions"]')?.getAttribute('href'),
              active:document.querySelector('.language-switch a.active')?.getAttribute('data-locale'),
              robots:document.querySelector('meta[name="robots"]')?.content,
              legacy:[...document.querySelectorAll('a')].some(a=>/impact\.html|applications\.html|automation\.html|company\.html|case-study\.html|practical-tips\.html/.test(a.getAttribute('href')||'')),
              sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth
            }));
            if(r.release!=='R126'||r.lang!==lang||r.h1!==heading||!r.css||!r.js) throw Error(route+' SSOT/localization');
            if(r.solutions!==solutionsHref||r.active!==lang||r.robots!=='noindex,follow'||r.legacy||r.sw>r.cw+2) throw Error(route+' route/semantics');
            if(route==='/en/404.html'||route==='/de/404.html') await page.screenshot({path:`/tmp/r127-shots/${lang}-deleted-alias-fallback.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          console.log('OK_AXIONA_UTILITY_R127_ROUTE_CONTRACT');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axiona-r127-utility-route-evidence
          path: /tmp/r127-shots/*.png
          if-no-files-found: error
          retention-days: 3
