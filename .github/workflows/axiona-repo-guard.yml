name: AXIONA Repo Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiona-repo-guard-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guard:
    name: AXIONA Repository Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run AXIONA repository invariants
        shell: bash
        run: |
          set -uo pipefail

          FAIL=0
          OLD_OWNER="fakukac1980"
          OLD_REPO="AXIONA_CI"
          OLD_ANCHOR="${OLD_OWNER}/${OLD_REPO}"
          KEY_PATTERN="BEGIN (RSA |OPENSSH |DSA |EC )?PRIVATE KEY"

          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo "REF=$GITHUB_REF"
          echo "SHA=$GITHUB_SHA"

          echo "=== Legacy global rule anchor gate ==="
          if grep -RIn "$OLD_ANCHOR" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=BUILD \
            --exclude-dir=DerivedData; then
            echo "STOP_AXIONA_LEGACY_RULE_ANCHOR_FOUND"
            FAIL=1
          else
            echo "OK_AXIONA_NO_LEGACY_RULE_ANCHOR"
          fi

          echo "=== Junk artifact gate ==="
          JUNK_LIST="$(find . \
            -path './.git' -prune -o \
            -path './BUILD' -prune -o \
            -path '*/DerivedData/*' -prune -o \
            \( -name '.DS_Store' -o -name '__MACOSX' -o -name '*.pyc' -o -name '.pytest_cache' -o -name '.mypy_cache' \) \
            -print)"
          if [ -n "$JUNK_LIST" ]; then
            echo "$JUNK_LIST"
            echo "STOP_AXIONA_JUNK_ARTIFACT_FOUND"
            FAIL=1
          else
            echo "OK_AXIONA_NO_JUNK_ARTIFACTS"
          fi

          echo "=== Obvious private key gate ==="
          if grep -RInE "$KEY_PATTERN" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=BUILD \
            --exclude-dir=DerivedData; then
            echo "STOP_AXIONA_PRIVATE_KEY_MATERIAL_FOUND"
            FAIL=1
          else
            echo "OK_AXIONA_NO_PRIVATE_KEY_MATERIAL"
          fi

          echo "=== Diff whitespace gate ==="
          BASE_SHA="${PR_BASE_SHA:-}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${PUSH_BEFORE_SHA:-}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          if git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            if git diff --check "$BASE_SHA" HEAD; then
              echo "OK_AXIONA_DIFF_WHITESPACE_GATE"
            else
              echo "STOP_AXIONA_DIFF_WHITESPACE_GATE_FAILED"
              FAIL=1
            fi
          else
            echo "WARN_AXIONA_DIFF_BASE_UNAVAILABLE_SKIP_WHITESPACE_GATE=$BASE_SHA"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "STOP_AXIONA_REPOSITORY_GUARD_FAILED"
            exit 1
          fi

          echo "OK_AXIONA_REPOSITORY_GUARD_PASSED"
