name: AXIONA Public Surface Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiona-public-surface-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public source and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify v4 public surface, generator freshness and links
        shell: bash
        run: python3 scripts/verify_site.py

      - name: Verify security.txt
        shell: bash
        run: python3 scripts/verify_security_txt.py

      - name: Verify retired routes stay retired
        shell: bash
        run: python3 scripts/verify_retired_routes.py

      - name: Verify brand consumer boundary
        shell: bash
        run: python3 scripts/verify_brand_consumer_boundary.py

      - name: Verify browser audit coverage
        shell: bash
        run: python3 scripts/verify_browser_audit_matrix.py

      - name: Verify Actions hardening
        shell: bash
        run: python3 scripts/verify_workflow_hardening.py

      - name: Verify diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          fi
