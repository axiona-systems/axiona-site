name: AXIONA Public Surface Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiona-public-surface-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public source and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify current public surface
        shell: bash
        run: python3 scripts/verify_site.py

      - name: Verify sitemap locale families
        shell: bash
        run: python3 scripts/verify_sitemap_hreflang.py

      - name: Verify RFC 9116 security.txt
        shell: bash
        run: python3 scripts/verify_security_txt.py

      - name: Verify social metadata
        shell: bash
        run: python3 scripts/verify_social_metadata.py

      - name: Verify retired public routes
        shell: bash
        run: python3 scripts/verify_retired_routes.py

      - name: Verify browser identity metadata
        shell: bash
        run: python3 scripts/verify_browser_identity.py

      - name: Verify runtime asset graph
        shell: bash
        run: python3 scripts/verify_asset_references.py

      - name: Verify canonical brand master
        shell: bash
        run: python3 scripts/verify_brand_master.py

      - name: Verify Actions hardening
        shell: bash
        run: python3 scripts/verify_workflow_hardening.py

      - name: Verify diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          fi
