name: Keeper Overview R95 Migration

on:
  push:
    branches:
      - fix/keeper-overview-benefit-r95
    paths:
      - ".github/workflows/keeper-overview-r95-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/keeper-overview-benefit-r95
      - name: Replace overview Keeper story with benefit-first summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          sections = {
              'index.html': '''    <section class="keeper-preview section-pad">
      <div class="keeper-preview-copy">
        <div class="keeper-status-line"><b class="keeper-status-badge">FEJLESZTÉS ALATT</b><span class="micro">iPhone + iPad</span></div>
        <h2>AXIONA Keeper<span>Amikor kell egy irat, ne a kereséssel kezdődjön.</span></h2>
        <p class="keeper-preview-lead">A Keeper abban segít, hogy egy fontos ügyhöz ne kelljen újra meg újra összeszedned, hol vannak az iratok és mire kell még figyelni. Az összetartozó dokumentumok egy ügyben maradnak, a fontos dátumok és teendők pedig nem vesznek el közöttük. Amikor előveszel egy ügyet, gyorsan látod, mi van meg és mi következik.</p>
        <div class="actions"><a class="button button-dark" href="/keeper.html">A Keeper megismerése<span>→</span></a><a class="text-link" href="/keeper.html#hogyan-mukodik">Részletesen hogyan működik?<span>↗</span></a></div>
      </div>
      <aside class="keeper-benefit-panel" aria-label="Miben segít a Keeper?">
        <div class="keeper-benefit-head"><span>MIBEN SEGÍT?</span><b>RÖVIDEN</b></div>
        <div class="keeper-benefit-list">
          <article class="keeper-benefit-item"><span>01</span><div><strong>Nem kell végigkeresned a telefont, az e-mailt és a mappákat.</strong><p>Az összetartozó iratok ugyanahhoz az ügyhöz kerülnek.</p></div></article>
          <article class="keeper-benefit-item"><span>02</span><div><strong>Nem kell fejben tartanod, mi mihez tartozott.</strong><p>A dokumentumok kapcsolata és az ügy előzménye együtt marad.</p></div></article>
          <article class="keeper-benefit-item"><span>03</span><div><strong>Nem kell újra kitalálnod, mi a következő teendő.</strong><p>A fontos dátumok és a következő lépés az ügy mellett látszanak.</p></div></article>
        </div>
        <div class="keeper-benefit-outcome"><span>EREDMÉNY</span><strong>Kevesebb keresgélés. Kevesebb elfelejtett teendő.</strong></div>
      </aside>
    </section>''',
              'en/index.html': '''    <section class="keeper-preview section-pad">
      <div class="keeper-preview-copy">
        <div class="keeper-status-line"><b class="keeper-status-badge">IN DEVELOPMENT</b><span class="micro">iPhone + iPad</span></div>
        <h2>AXIONA Keeper<span>When you need a document, don't start by searching for it.</span></h2>
        <p class="keeper-preview-lead">Keeper helps keep the documents, dates and next steps for one matter together. Instead of searching your phone, inbox and folders again, you can open the matter and see what is already there, what belongs with it and what still needs attention.</p>
        <div class="actions"><a class="button button-dark" href="/en/keeper.html">Explore Keeper<span>→</span></a><a class="text-link" href="/en/keeper.html#how-it-works">See how it works in detail<span>↗</span></a></div>
      </div>
      <aside class="keeper-benefit-panel" aria-label="How Keeper helps">
        <div class="keeper-benefit-head"><span>HOW IT HELPS</span><b>IN SHORT</b></div>
        <div class="keeper-benefit-list">
          <article class="keeper-benefit-item"><span>01</span><div><strong>Stop searching your phone, inbox and folders for the same matter.</strong><p>Related documents stay connected to one matter.</p></div></article>
          <article class="keeper-benefit-item"><span>02</span><div><strong>Stop relying on memory to know what belongs together.</strong><p>The document relationships and the history of the matter stay visible.</p></div></article>
          <article class="keeper-benefit-item"><span>03</span><div><strong>Stop reconstructing what needs to happen next.</strong><p>Important dates and the next action stay with the matter.</p></div></article>
        </div>
        <div class="keeper-benefit-outcome"><span>RESULT</span><strong>Less searching. Fewer forgotten follow-ups.</strong></div>
      </aside>
    </section>''',
              'de/index.html': '''    <section class="keeper-preview section-pad">
      <div class="keeper-preview-copy">
        <div class="keeper-status-line"><b class="keeper-status-badge">IN ENTWICKLUNG</b><span class="micro">iPhone + iPad</span></div>
        <h2>AXIONA Keeper<span>Wenn Sie ein Dokument brauchen, sollte die Suche nicht der erste Schritt sein.</span></h2>
        <p class="keeper-preview-lead">Keeper hält Unterlagen, Termine und nächste Schritte eines Vorgangs zusammen. Statt Telefon, Postfach und Ordner erneut zu durchsuchen, öffnen Sie den Vorgang und sehen, was bereits vorhanden ist, was dazugehört und worum Sie sich noch kümmern müssen.</p>
        <div class="actions"><a class="button button-dark" href="/de/keeper.html">Keeper kennenlernen<span>→</span></a><a class="text-link" href="/de/keeper.html#so-funktioniert-es">Im Detail: So funktioniert es<span>↗</span></a></div>
      </div>
      <aside class="keeper-benefit-panel" aria-label="Wobei Keeper hilft">
        <div class="keeper-benefit-head"><span>WOBEI HILFT KEEPER?</span><b>KURZ GESAGT</b></div>
        <div class="keeper-benefit-list">
          <article class="keeper-benefit-item"><span>01</span><div><strong>Nicht mehr Telefon, Postfach und Ordner nach demselben Vorgang durchsuchen.</strong><p>Zugehörige Unterlagen bleiben mit einem Vorgang verbunden.</p></div></article>
          <article class="keeper-benefit-item"><span>02</span><div><strong>Nicht mehr im Kopf behalten, was zusammengehört.</strong><p>Zusammenhänge und Verlauf des Vorgangs bleiben sichtbar.</p></div></article>
          <article class="keeper-benefit-item"><span>03</span><div><strong>Nicht jedes Mal neu überlegen, was als Nächstes ansteht.</strong><p>Wichtige Termine und der nächste Schritt bleiben beim Vorgang.</p></div></article>
        </div>
        <div class="keeper-benefit-outcome"><span>ERGEBNIS</span><strong>Weniger suchen. Weniger offene Schritte vergessen.</strong></div>
      </aside>
    </section>'''
          }

          pattern = re.compile(r'    <section class="keeper-preview section-pad">.*?    </section>', re.S)
          for rel, replacement in sections.items():
              path = root / rel
              text = path.read_text(encoding='utf-8')
              matches = pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f'STOP_R95_KEEPER_SECTION_COUNT {rel} count={len(matches)}')
              path.write_text(pattern.sub(replacement, text, count=1), encoding='utf-8')

          css_path = root / 'assets/keeper-r94.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* AXIONA R95 — overview benefit panel. */'
          if marker in css:
              raise SystemExit('STOP_R95_CSS_ALREADY_PRESENT')
          css += '''\n\n/* AXIONA R95 — overview benefit panel. */
.keeper-benefit-panel{
  background:#fbfaf6;
  color:var(--ink);
  border:1px solid #8fa0a2;
  box-shadow:14px 14px 0 #08181b;
  overflow:hidden;
}
.keeper-benefit-head{
  min-height:52px;
  padding:0 20px;
  border-bottom:1px solid #c8cfcc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  background:#f5f6f1;
}
.keeper-benefit-head span{
  color:#4b5c60;
  font:850 9px/1 monospace;
  letter-spacing:.15em;
}
.keeper-benefit-head b{
  background:var(--navy);
  color:var(--acid);
  padding:7px 9px;
  font:850 9px/1 monospace;
  letter-spacing:.09em;
}
.keeper-benefit-list{padding:7px 22px 9px}
.keeper-benefit-item{
  display:grid;
  grid-template-columns:34px minmax(0,1fr);
  gap:14px;
  padding:20px 2px;
  border-bottom:1px solid #d9d5cc;
}
.keeper-benefit-item:last-child{border-bottom:0}
.keeper-benefit-item>span{
  color:#9b3f24;
  font:900 11px/1.35 monospace;
}
.keeper-benefit-item strong{
  display:block;
  font-size:15px;
  line-height:1.38;
  letter-spacing:-.01em;
}
.keeper-benefit-item p{
  margin:7px 0 0;
  color:#555e5a;
  font-size:12px;
  line-height:1.55;
}
.keeper-benefit-outcome{
  border-top:1px solid #3d595f;
  background:var(--navy);
  color:var(--white);
  padding:18px 20px 20px;
  display:grid;
  gap:7px;
}
.keeper-benefit-outcome span{
  color:var(--acid);
  font:900 9px/1 monospace;
  letter-spacing:.14em;
}
.keeper-benefit-outcome strong{font-size:15px;line-height:1.4}
@media (max-width:760px){
  .keeper-benefit-panel{box-shadow:9px 9px 0 #08181b}
  .keeper-benefit-head{padding-left:16px;padding-right:16px}
  .keeper-benefit-list{padding-left:16px;padding-right:16px}
  .keeper-benefit-outcome{padding-left:16px;padding-right:16px}
}
'''
          css_path.write_text(css, encoding='utf-8')

          gate_path = root / 'scripts/verify_public_quality.py'
          gate = gate_path.read_text(encoding='utf-8')
          old = '''        for source in (homepage, solutions):
            text = source.read_text(encoding="utf-8") if source.is_file() else ""
            if f'href="{keeper_href}"' not in text:
                errors.append(f"Keeper product entry link missing in {source}: {keeper_href}")
            if "/assets/keeper-r87.css" not in text:
                errors.append(f"Keeper stylesheet missing from product entry page: {source}")
            if "/assets/keeper-r94.css" not in text:
                errors.append(f"Keeper R94 product-story stylesheet missing from product entry page: {source}")
            if 'class="keeper-matter-demo keeper-matter-demo--compact"' not in text:
                errors.append(f"Keeper R94 matter demo missing from product entry page: {source}")
            for marker in KEEPER_PLATFORM_MARKERS:
                if marker not in text:
                    errors.append(f"Keeper platform marker missing in {source}: {marker}")
'''
          new = '''        for source in (homepage, solutions):
            text = source.read_text(encoding="utf-8") if source.is_file() else ""
            if f'href="{keeper_href}"' not in text:
                errors.append(f"Keeper product entry link missing in {source}: {keeper_href}")
            if "/assets/keeper-r87.css" not in text:
                errors.append(f"Keeper stylesheet missing from product entry page: {source}")
            if "/assets/keeper-r94.css" not in text:
                errors.append(f"Keeper R94 product-story stylesheet missing from product entry page: {source}")
            for marker in KEEPER_PLATFORM_MARKERS:
                if marker not in text:
                    errors.append(f"Keeper platform marker missing in {source}: {marker}")

        homepage_text = homepage.read_text(encoding="utf-8") if homepage.is_file() else ""
        if 'class="keeper-benefit-panel"' not in homepage_text:
            errors.append(f"Keeper R95 overview benefit panel missing from product entry page: {homepage}")
        if 'class="keeper-matter-demo keeper-matter-demo--compact"' in homepage_text:
            errors.append(f"Keeper detailed matter demo must remain off overview page: {homepage}")

        solutions_text = solutions.read_text(encoding="utf-8") if solutions.is_file() else ""
        if 'class="keeper-matter-demo keeper-matter-demo--compact"' not in solutions_text:
            errors.append(f"Keeper R94 matter demo missing from solutions page: {solutions}")
'''
          if gate.count(old) != 1:
              raise SystemExit(f'STOP_R95_GATE_BLOCK_COUNT count={gate.count(old)}')
          gate_path.write_text(gate.replace(old, new, 1), encoding='utf-8')
          print('OK_KEEPER_OVERVIEW_R95_PATCHED')
          PY

          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py

          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keeper-overview-r95-migration.yml
          git add index.html en/index.html de/index.html assets/keeper-r94.css scripts/verify_public_quality.py
          git commit -m "Focus Keeper overview on visitor benefits"
          git push origin HEAD:fix/keeper-overview-benefit-r95
