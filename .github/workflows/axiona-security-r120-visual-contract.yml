name: AXIONA Security R120 Visual Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "security.html"
      - "en/security.html"
      - "de/security.html"
      - "assets/security-r120.css"
      - "assets/js/security-r120.js"
      - ".github/workflows/axiona-security-r120-visual-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contract:
    name: Verify rendered security page contract
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify browser runtime
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "STOP_AXIONA_SECURITY_R120_CHROME_MISSING"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Install pinned render inspector
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4177 --bind 127.0.0.1 > /tmp/axiona-r120-http.log 2>&1 &
          echo $! > /tmp/axiona-r120-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4177/security.html >/dev/null; then
              echo "OK_AXIONA_SECURITY_R120_SERVER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/axiona-r120-http.log || true
          exit 1

      - name: Verify R120 security composition, parity and motion
        shell: bash
        env:
          AXIONA_BASE: http://127.0.0.1:4177
        run: |
          set -euo pipefail
          mkdir -p /tmp/r120-shots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox']
          });
          const routes = [
            ['/security.html', 'hu'],
            ['/en/security.html', 'en'],
            ['/de/security.html', 'de']
          ];
          const rgb = (value, triplet) => value?.includes(triplet);

          async function inspect(route, lang, label, width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(`${process.env.AXIONA_BASE}${route}`, { waitUntil: 'networkidle' });

            const cssText = await page.evaluate(async () => (await fetch('/assets/security-r120.css?contract=R120')).text());
            const jsText = await page.evaluate(async () => (await fetch('/assets/js/security-r120.js?contract=R120')).text());
            if (!cssText.includes('AXIONA R120 — Security page visual contract')) throw new Error(`${route} R120 CSS marker missing`);
            if (!jsText.includes('AXIONA R120 — repeatable, progressive-enhancement security reveal motion')) throw new Error(`${route} R120 JS marker missing`);

            const result = await page.evaluate(() => {
              const style = (selector) => {
                const el = document.querySelector(selector);
                if (!el) return null;
                const s = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  width: Math.round(r.width), height: Math.round(r.height), display: s.display,
                  grid: s.gridTemplateColumns, background: s.backgroundColor, backgroundImage: s.backgroundImage,
                  color: s.color, boxShadow: s.boxShadow, cursor: s.cursor,
                  transform: s.transform, opacity: s.opacity
                };
              };
              const styleHrefs = [...document.styleSheets].map((sheet) => sheet.href || '');
              const scripts = [...document.scripts].map((script) => script.src || '');
              return {
                release: document.querySelector('meta[name="axiona-release"]')?.content || null,
                lang: document.documentElement.lang,
                directCss: styleHrefs.some((href) => href.includes('/assets/security-r120.css?release=R120')),
                directJs: scripts.some((src) => src.includes('/assets/js/security-r120.js?release=R120')),
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                counts: {
                  h1: document.querySelectorAll('main h1').length,
                  baseline: document.querySelectorAll('.security-baseline').length,
                  checks: document.querySelectorAll('.security-checks > div').length,
                  principles: document.querySelectorAll('.security-principles article').length,
                  trust: document.querySelectorAll('.security-trust-card').length,
                  threats: document.querySelectorAll('.security-threat').length,
                  proof: document.querySelectorAll('.security-proof-list article').length,
                  pledge: document.querySelectorAll('.security-pledge').length,
                  share: document.querySelectorAll('.ax-share').length,
                  footer: document.querySelectorAll('footer').length
                },
                body: style('body'),
                opening: style('.security'),
                dossier: style('.security-layout'),
                baseline: style('.security-baseline'),
                check: style('.security-checks > div'),
                principle: style('.security-principles article'),
                trust: style('.security-trust-card'),
                threatsFrame: style('.security-threats'),
                threat: style('.security-threat'),
                proofFrame: style('.security-proof-list'),
                proof: style('.security-proof-list article'),
                pledge: style('.security-pledge')
              };
            });

            console.log(`AXIONA_SECURITY_R120_${lang.toUpperCase()}_${label.toUpperCase()}=${JSON.stringify(result)}`);
            if (result.release !== 'R120') throw new Error(`${route} release ${result.release}, expected R120`);
            if (result.lang !== lang) throw new Error(`${route} html lang ${result.lang}, expected ${lang}`);
            if (!result.directCss || !result.directJs) throw new Error(`${route} direct R120 binding incomplete`);
            if (result.scrollWidth > result.clientWidth + 2) throw new Error(`${route} ${label} horizontal overflow ${result.scrollWidth}/${result.clientWidth}`);

            const c = result.counts;
            if (c.h1 !== 1 || c.baseline !== 1 || c.checks !== 6 || c.principles !== 6 || c.trust !== 6 || c.threats !== 6 || c.proof !== 6 || c.pledge !== 1 || c.share !== 1 || c.footer !== 1) {
              throw new Error(`${route} structural contract mismatch: ${JSON.stringify(c)}`);
            }

            if (!rgb(result.body?.background, '241, 238, 230')) throw new Error(`${route} warm paper body missing`);
            if (!rgb(result.opening?.background, '241, 238, 230')) throw new Error(`${route} security opening is not warm paper`);
            if (!rgb(result.dossier?.background, '11, 30, 37')) throw new Error(`${route} opening dossier lost petrol containment`);
            if (!rgb(result.baseline?.background, '255, 253, 248')) throw new Error(`${route} baseline is not a stable document surface`);
            if (!rgb(result.check?.background, '255, 253, 248')) throw new Error(`${route} baseline check row changed unexpectedly`);
            if (!rgb(result.principle?.background, '251, 250, 246')) throw new Error(`${route} security principles are not stable off-white surfaces`);
            if (!rgb(result.trust?.background, '251, 250, 246')) throw new Error(`${route} practical trust cards are not stable surfaces`);
            if (!rgb(result.threatsFrame?.background, '11, 30, 37')) throw new Error(`${route} failure-mode chapter lost petrol containment`);
            if (!rgb(result.threat?.background, '251, 250, 246')) throw new Error(`${route} threat rows are not readable document surfaces`);
            if (!rgb(result.proofFrame?.background, '11, 30, 37')) throw new Error(`${route} proof list lost petrol frame`);
            if (!rgb(result.proof?.background, '251, 250, 246')) throw new Error(`${route} proof rows are not stable surfaces`);
            if (!rgb(result.pledge?.background, '240, 213, 200')) throw new Error(`${route} security pledge changed unexpectedly`);

            for (const [name, item] of Object.entries({ check: result.check, principle: result.principle, trust: result.trust, threat: result.threat, proof: result.proof })) {
              if (item?.cursor !== 'default') throw new Error(`${route} ${name} informational surface advertises clickability: ${item?.cursor}`);
              if (item?.opacity !== '1') throw new Error(`${route} ${name} reveal surface opacity must remain 1`);
            }
            if (result.opening?.backgroundImage !== 'none') throw new Error(`${route} opening regained decorative technical background graphics`);

            if (route === '/security.html' && label === 'desktop') {
              const probe = page.locator('.security-trust-card').first();
              await probe.scrollIntoViewIfNeeded();
              await page.waitForTimeout(220);
              if (!(await probe.evaluate((el) => el.classList.contains('is-visible')))) throw new Error('R120 reveal did not activate');
              await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
              await page.waitForTimeout(260);
              if (await probe.evaluate((el) => el.classList.contains('is-visible'))) throw new Error('R120 reveal remained permanently latched');
              await probe.scrollIntoViewIfNeeded();
              await page.waitForTimeout(220);
              if (!(await probe.evaluate((el) => el.classList.contains('is-visible')))) throw new Error('R120 reveal did not reactivate on return scroll');
            }

            await page.evaluate(() => {
              document.querySelectorAll('[data-security-reveal]').forEach((el) => el.classList.add('is-visible'));
              window.scrollTo({ top: 0, behavior: 'instant' });
            });
            await page.waitForTimeout(80);
            await page.screenshot({ path: `/tmp/r120-shots/axiona-security-r120-${lang}-${label}-full.png`, fullPage: true });
            if (lang === 'hu' && label === 'desktop') {
              await page.locator('.security').screenshot({ path: '/tmp/r120-shots/axiona-security-r120-hu-opening.png' });
              await page.locator('.security-trust').screenshot({ path: '/tmp/r120-shots/axiona-security-r120-hu-practical.png' });
              await page.locator('.security-threats').screenshot({ path: '/tmp/r120-shots/axiona-security-r120-hu-threats.png' });
              await page.locator('.security-trust-proof').screenshot({ path: '/tmp/r120-shots/axiona-security-r120-hu-proof.png' });
            }
            await page.close();
          }

          for (const [route, lang] of routes) {
            await inspect(route, lang, 'desktop', 1440, 1000);
            await inspect(route, lang, 'mobile', 390, 844);
          }
          await browser.close();
          console.log('OK_AXIONA_SECURITY_R120_VISUAL_CONTRACT');
          NODE

      - name: Upload R120 rendered evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axiona-security-r120-render-evidence
          path: /tmp/r120-shots/*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
