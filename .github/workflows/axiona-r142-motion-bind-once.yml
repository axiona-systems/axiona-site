name: AXIONA R142 Motion Bind Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r142-motion-bind-once.yml'

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind R142 motion assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(['git','ls-files','*.html'], text=True).splitlines()
          checked=0
          for name in files:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if '</head>' not in text or '</body>' not in text:
                  continue
              text=text.replace('/assets/motion-r138.css?release=R141','/assets/motion-r138.css?release=R142')
              text=text.replace('/assets/js/motion-r138.js?release=R141','/assets/js/motion-r138.js?release=R142')
              if text.count('/assets/motion-r138.css?release=R142')!=1:
                  raise SystemExit(f'STOP_R142_CSS {name}')
              if text.count('/assets/js/motion-r138.js?release=R142')!=1:
                  raise SystemExit(f'STOP_R142_JS {name}')
              p.write_text(text,encoding='utf-8')
              checked+=1
          if checked<10:
              raise SystemExit(f'STOP_R142_TOO_FEW={checked}')
          print(f'OK_R142_BINDINGS={checked}')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/status
          cat > docs/status/R142_MOTION_TIMING.md <<'EOF'
          # AXIONA R142 motion timing
          - desktop transform duration: 900 ms
          - mobile transform duration: 760 ms
          - distance unchanged: 7 px desktop / 5 px mobile
          - easing softened to cubic-bezier(.20,.62,.22,1)
          - bidirectional return behavior retained
          EOF
          rm -f .github/workflows/axiona-r142-motion-bind-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'R142: bind slower reveal timing'
          git push origin HEAD:main
