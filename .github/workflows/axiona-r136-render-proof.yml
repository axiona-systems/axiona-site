name: AXIONA R136 Render Proof

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/axiona-r136-render-proof.yml"

permissions:
  contents: write

jobs:
  rendered-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || { echo "STOP_R136_CHROME_MISSING" >&2; exit 1; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Install pinned render inspector
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/axiona-r136-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4176/systems.html >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/axiona-r136-http.log || true
          exit 1

      - name: Verify computed R136 geometry and current-page state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/status
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ['--no-sandbox'] });
          const routes = ['/', '/systems.html', '/process.html', '/security.html', '/solutions.html', '/contact.html', '/support.html'];
          const rows = [];

          for (const route of routes) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto(`http://127.0.0.1:4176${route}`, { waitUntil: 'networkidle' });
            const result = await page.evaluate(() => {
              const sheets = [...document.styleSheets].map(s => s.href || '');
              const active = document.querySelector('.topbar nav a.active');
              const activeStyle = active ? getComputedStyle(active) : null;
              return {
                r136: sheets.some(h => h.includes('/assets/r136-ux-fixes.css?release=R136')),
                activeCount: document.querySelectorAll('.topbar nav a.active').length,
                activeText: active?.textContent?.trim() || '',
                activeBoxShadow: activeStyle?.boxShadow || 'none'
              };
            });
            if (!result.r136) throw new Error(`${route}: R136 stylesheet missing`);
            if (route !== '/support.html' && result.activeCount !== 1) throw new Error(`${route}: active nav count ${result.activeCount}`);
            if (route !== '/support.html' && result.activeBoxShadow === 'none') throw new Error(`${route}: active nav has no persistent computed marker`);
            rows.push({ route, ...result });
            await page.close();
          }

          const systems = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await systems.goto('http://127.0.0.1:4176/systems.html', { waitUntil: 'networkidle' });
          const desktop = await systems.evaluate(() => {
            const board = document.querySelector('.system-board').getBoundingClientRect();
            const copy = document.querySelector('.system-service .service-copy').getBoundingClientRect();
            const service = getComputedStyle(document.querySelector('.system-service'));
            return {
              boardRight: board.right,
              copyLeft: copy.left,
              gapPx: copy.left - board.right,
              computedGap: service.columnGap,
              overlap: board.right > copy.left
            };
          });
          if (desktop.overlap) throw new Error(`systems desktop overlap: ${JSON.stringify(desktop)}`);
          if (desktop.gapPx < 17) throw new Error(`systems desktop gap too small: ${JSON.stringify(desktop)}`);

          await systems.setViewportSize({ width: 390, height: 844 });
          await systems.reload({ waitUntil: 'networkidle' });
          const mobile = await systems.evaluate(() => {
            const board = document.querySelector('.system-board').getBoundingClientRect();
            const copy = document.querySelector('.system-service .service-copy').getBoundingClientRect();
            const service = getComputedStyle(document.querySelector('.system-service'));
            return {
              boardBottom: board.bottom,
              copyTop: copy.top,
              gapPx: copy.top - board.bottom,
              computedGap: service.rowGap,
              overlap: board.bottom > copy.top
            };
          });
          if (mobile.overlap) throw new Error(`systems mobile overlap: ${JSON.stringify(mobile)}`);
          if (mobile.gapPx < 11) throw new Error(`systems mobile gap too small: ${JSON.stringify(mobile)}`);
          await systems.close();
          await browser.close();

          const lines = [
            '# AXIONA R136 UX render proof',
            '',
            `Commit under test: ${process.env.GITHUB_SHA}`,
            '',
            '## Navigation',
            '',
            '| Route | Active item | R136 loaded | Computed marker |',
            '|---|---|---:|---|',
            ...rows.map(r => `| ${r.route} | ${r.activeText || 'n/a'} | ${r.r136 ? 'yes' : 'no'} | ${r.activeBoxShadow} |`),
            '',
            '## Systems 01 geometry',
            '',
            `Desktop: gap ${desktop.gapPx.toFixed(1)} px; CSS gap ${desktop.computedGap}; overlap=${desktop.overlap}.`,
            `Mobile: gap ${mobile.gapPx.toFixed(1)} px; CSS gap ${mobile.computedGap}; overlap=${mobile.overlap}.`,
            '',
            'Result: PASS',
            ''
          ];
          fs.writeFileSync('docs/status/R136_UX_FIX_RENDER_PROOF.md', lines.join('\n'));
          console.log(`OK_R136_DESKTOP_GAP=${desktop.gapPx.toFixed(1)}`);
          console.log(`OK_R136_MOBILE_GAP=${mobile.gapPx.toFixed(1)}`);
          console.log('OK_R136_RENDER_PROOF');
          NODE

      - name: Commit proof and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/axiona-r136-render-proof.yml
          git config user.name "AXIONA Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status/R136_UX_FIX_RENDER_PROOF.md .github/workflows/axiona-r136-render-proof.yml
          git diff --cached --check
          git commit -m "R136: record rendered UX fix proof"
          git push origin HEAD:main
