name: AXIONA R109 Visual Live Proof

on:
  push:
    branches:
      - main
    paths:
      - "assets/visual-r109.css"
      - "assets/visual-r109-compat.css"
      - "assets/motion-r105.css"
      - "assets/motion-r108.css"
      - ".github/workflows/axiona-visual-r109-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify R109 visual assets live
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public R109 visual convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            KEY="${GITHUB_SHA}-${attempt}"
            VISUAL="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/visual-r109.css?axiona_verify=${KEY}" || true)"
            R105="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/motion-r105.css?axiona_verify=${KEY}" || true)"
            R108="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/motion-r108.css?axiona_verify=${KEY}" || true)"
            if grep -Fq 'AXIONA R109 — engineered visual composition' <<<"$VISUAL" \
              && grep -Fq '/assets/visual-r109.css' <<<"$R105" \
              && grep -Fq '/assets/visual-r109.css' <<<"$R108" \
              && ! grep -Fq 'ax108-board-scan' <<<"$R108"; then
              echo "OK_AXIONA_R109_VISUAL_LIVE"
              exit 0
            fi
            sleep 5
          done
          echo "STOP_AXIONA_R109_VISUAL_NOT_LIVE" >&2
          exit 1
