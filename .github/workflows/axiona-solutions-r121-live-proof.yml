name: AXIONA Solutions R121 Live Proof

on:
  push:
    branches: [main]
    paths:
      - solutions.html
      - en/solutions.html
      - de/solutions.html
      - assets/solutions-r121.css
      - assets/js/solutions-r121.js
      - .github/workflows/axiona-solutions-r121-live-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live:
    name: Verify live R121 solutions release
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify exact live R121 bindings and assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            KEY="${GITHUB_SHA}-solutions-r121-${attempt}"
            HU="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/solutions.html?proof=${KEY}" || true)"
            EN="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/en/solutions.html?proof=${KEY}" || true)"
            DE="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/de/solutions.html?proof=${KEY}" || true)"
            CSS="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/assets/solutions-r121.css?release=R121&proof=${KEY}" || true)"
            JS="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/assets/js/solutions-r121.js?release=R121&proof=${KEY}" || true)"
            ok=true
            for PAGE in "$HU" "$EN" "$DE"; do
              grep -Fq '/assets/solutions-r121.css?release=R121' <<<"$PAGE" || ok=false
              grep -Fq '/assets/js/solutions-r121.js?release=R121' <<<"$PAGE" || ok=false
              grep -Fq 'content="R121" name="axiona-release"' <<<"$PAGE" || ok=false
              grep -Fq 'class="ax-share section-pad"' <<<"$PAGE" || ok=false
            done
            if [ "$ok" = true ] && grep -Fq 'AXIONA R121 — Solutions page visual contract' <<<"$CSS" && grep -Fq 'AXIONA R121 — repeatable, progressive-enhancement solutions reveal motion' <<<"$JS"; then
              echo "OK_AXIONA_SOLUTIONS_R121_LIVE"
              echo "PROVEN_PAGES_SOURCE_SHA=${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "STOP_AXIONA_SOLUTIONS_R121_NOT_LIVE_FOR_SHA=${GITHUB_SHA}" >&2
          exit 1
