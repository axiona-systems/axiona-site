name: R91 Social Preview Migration

on:
  push:
    branches:
      - feature/social-preview-r91

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/social-preview-r91
          fetch-depth: 0
          persist-credentials: true

      - name: Apply R91 social preview migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          prefixes = ('', 'en/', 'de/')
          routes = (
              'index.html', 'systems.html', 'process.html', 'security.html',
              'solutions.html', 'keeper.html', 'contact.html', 'privacy.html',
              'legal.html', 'support.html',
          )
          general = 'https://axiona.systems/assets/social/axiona-social-preview-r91.png'
          keeper = 'https://axiona.systems/assets/social/axiona-keeper-social-preview-r91.png'

          changed = []
          for prefix in prefixes:
              for route in routes:
                  path = Path(prefix + route)
                  text = path.read_text(encoding='utf-8')
                  target = keeper if route == 'keeper.html' else general

                  text, og_count = re.subn(
                      r'<meta content="https://axiona\.systems/assets/social/[^"]+" property="og:image"/>',
                      f'<meta content="{target}" property="og:image"/>',
                      text,
                      count=1,
                  )
                  text, tw_count = re.subn(
                      r'<meta content="https://axiona\.systems/assets/social/[^"]+" name="twitter:image"/>',
                      f'<meta content="{target}" name="twitter:image"/>',
                      text,
                      count=1,
                  )
                  if og_count != 1 or tw_count != 1:
                      raise SystemExit(f'social image marker missing or duplicated: {path}')

                  secure = f'<meta content="{target}" property="og:image:secure_url"/>'
                  if 'property="og:image:secure_url"' in text:
                      text = re.sub(
                          r'<meta content="[^"]+" property="og:image:secure_url"/>',
                          secure,
                          text,
                          count=1,
                      )
                  else:
                      needle = f'<meta content="{target}" property="og:image"/>'
                      text = text.replace(needle, needle + '\n  ' + secure, 1)

                  text = re.sub(
                      r'<meta content="R\d+" name="axiona-release"/>',
                      '<meta content="R91" name="axiona-release"/>',
                      text,
                      count=1,
                  )
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if len(changed) != 30:
              raise SystemExit(f'expected 30 active pages, changed {len(changed)}')

          quality = Path('scripts/verify_public_quality.py')
          q = quality.read_text(encoding='utf-8')
          anchor = 'KEEPER_PLATFORM_MARKERS = ("iPhone", "iPad", "Apple App Store")\n'
          addition = '''KEEPER_PLATFORM_MARKERS = ("iPhone", "iPad", "Apple App Store")\nSOCIAL_GENERAL_IMAGE = "https://axiona.systems/assets/social/axiona-social-preview-r91.png"\nSOCIAL_KEEPER_IMAGE = "https://axiona.systems/assets/social/axiona-keeper-social-preview-r91.png"\nSOCIAL_IMAGE_DIMENSIONS = ("1200", "630")\n'''
          if 'SOCIAL_GENERAL_IMAGE' not in q:
              if anchor not in q:
                  raise SystemExit('quality constant anchor missing')
              q = q.replace(anchor, addition, 1)

          check_anchor = '''        for legacy in LEGACY_REDIRECTS:\n            if f'href="/{legacy}"' in text or f'href="{legacy}"' in text:\n                errors.append(f"active page links to legacy route: {label} -> {legacy}")\n\n'''
          check_block = '''        for legacy in LEGACY_REDIRECTS:\n            if f'href="/{legacy}"' in text or f'href="{legacy}"' in text:\n                errors.append(f"active page links to legacy route: {label} -> {legacy}")\n\n        expected_social = SOCIAL_KEEPER_IMAGE if page.name == "keeper.html" else SOCIAL_GENERAL_IMAGE\n        social_required = (\n            f'<meta content="{expected_social}" property="og:image"/>',\n            f'<meta content="{expected_social}" property="og:image:secure_url"/>',\n            f'<meta content="{expected_social}" name="twitter:image"/>',\n            f'<meta content="{SOCIAL_IMAGE_DIMENSIONS[0]}" property="og:image:width"/>',\n            f'<meta content="{SOCIAL_IMAGE_DIMENSIONS[1]}" property="og:image:height"/>',\n            '<meta content="image/png" property="og:image:type"/>',\n        )\n        for token in social_required:\n            if token not in text:\n                errors.append(f"social preview invariant missing in {label}: {token}")\n        if "axiona-social-preview-r86.png" in text:\n            errors.append(f"legacy social preview still referenced in active page: {label}")\n\n'''
          if 'social preview invariant missing' not in q:
              if check_anchor not in q:
                  raise SystemExit('quality check anchor missing')
              q = q.replace(check_anchor, check_block, 1)
          quality.write_text(q, encoding='utf-8')

          docs = Path('Docs/AXIONA_WEBSITE_MAINTENANCE.md')
          d = docs.read_text(encoding='utf-8')
          d = d.replace('Keeper preview R90', 'Keeper preview R90 + social preview R91', 1)
          rule = '''\n## Social preview invariant\n\nAll active HU / EN / DE pages use versioned 1200×630 Open Graph images with explicit `og:image`, `og:image:secure_url`, dimensions and matching `twitter:image`. General AXIONA pages use `axiona-social-preview-r91.png`; Keeper pages use the dedicated `axiona-keeper-social-preview-r91.png`. Do not reuse an old social image URL after a material preview redesign because Facebook and other platforms cache preview assets aggressively.\n'''
          if '## Social preview invariant' not in d:
              d += rule
          docs.write_text(d, encoding='utf-8')

          workflow = Path('.github/workflows/r91-social-preview-migrate.yml')
          workflow.unlink()
          PY

      - name: Verify migration before commit
        shell: bash
        run: |
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          test ! -e .github/workflows/r91-social-preview-migrate.yml
          test "$(grep -RIl 'axiona-social-preview-r86.png' --include='*.html' . | grep -E '^\./(en/|de/)?(index|systems|process|security|solutions|keeper|contact|privacy|legal|support)\.html$' | wc -l)" -eq 0

      - name: Commit migrated public surface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind active pages to R91 social previews"
          git push origin HEAD:feature/social-preview-r91
