# Existing-on-main trigger for exact R143 candidate proof.
name: AXIONA R143 Candidate Proof Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r143-candidate-proof-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axiona-r143-candidate-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main control worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/r143-repo-cleanup-hardening
          path: candidate
          persist-credentials: false

      - name: Run candidate proof matrix
        id: matrix
        shell: bash
        run: |
          set +e
          LOG=/tmp/r143-proof.log
          : > "$LOG"
          RESULT=PASS
          HEAD_SHA="$(git -C candidate rev-parse HEAD)"
          EXPECTED=58cc64a90c6eb4f6b291f5996e45ae69f198dc63
          echo "CANDIDATE_HEAD=${HEAD_SHA}" | tee -a "$LOG"
          if [ "$HEAD_SHA" != "$EXPECTED" ]; then
            echo "FAIL exact-head expected=${EXPECTED}" | tee -a "$LOG"
            RESULT=FAIL
          fi

          run_check() {
            NAME="$1"; shift
            echo "=== ${NAME} ===" | tee -a "$LOG"
            (cd candidate && "$@") >>"$LOG" 2>&1
            CODE=$?
            if [ $CODE -eq 0 ]; then
              echo "PASS ${NAME}" | tee -a "$LOG"
            else
              echo "FAIL ${NAME} exit=${CODE}" | tee -a "$LOG"
              RESULT=FAIL
            fi
          }

          run_check verify_site python3 scripts/verify_site.py
          run_check verify_sitemap python3 scripts/verify_sitemap_hreflang.py
          run_check verify_security_txt python3 scripts/verify_security_txt.py
          run_check verify_social python3 scripts/verify_social_metadata.py
          run_check verify_retired_routes python3 scripts/verify_retired_routes.py
          run_check verify_browser_identity python3 scripts/verify_browser_identity.py
          run_check verify_asset_references python3 scripts/verify_asset_references.py
          run_check verify_workflow_hardening python3 scripts/verify_workflow_hardening.py
          run_check diff_check git diff --check HEAD~1 HEAD

          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "FAIL chrome_runtime missing" | tee -a "$LOG"
            RESULT=FAIL
          else
            echo "PASS chrome_runtime=${CHROME_PATH}" | tee -a "$LOG"
            echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
            (cd candidate && npm install --no-save --ignore-scripts --no-audit --no-fund @lhci/cli@0.15.1 playwright-core@1.62.1 axe-core@4.12.1) >>"$LOG" 2>&1
            NPM_CODE=$?
            if [ $NPM_CODE -ne 0 ]; then
              echo "FAIL npm_runtime exit=${NPM_CODE}" | tee -a "$LOG"
              RESULT=FAIL
            else
              echo "PASS npm_runtime" | tee -a "$LOG"
              (cd candidate && npx --no-install lhci autorun --config=./lighthouserc.json) >>"$LOG" 2>&1
              LH_CODE=$?
              if [ $LH_CODE -eq 0 ]; then echo "PASS lighthouse" | tee -a "$LOG"; else echo "FAIL lighthouse exit=${LH_CODE}" | tee -a "$LOG"; RESULT=FAIL; fi

              python3 -m http.server 4176 --bind 127.0.0.1 --directory candidate >/tmp/r143-http.log 2>&1 &
              SERVER_PID=$!
              READY=0
              for attempt in $(seq 1 20); do
                curl --fail --silent http://127.0.0.1:4176/ >/dev/null && { READY=1; break; }
                sleep .25
              done
              if [ $READY -ne 1 ]; then
                echo "FAIL static_server" | tee -a "$LOG"
                cat /tmp/r143-http.log >>"$LOG" 2>&1
                RESULT=FAIL
              else
                AXIONA_BASE=http://127.0.0.1:4176 node candidate/scripts/verify_render_contract.mjs >>"$LOG" 2>&1
                RENDER_CODE=$?
                if [ $RENDER_CODE -eq 0 ]; then echo "PASS render_contract" | tee -a "$LOG"; else echo "FAIL render_contract exit=${RENDER_CODE}" | tee -a "$LOG"; RESULT=FAIL; fi

                AXIONA_AUDIT_BASE=http://127.0.0.1:4176 node candidate/scripts/axe-audit.mjs >>"$LOG" 2>&1
                AXE_CODE=$?
                if [ $AXE_CODE -eq 0 ]; then echo "PASS axe" | tee -a "$LOG"; else echo "FAIL axe exit=${AXE_CODE}" | tee -a "$LOG"; RESULT=FAIL; fi
              fi
              kill "$SERVER_PID" 2>/dev/null || true
            fi
          fi

          echo "RESULT=${RESULT}" | tee -a "$LOG"
          echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record proof and remove runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT='${{ steps.matrix.outputs.result }}'
          [ -n "$RESULT" ] || RESULT=FAIL
          mkdir -p docs/status
          {
            echo '# AXIONA R143 candidate validation'
            echo
            echo '- candidate: `agent/r143-repo-cleanup-hardening`'
            echo '- expected head: `58cc64a90c6eb4f6b291f5996e45ae69f198dc63`'
            echo "- result: **${RESULT}**"
            echo
            echo '```text'
            tail -n 180 /tmp/r143-proof.log 2>/dev/null || true
            echo '```'
          } > docs/status/R143_CANDIDATE_VALIDATION.md
          rm -f .github/workflows/axiona-r143-candidate-proof-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m "R143: record candidate validation ${RESULT}"
          git push origin HEAD:main
