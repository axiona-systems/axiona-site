name: AXIONA Process R119 Visual Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "process.html"
      - "en/process.html"
      - "de/process.html"
      - "assets/process-r119.css"
      - "assets/js/process-r119.js"
      - ".github/workflows/axiona-process-r119-visual-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contract:
    name: Verify rendered process page contract
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify browser runtime
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "STOP_AXIONA_PROCESS_R119_CHROME_MISSING"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Install pinned render inspector
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --bind 127.0.0.1 > /tmp/axiona-r119-http.log 2>&1 &
          echo $! > /tmp/axiona-r119-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4176/process.html >/dev/null; then
              echo "OK_AXIONA_PROCESS_R119_SERVER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/axiona-r119-http.log || true
          exit 1

      - name: Verify R119 process composition, parity and motion
        shell: bash
        env:
          AXIONA_BASE: http://127.0.0.1:4176
        run: |
          set -euo pipefail
          mkdir -p /tmp/r119-shots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox']
          });

          const routes = [
            ['/process.html', 'hu'],
            ['/en/process.html', 'en'],
            ['/de/process.html', 'de']
          ];
          const rgb = (value, triplet) => value?.includes(triplet);

          async function inspect(route, lang, label, width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(`${process.env.AXIONA_BASE}${route}`, { waitUntil: 'networkidle' });

            const cssText = await page.evaluate(async () => (await fetch('/assets/process-r119.css?contract=R119')).text());
            const jsText = await page.evaluate(async () => (await fetch('/assets/js/process-r119.js?contract=R119')).text());
            if (!cssText.includes('AXIONA R119 — Process page visual contract')) throw new Error(`${route} R119 CSS marker missing`);
            if (!jsText.includes('AXIONA R119 — repeatable, progressive-enhancement process reveal motion')) throw new Error(`${route} R119 JS marker missing`);

            const result = await page.evaluate(() => {
              const style = (selector) => {
                const el = document.querySelector(selector);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  width: Math.round(r.width), height: Math.round(r.height), display: s.display,
                  grid: s.gridTemplateColumns, background: s.backgroundColor,
                  backgroundImage: s.backgroundImage, color: s.color,
                  boxShadow: s.boxShadow, cursor: s.cursor, transform: s.transform,
                  opacity: s.opacity
                };
              };
              const styleHrefs = [...document.styleSheets].map((sheet) => sheet.href || '');
              const scripts = [...document.scripts].map((script) => script.src || '');
              const text = document.body.innerText;
              return {
                release: document.querySelector('meta[name="axiona-release"]')?.content || null,
                lang: document.documentElement.lang,
                directCss: styleHrefs.some((href) => href.includes('/assets/process-r119.css?release=R119')),
                directJs: scripts.some((src) => src.includes('/assets/js/process-r119.js?release=R119')),
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                counts: {
                  h1: document.querySelectorAll('main h1').length,
                  anatomy: document.querySelectorAll('.anatomy').length,
                  stages: document.querySelectorAll('.stage-list article').length,
                  statusRows: document.querySelectorAll('.status-sheet .status-row').length,
                  signals: document.querySelectorAll('.process-signal').length,
                  clarity: document.querySelectorAll('.process-clarity-list article').length,
                  handoff: document.querySelectorAll('.process-handoff-grid article').length,
                  method: document.querySelectorAll('.method-list article').length,
                  share: document.querySelectorAll('.ax-share').length,
                  footer: document.querySelectorAll('footer').length
                },
                forbiddenTelemetry: text.includes('STATUS SHEET / 024') || text.includes('STATUSBLATT / 024') || text.includes('ÁLLAPOTLAP / 024'),
                body: style('body'),
                anatomy: style('.anatomy'),
                dossier: style('.anatomy-layout'),
                stage: style('.stage-list article'),
                activeStage: style('.stage-list article.active'),
                status: style('.status-sheet'),
                signal: style('.process-signal'),
                clarityFrame: style('.process-clarity-list'),
                clarityRow: style('.process-clarity-list article'),
                handoffFrame: style('.process-handoff'),
                handoffCard: style('.process-handoff-grid article'),
                methodRow: style('.method-list article'),
                credit: style('.credit-card')
              };
            });

            console.log(`AXIONA_PROCESS_R119_${lang.toUpperCase()}_${label.toUpperCase()}=${JSON.stringify(result)}`);

            if (result.release !== 'R119') throw new Error(`${route} release ${result.release}, expected R119`);
            if (result.lang !== lang) throw new Error(`${route} html lang ${result.lang}, expected ${lang}`);
            if (!result.directCss || !result.directJs) throw new Error(`${route} direct R119 binding incomplete`);
            if (result.scrollWidth > result.clientWidth + 2) throw new Error(`${route} ${label} horizontal overflow ${result.scrollWidth}/${result.clientWidth}`);
            if (result.forbiddenTelemetry) throw new Error(`${route} old fake status telemetry returned`);

            const c = result.counts;
            if (c.h1 !== 1 || c.anatomy !== 1 || c.stages !== 4 || c.statusRows !== 4 || c.signals !== 6 || c.clarity !== 6 || c.handoff !== 4 || c.method !== 4 || c.share !== 1 || c.footer !== 1) {
              throw new Error(`${route} structural contract mismatch: ${JSON.stringify(c)}`);
            }

            if (!rgb(result.body?.background, '241, 238, 230')) throw new Error(`${route} warm paper body missing`);
            if (!rgb(result.anatomy?.background, '241, 238, 230')) throw new Error(`${route} opening field is not warm paper`);
            if (!rgb(result.dossier?.background, '11, 30, 37')) throw new Error(`${route} process dossier lost petrol containment`);
            if (!rgb(result.stage?.background, '251, 250, 246')) throw new Error(`${route} stage row is not a stable document surface`);
            if (!rgb(result.activeStage?.background, '255, 253, 248')) throw new Error(`${route} active example stage changed unexpectedly`);
            if (!rgb(result.status?.background, '255, 253, 248')) throw new Error(`${route} status example is not an off-white document surface`);
            if (!rgb(result.signal?.background, '251, 250, 246')) throw new Error(`${route} signal surfaces are not stable`);
            if (!rgb(result.clarityFrame?.background, '11, 30, 37')) throw new Error(`${route} clarity list lost petrol frame`);
            if (!rgb(result.clarityRow?.background, '251, 250, 246')) throw new Error(`${route} clarity rows are not document surfaces`);
            if (!rgb(result.handoffFrame?.background, '11, 30, 37')) throw new Error(`${route} handoff chapter lost petrol field`);
            if (!rgb(result.handoffCard?.background, '251, 250, 246')) throw new Error(`${route} handoff cards flip away from stable surfaces`);
            if (!rgb(result.methodRow?.background, '251, 250, 246')) throw new Error(`${route} method rows are not stable surfaces`);
            if (!rgb(result.credit?.background, '11, 30, 37')) throw new Error(`${route} author card lost deliberate petrol surface`);
            if (result.stage?.cursor !== 'default' || result.signal?.cursor !== 'default' || result.clarityRow?.cursor !== 'default' || result.handoffCard?.cursor !== 'default' || result.methodRow?.cursor !== 'default') {
              throw new Error(`${route} informational surface advertises clickability`);
            }
            if (result.stage?.opacity !== '1' || result.signal?.opacity !== '1' || result.clarityRow?.opacity !== '1') throw new Error(`${route} reveal surface opacity must remain 1 for WCAG contrast stability`);
            if (result.anatomy?.backgroundImage !== 'none') throw new Error(`${route} opening regained decorative technical background graphics`);

            if (route === '/process.html' && label === 'desktop') {
              const probe = page.locator('.process-signal').first();
              await probe.scrollIntoViewIfNeeded();
              await page.waitForTimeout(220);
              if (!(await probe.evaluate((el) => el.classList.contains('is-visible')))) throw new Error('R119 reveal did not activate');
              await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
              await page.waitForTimeout(260);
              if (await probe.evaluate((el) => el.classList.contains('is-visible'))) throw new Error('R119 reveal remained permanently latched');
              await probe.scrollIntoViewIfNeeded();
              await page.waitForTimeout(220);
              if (!(await probe.evaluate((el) => el.classList.contains('is-visible')))) throw new Error('R119 reveal did not reactivate on return scroll');
            }

            await page.evaluate(() => {
              document.querySelectorAll('[data-process-reveal]').forEach((el) => el.classList.add('is-visible'));
              window.scrollTo({ top: 0, behavior: 'instant' });
            });
            await page.waitForTimeout(80);
            await page.screenshot({ path: `/tmp/r119-shots/axiona-process-r119-${lang}-${label}-full.png`, fullPage: true });
            if (lang === 'hu' && label === 'desktop') {
              await page.locator('.anatomy').screenshot({ path: '/tmp/r119-shots/axiona-process-r119-hu-opening.png' });
              await page.locator('.process-clarity').screenshot({ path: '/tmp/r119-shots/axiona-process-r119-hu-clarity.png' });
              await page.locator('.process-handoff').screenshot({ path: '/tmp/r119-shots/axiona-process-r119-hu-handoff.png' });
              await page.locator('.method').screenshot({ path: '/tmp/r119-shots/axiona-process-r119-hu-method.png' });
            }
            await page.close();
          }

          for (const [route, lang] of routes) {
            await inspect(route, lang, 'desktop', 1440, 1000);
            await inspect(route, lang, 'mobile', 390, 844);
          }

          await browser.close();
          console.log('OK_AXIONA_PROCESS_R119_VISUAL_CONTRACT');
          NODE

      - name: Upload R119 rendered evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axiona-process-r119-render-evidence
          path: /tmp/r119-shots/*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
