name: R91 Social PNG Integrity Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: r91-social-png-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/r91-social-png-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/r91-social-png-integrity
          fetch-depth: 0
          persist-credentials: false

      - name: Recover newest valid historical social card and harden verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import binascii
          import struct
          import subprocess
          import zlib

          ROOT = Path('.')
          GENERAL_R91 = ROOT / 'assets/social/axiona-social-preview-r91.png'
          FALLBACK_R86 = ROOT / 'assets/social/axiona-social-preview-r86.png'
          KEEPER_R91 = ROOT / 'assets/social/axiona-keeper-social-preview-r91.png'

          def validate_bytes(data: bytes) -> str | None:
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  return 'invalid PNG signature'
              pos = 8
              width = height = color_type = None
              idat = bytearray()
              has_trns = False
              saw_iend = False
              try:
                  while pos + 12 <= len(data):
                      length = struct.unpack('>I', data[pos:pos + 4])[0]
                      end = pos + 12 + length
                      if end > len(data):
                          return f'truncated PNG chunk at byte {pos}'
                      kind = data[pos + 4:pos + 8]
                      payload = data[pos + 8:pos + 8 + length]
                      expected_crc = struct.unpack('>I', data[pos + 8 + length:end])[0]
                      actual_crc = binascii.crc32(kind + payload) & 0xFFFFFFFF
                      if expected_crc != actual_crc:
                          return f'CRC mismatch in {kind.decode("latin1")}'
                      if kind == b'IHDR':
                          width, height, _depth, color_type, compression, filtering, interlace = struct.unpack('>IIBBBBB', payload)
                          if compression != 0 or filtering != 0 or interlace not in (0, 1):
                              return 'unsupported PNG header'
                      elif kind == b'IDAT':
                          idat.extend(payload)
                      elif kind == b'tRNS':
                          has_trns = True
                      elif kind == b'IEND':
                          saw_iend = True
                          pos = end
                          break
                      pos = end
              except (struct.error, ValueError) as exc:
                  return f'malformed PNG structure: {exc}'
              if not saw_iend or pos != len(data):
                  return 'missing terminal IEND or trailing data'
              if (width, height) != (1200, 630):
                  return f'expected 1200x630, got {width}x{height}'
              if color_type in (4, 6) or has_trns:
                  return 'social PNG must use an opaque background'
              try:
                  zlib.decompress(bytes(idat))
              except zlib.error as exc:
                  return f'invalid IDAT zlib stream: {exc}'
              return None

          def git(*args: str) -> bytes:
              return subprocess.check_output(['git', *args])

          # Inspect every historical non-Keeper PNG path ever present under assets/social.
          names = git('log', '--all', '--name-only', '--pretty=format:', '--', 'assets/social').decode('utf-8', 'replace').splitlines()
          paths = sorted({name.strip() for name in names if name.strip().endswith('.png') and 'keeper' not in name.lower()})
          if not paths:
              raise RuntimeError('NO_HISTORICAL_SOCIAL_PNG_PATHS')

          seen_blobs: set[str] = set()
          valid: list[tuple[int, str, str, bytes]] = []
          checked = 0
          for path in paths:
              commits = git('log', '--all', '--format=%H', '--', path).decode().splitlines()
              for order, commit in enumerate(commits):
                  try:
                      blob = git('rev-parse', f'{commit}:{path}').decode().strip()
                  except subprocess.CalledProcessError:
                      continue
                  if blob in seen_blobs:
                      continue
                  seen_blobs.add(blob)
                  checked += 1
                  try:
                      data = git('show', f'{commit}:{path}')
                  except subprocess.CalledProcessError:
                      continue
                  error = validate_bytes(data)
                  print(f'HISTORICAL_SOCIAL_CANDIDATE path={path} commit={commit} blob={blob} bytes={len(data)} status={error or "VALID"}')
                  if error is None:
                      # git log is newest-first per path. Prefer newest commit timestamp globally.
                      timestamp = int(git('show', '-s', '--format=%ct', commit).decode().strip())
                      valid.append((timestamp, commit, path, data))

          print(f'HISTORICAL_SOCIAL_UNIQUE_BLOBS_CHECKED={checked}')
          if not valid:
              raise RuntimeError('NO_VALID_HISTORICAL_SOCIAL_CARD')

          valid.sort(key=lambda item: item[0], reverse=True)
          timestamp, source_commit, source_path, card = valid[0]
          print(f'SELECTED_SOCIAL_CARD commit={source_commit} path={source_path} bytes={len(card)} timestamp={timestamp}')
          GENERAL_R91.write_bytes(card)
          FALLBACK_R86.write_bytes(card)

          if validate_bytes(GENERAL_R91.read_bytes()) is not None:
              raise RuntimeError('R91_GENERAL_REPAIR_VALIDATION_FAILED')
          if validate_bytes(FALLBACK_R86.read_bytes()) is not None:
              raise RuntimeError('R86_FALLBACK_REPAIR_VALIDATION_FAILED')
          keeper_error = validate_bytes(KEEPER_R91.read_bytes())
          if keeper_error:
              raise RuntimeError(f'KEEPER_R91_INVALID: {keeper_error}')

          verifier = ROOT / 'scripts/verify_public_quality.py'
          text = verifier.read_text(encoding='utf-8')
          import_anchor = 'import sys\n'
          import_block = 'import binascii\nimport struct\nimport sys\nimport zlib\n'
          if 'import binascii\n' not in text:
              if import_anchor not in text:
                  raise RuntimeError('verifier import anchor missing')
              text = text.replace(import_anchor, import_block, 1)

          tuple_anchor = '''SOCIAL_IMAGE_ASSETS = (\n    "assets/social/axiona-social-preview-r91.png",\n    "assets/social/axiona-keeper-social-preview-r91.png",\n)\n'''
          tuple_replacement = '''SOCIAL_IMAGE_ASSETS = (\n    "assets/social/axiona-social-preview-r91.png",\n    "assets/social/axiona-keeper-social-preview-r91.png",\n    "assets/social/axiona-social-preview-r86.png",\n)\n'''
          if '"assets/social/axiona-social-preview-r86.png",\n)' not in text:
              if tuple_anchor not in text:
                  raise RuntimeError('verifier social asset tuple anchor missing')
              text = text.replace(tuple_anchor, tuple_replacement, 1)

          function_anchor = '\n\ndef active_paths() -> list[Path]:\n'
          png_function = '''\n\ndef validate_social_png(path: Path) -> str | None:\n    try:\n        data = path.read_bytes()\n    except OSError as exc:\n        return f"cannot read PNG: {exc}"\n    if data[:8] != b"\\x89PNG\\r\\n\\x1a\\n":\n        return "invalid PNG signature"\n\n    pos = 8\n    width = height = color_type = None\n    idat = bytearray()\n    has_trns = False\n    saw_iend = False\n    try:\n        while pos + 12 <= len(data):\n            length = struct.unpack(">I", data[pos:pos + 4])[0]\n            end = pos + 12 + length\n            if end > len(data):\n                return f"truncated PNG chunk at byte {pos}"\n            kind = data[pos + 4:pos + 8]\n            payload = data[pos + 8:pos + 8 + length]\n            expected_crc = struct.unpack(">I", data[pos + 8 + length:end])[0]\n            actual_crc = binascii.crc32(kind + payload) & 0xFFFFFFFF\n            if expected_crc != actual_crc:\n                return f"CRC mismatch in {kind.decode('latin1')}"\n            if kind == b"IHDR":\n                width, height, _depth, color_type, compression, filtering, interlace = struct.unpack(">IIBBBBB", payload)\n                if compression != 0 or filtering != 0 or interlace not in (0, 1):\n                    return "unsupported PNG header"\n            elif kind == b"IDAT":\n                idat.extend(payload)\n            elif kind == b"tRNS":\n                has_trns = True\n            elif kind == b"IEND":\n                saw_iend = True\n                pos = end\n                break\n            pos = end\n    except (struct.error, ValueError) as exc:\n        return f"malformed PNG structure: {exc}"\n\n    if not saw_iend or pos != len(data):\n        return "missing terminal IEND or trailing data"\n    if (width, height) != (1200, 630):\n        return f"expected 1200x630, got {width}x{height}"\n    if color_type in (4, 6) or has_trns:\n        return "social PNG must use an opaque background"\n    try:\n        zlib.decompress(bytes(idat))\n    except zlib.error as exc:\n        return f"invalid IDAT zlib stream: {exc}"\n    return None\n'''
          if 'def validate_social_png(' not in text:
              if function_anchor not in text:
                  raise RuntimeError('verifier function anchor missing')
              text = text.replace(function_anchor, png_function + function_anchor, 1)

          asset_anchor = '''    for asset in SOCIAL_IMAGE_ASSETS:\n        if not (ROOT / asset).is_file():\n            errors.append(f"missing R91 social preview asset: {asset}")\n\n'''
          asset_replacement = '''    for asset in SOCIAL_IMAGE_ASSETS:\n        asset_path = ROOT / asset\n        if not asset_path.is_file():\n            errors.append(f"missing social preview asset: {asset}")\n            continue\n        png_error = validate_social_png(asset_path)\n        if png_error:\n            errors.append(f"invalid social preview asset {asset}: {png_error}")\n\n'''
          if 'invalid social preview asset' not in text:
              if asset_anchor not in text:
                  raise RuntimeError('verifier social asset anchor missing')
              text = text.replace(asset_anchor, asset_replacement, 1)

          verifier.write_text(text, encoding='utf-8')
          print('OK_R91_GENERAL_PNG_BINARY_INTEGRITY')
          print('OK_R86_FALLBACK_PNG_BINARY_INTEGRITY')
          print('OK_R91_KEEPER_PNG_BINARY_INTEGRITY')
          PY

      - name: Run fail-closed release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check

      - name: Remove repair workflow and commit clean result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/r91-social-png-integrity-repair.yml
          git config user.name "AXIONA Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No repair changes to commit"; exit 1; }
          git commit -m "Repair R91 social PNG integrity"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/r91-social-png-integrity
