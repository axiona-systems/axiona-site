name: R91 Social PNG Integrity Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: r91-social-png-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/r91-social-png-integrity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/r91-social-png-integrity
          fetch-depth: 0
          persist-credentials: false

      - name: Verify render runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "STOP_R91_RENDER_CHROME_MISSING"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Render clean production R91 social card
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const mark = fs.readFileSync('assets/axiona-mark.png').toString('base64');
          const html = `<!doctype html>
          <html><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f6efe3}
          body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#10262e}
          .card{position:relative;width:1200px;height:630px;padding:66px 70px;background:linear-gradient(135deg,#f8f1e7 0%,#f4ecdf 100%)}
          .card:before{content:"";position:absolute;left:0;top:0;width:1200px;height:8px;background:#ef6b43}
          .brand{display:flex;align-items:center;gap:17px;height:64px}.brand img{width:58px;height:58px;object-fit:contain}
          .brand-name{font-size:27px;line-height:1;font-weight:760;letter-spacing:.22em}.brand-name small{display:block;margin-top:8px;font-size:11px;font-weight:680;letter-spacing:.46em;color:#5c6e72}
          .content{display:grid;grid-template-columns:1.22fr .78fr;gap:64px;align-items:center;height:424px;margin-top:35px}
          .eyebrow{font-size:14px;font-weight:730;letter-spacing:.2em;color:#e35f3a;margin-bottom:20px}
          h1{font-size:55px;line-height:1.02;letter-spacing:-.045em;margin:0 0 25px;font-weight:760;max-width:610px}
          .rule{width:126px;height:5px;background:#ef6b43;margin:0 0 26px}
          .scope{font-size:20px;line-height:1.6;letter-spacing:.015em;color:#4c6267;max-width:610px}
          .scope b{font-weight:650;color:#18343c}.dot{color:#ef6b43;padding:0 8px}
          .visual{position:relative;height:392px;border-radius:26px;background:#10272f;overflow:hidden;box-shadow:0 24px 55px rgba(16,39,47,.16)}
          .visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:39px 39px}
          .visual svg{position:absolute;inset:0;width:100%;height:100%}
          .footer{position:absolute;left:70px;right:70px;bottom:38px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(16,39,47,.16);padding-top:18px;font-size:13px;letter-spacing:.13em;color:#6e7c7e}
          .footer strong{font-weight:720;color:#17323a;letter-spacing:.16em}
          </style></head><body><div class="card">
          <div class="brand"><img src="data:image/png;base64,${mark}" alt=""><div class="brand-name">AXIONA<small>SYSTEMS</small></div></div>
          <div class="content"><div>
            <div class="eyebrow">DIGITAL SYSTEMS · ENGINEERING</div>
            <h1>Structured systems.<br>Clear operation.</h1>
            <div class="rule"></div>
            <div class="scope"><b>System design</b><span class="dot">·</span><b>Process design</b><br>Software<span class="dot">·</span>Automation<span class="dot">·</span>Security</div>
          </div>
          <div class="visual"><svg viewBox="0 0 390 392" aria-hidden="true">
            <defs><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".16"/></filter></defs>
            <path d="M66 98 H150 V65 H260 V126 H322" fill="none" stroke="#75949b" stroke-width="2" opacity=".75"/>
            <path d="M66 294 H128 V245 H217 V309 H322" fill="none" stroke="#75949b" stroke-width="2" opacity=".75"/>
            <path d="M150 65 V176 H217 V245" fill="none" stroke="#ef6b43" stroke-width="3"/>
            <rect x="43" y="72" width="74" height="52" rx="12" fill="#f6efe3" filter="url(#shadow)"/>
            <rect x="132" y="153" width="126" height="82" rx="16" fill="#f6efe3" filter="url(#shadow)"/>
            <rect x="273" y="101" width="74" height="52" rx="12" fill="#f6efe3" filter="url(#shadow)"/>
            <rect x="43" y="269" width="74" height="52" rx="12" fill="#f6efe3" filter="url(#shadow)"/>
            <rect x="273" y="284" width="74" height="52" rx="12" fill="#f6efe3" filter="url(#shadow)"/>
            <circle cx="195" cy="194" r="13" fill="#ef6b43"/>
            <circle cx="80" cy="98" r="7" fill="#ef6b43"/>
            <circle cx="310" cy="127" r="7" fill="#ef6b43"/>
            <circle cx="80" cy="295" r="7" fill="#ef6b43"/>
            <circle cx="310" cy="310" r="7" fill="#ef6b43"/>
            <path d="M168 194 h54 M195 167 v54" stroke="#10272f" stroke-width="3" stroke-linecap="round"/>
          </svg></div></div>
          <div class="footer"><strong>AXIONA.SYSTEMS</strong><span>DESIGN · DEVELOPMENT · OPERATION</span></div>
          </div></body></html>`;

          (async () => {
            const browser = await chromium.launch({executablePath: process.env.CHROME_PATH, headless: true, args:['--no-sandbox','--disable-dev-shm-usage']});
            const context = await browser.newContext({viewport:{width:1200,height:630}, deviceScaleFactor:1});
            const page = await context.newPage();
            await page.setContent(html, {waitUntil:'load'});
            await page.screenshot({path:'/tmp/axiona-social-r91-clean.png', type:'png', fullPage:false, omitBackground:false});
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Install repaired card and harden verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import binascii
          import struct
          import zlib

          ROOT = Path('.')
          rendered = Path('/tmp/axiona-social-r91-clean.png')
          GENERAL_R91 = ROOT / 'assets/social/axiona-social-preview-r91.png'
          FALLBACK_R86 = ROOT / 'assets/social/axiona-social-preview-r86.png'
          KEEPER_R91 = ROOT / 'assets/social/axiona-keeper-social-preview-r91.png'

          def validate_png(path: Path) -> str | None:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  return 'invalid PNG signature'
              pos = 8
              width = height = color_type = None
              idat = bytearray()
              has_trns = False
              saw_iend = False
              try:
                  while pos + 12 <= len(data):
                      length = struct.unpack('>I', data[pos:pos + 4])[0]
                      end = pos + 12 + length
                      if end > len(data):
                          return f'truncated PNG chunk at byte {pos}'
                      kind = data[pos + 4:pos + 8]
                      payload = data[pos + 8:pos + 8 + length]
                      expected_crc = struct.unpack('>I', data[pos + 8 + length:end])[0]
                      actual_crc = binascii.crc32(kind + payload) & 0xFFFFFFFF
                      if expected_crc != actual_crc:
                          return f'CRC mismatch in {kind.decode("latin1")}'
                      if kind == b'IHDR':
                          width, height, _depth, color_type, compression, filtering, interlace = struct.unpack('>IIBBBBB', payload)
                          if compression != 0 or filtering != 0 or interlace not in (0, 1):
                              return 'unsupported PNG header'
                      elif kind == b'IDAT':
                          idat.extend(payload)
                      elif kind == b'tRNS':
                          has_trns = True
                      elif kind == b'IEND':
                          saw_iend = True
                          pos = end
                          break
                      pos = end
              except (struct.error, ValueError) as exc:
                  return f'malformed PNG structure: {exc}'
              if not saw_iend or pos != len(data):
                  return 'missing terminal IEND or trailing data'
              if (width, height) != (1200, 630):
                  return f'expected 1200x630, got {width}x{height}'
              if color_type in (4, 6) or has_trns:
                  return 'social PNG must use an opaque RGB/palette background'
              try:
                  zlib.decompress(bytes(idat))
              except zlib.error as exc:
                  return f'invalid IDAT zlib stream: {exc}'
              return None

          rendered_error = validate_png(rendered)
          if rendered_error:
              raise RuntimeError(f'RENDERED_R91_INVALID: {rendered_error}')
          GENERAL_R91.write_bytes(rendered.read_bytes())
          FALLBACK_R86.write_bytes(rendered.read_bytes())
          for label, path in (('R91_GENERAL', GENERAL_R91), ('R86_FALLBACK', FALLBACK_R86), ('R91_KEEPER', KEEPER_R91)):
              error = validate_png(path)
              if error:
                  raise RuntimeError(f'{label}_INVALID: {error}')
              print(f'OK_{label}_PNG_BINARY_INTEGRITY bytes={path.stat().st_size}')

          verifier = ROOT / 'scripts/verify_public_quality.py'
          text = verifier.read_text(encoding='utf-8')
          import_anchor = 'import sys\n'
          import_block = 'import binascii\nimport struct\nimport sys\nimport zlib\n'
          if 'import binascii\n' not in text:
              if import_anchor not in text:
                  raise RuntimeError('verifier import anchor missing')
              text = text.replace(import_anchor, import_block, 1)

          tuple_anchor = '''SOCIAL_IMAGE_ASSETS = (\n    "assets/social/axiona-social-preview-r91.png",\n    "assets/social/axiona-keeper-social-preview-r91.png",\n)\n'''
          tuple_replacement = '''SOCIAL_IMAGE_ASSETS = (\n    "assets/social/axiona-social-preview-r91.png",\n    "assets/social/axiona-keeper-social-preview-r91.png",\n    "assets/social/axiona-social-preview-r86.png",\n)\n'''
          if '"assets/social/axiona-social-preview-r86.png",\n)' not in text:
              if tuple_anchor not in text:
                  raise RuntimeError('verifier social asset tuple anchor missing')
              text = text.replace(tuple_anchor, tuple_replacement, 1)

          function_anchor = '\n\ndef active_paths() -> list[Path]:\n'
          png_function = '''\n\ndef validate_social_png(path: Path) -> str | None:\n    try:\n        data = path.read_bytes()\n    except OSError as exc:\n        return f"cannot read PNG: {exc}"\n    if data[:8] != b"\\x89PNG\\r\\n\\x1a\\n":\n        return "invalid PNG signature"\n\n    pos = 8\n    width = height = color_type = None\n    idat = bytearray()\n    has_trns = False\n    saw_iend = False\n    try:\n        while pos + 12 <= len(data):\n            length = struct.unpack(">I", data[pos:pos + 4])[0]\n            end = pos + 12 + length\n            if end > len(data):\n                return f"truncated PNG chunk at byte {pos}"\n            kind = data[pos + 4:pos + 8]\n            payload = data[pos + 8:pos + 8 + length]\n            expected_crc = struct.unpack(">I", data[pos + 8 + length:end])[0]\n            actual_crc = binascii.crc32(kind + payload) & 0xFFFFFFFF\n            if expected_crc != actual_crc:\n                return f"CRC mismatch in {kind.decode('latin1')}"\n            if kind == b"IHDR":\n                width, height, _depth, color_type, compression, filtering, interlace = struct.unpack(">IIBBBBB", payload)\n                if compression != 0 or filtering != 0 or interlace not in (0, 1):\n                    return "unsupported PNG header"\n            elif kind == b"IDAT":\n                idat.extend(payload)\n            elif kind == b"tRNS":\n                has_trns = True\n            elif kind == b"IEND":\n                saw_iend = True\n                pos = end\n                break\n            pos = end\n    except (struct.error, ValueError) as exc:\n        return f"malformed PNG structure: {exc}"\n\n    if not saw_iend or pos != len(data):\n        return "missing terminal IEND or trailing data"\n    if (width, height) != (1200, 630):\n        return f"expected 1200x630, got {width}x{height}"\n    if color_type in (4, 6) or has_trns:\n        return "social PNG must use an opaque RGB/palette background"\n    try:\n        zlib.decompress(bytes(idat))\n    except zlib.error as exc:\n        return f"invalid IDAT zlib stream: {exc}"\n    return None\n'''
          if 'def validate_social_png(' not in text:
              if function_anchor not in text:
                  raise RuntimeError('verifier function anchor missing')
              text = text.replace(function_anchor, png_function + function_anchor, 1)

          asset_anchor = '''    for asset in SOCIAL_IMAGE_ASSETS:\n        if not (ROOT / asset).is_file():\n            errors.append(f"missing R91 social preview asset: {asset}")\n\n'''
          asset_replacement = '''    for asset in SOCIAL_IMAGE_ASSETS:\n        asset_path = ROOT / asset\n        if not asset_path.is_file():\n            errors.append(f"missing social preview asset: {asset}")\n            continue\n        png_error = validate_social_png(asset_path)\n        if png_error:\n            errors.append(f"invalid social preview asset {asset}: {png_error}")\n\n'''
          if 'invalid social preview asset' not in text:
              if asset_anchor not in text:
                  raise RuntimeError('verifier social asset anchor missing')
              text = text.replace(asset_anchor, asset_replacement, 1)

          verifier.write_text(text, encoding='utf-8')
          PY

      - name: Run fail-closed release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check

      - name: Remove repair workflow and commit clean result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/r91-social-png-integrity-repair.yml
          rm -rf node_modules package-lock.json package.json
          git config user.name "AXIONA Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No repair changes to commit"; exit 1; }
          git commit -m "Repair R91 social PNG integrity"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/r91-social-png-integrity
