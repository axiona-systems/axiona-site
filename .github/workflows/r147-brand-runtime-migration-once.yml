name: R147 Brand Runtime Migration Once

on:
  push:
    branches:
      - feature/r147-canonical-brand-runtime-final
    paths:
      - '.github/workflows/r147-brand-runtime-migration-once.yml'
      - 'scripts/r147-migration-payload.b64'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic brand export dependencies
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.7.1' 'Pillow==11.3.0'

      - name: Rebuild pinned canonical AXIONA brand package from repository history
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/axiona-brand-source
          DIST=/tmp/axiona-brand-dist
          mkdir -p "$SRC"
          git show c0e3ff49949b6bea1419c642f536f5480994c15d:brand/assets/master-v1/axiona-master-horizontal-fullcolor.svg > "$SRC/axiona-master-horizontal-fullcolor.svg"
          git show c0e3ff49949b6bea1419c642f536f5480994c15d:brand/assets/master-v1/axiona-symbol-fullcolor.svg > "$SRC/axiona-symbol-fullcolor.svg"
          git show c0e3ff49949b6bea1419c642f536f5480994c15d:brand/assets/master-v1/build_exports.py > "$SRC/build_exports.py"
          python "$SRC/build_exports.py" --source-dir "$SRC" --output "$DIST"
          test "$(sha256sum "$SRC/axiona-master-horizontal-fullcolor.svg" | awk '{print $1}')" = "dca03db3af56c0d3956e2c63f5154750034d7bf6ec37da26ec0bc07581f9be8d"
          test "$(sha256sum "$SRC/axiona-symbol-fullcolor.svg" | awk '{print $1}')" = "a551d43284d05c5a2a84da91fc7815d9181e595636ec73b2e4aabafc55e9fb13"

      - name: Decode and apply R147 runtime migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          raw = ''.join(Path('scripts/r147-migration-payload.b64').read_text().split())
          Path('/tmp/r147_migrate.py').write_bytes(zlib.decompress(base64.b64decode(raw)))
          PY
          python /tmp/r147_migrate.py --brand-dist /tmp/axiona-brand-dist

      - name: Remove one-shot migration machinery
        run: |
          set -euo pipefail
          git rm .github/workflows/r147-brand-runtime-migration-once.yml scripts/r147-migration-payload.b64

      - name: Verify final candidate before commit
        run: |
          set -euo pipefail
          ./scripts/verify-all.sh
          python3 scripts/verify_brand_consumer_boundary.py
          python3 scripts/verify_social_metadata.py
          python3 scripts/verify_browser_identity.py
          python3 scripts/verify_asset_references.py
          git diff --check
          if grep -RIn -E '/assets/axiona-mark\.png|social-preview-r92|axiona-keeper-social-preview-r92' -- *.html en de assets site.webmanifest favicon.svg; then
            echo 'legacy runtime identity reference remains' >&2
            exit 1
          fi

      - name: Commit exact R147 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXIONA Brand Migration'
          git config user.email 'noreply@axiona.systems'
          git add -A
          git commit -m 'R147: migrate complete public runtime to canonical master brand'
          git push origin HEAD:feature/r147-canonical-brand-runtime-final
