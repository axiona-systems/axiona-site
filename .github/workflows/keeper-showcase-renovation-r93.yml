name: Keeper Showcase Renovation R93

on:
  push:
    branches:
      - fix/keeper-showcase-renovation-r93
    paths:
      - ".github/workflows/keeper-showcase-renovation-r93.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Replace prominent Keeper showcase examples
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  (
                      '<aside class="keeper-case-card" aria-label="AXIONA Keeper garanciális példa">\n        <div class="keeper-case-head"><span>KEEPER / EGY ÜGY, EGY HELYEN</span><b>PÉLDA</b></div>\n        <div class="keeper-case-title"><small>OTTHON · GARANCIA</small><strong>Háztartási gép · szerviz</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Vásárlási bizonylat</b><small>kapcsolódik</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Jótállási jegy</b><small>kapcsolódik</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Szervizbejelentés</b><small>kapcsolódik</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Szerviz levelezése</b><small>2 irat</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>KÖVETKEZŐ LÉPÉS</span><strong>Várjuk a szerviz időpontját.</strong></div>\n      </aside>',
                      '<aside class="keeper-case-card" aria-label="AXIONA Keeper felújítási példa">\n        <div class="keeper-case-head"><span>KEEPER / EGY ÜGY, EGY HELYEN</span><b>PÉLDA</b></div>\n        <div class="keeper-case-title"><small>INGATLAN · FELÚJÍTÁS</small><strong>Felújítás · dokumentumok</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Kivitelezői ajánlat</b><small>kapcsolódik</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Szerződés</b><small>kapcsolódik</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Számlák</b><small>3 irat</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Garancia és átadás</b><small>kapcsolódik</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>KÖVETKEZŐ LÉPÉS</span><strong>Az átadás időpontjának egyeztetése.</strong></div>\n      </aside>'
                  )
              ],
              'keeper.html': [
                  (
                      '<aside class="keeper-case-card" aria-label="Példa egy összerendezett garanciális ügyre">\n        <div class="keeper-case-head"><span>KEEPER / ÜGY NÉZET</span><b>PÉLDA</b></div>\n        <div class="keeper-case-title"><small>OTTHON · GARANCIA · SZERVIZ</small><strong>Háztartási gép · garancia</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Vásárlási bizonylat</b><small>kapcsolódó irat</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Jótállási jegy</b><small>kapcsolódó irat</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Termékadatok</b><small>eredeti dokumentum</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Szervizbejelentés</b><small>kapcsolódó irat</small></div>\n          <div class="keeper-case-row"><span>05</span><b>Szerviz levelezése</b><small>2 dokumentum</small></div>\n          <div class="keeper-case-row"><span>06</span><b>Határidők és teendők</b><small>következő lépés</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>JELENLEGI HELYZET</span><strong>Várjuk a szerviz időpontjának visszaigazolását.</strong></div>\n      </aside>',
                      '<aside class="keeper-case-card" aria-label="Példa egy összerendezett felújítási ügyre">\n        <div class="keeper-case-head"><span>KEEPER / ÜGY NÉZET</span><b>PÉLDA</b></div>\n        <div class="keeper-case-title"><small>INGATLAN · FELÚJÍTÁS · KIVITELEZÉS</small><strong>Felújítás · dokumentumok</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Kivitelezői ajánlat</b><small>kapcsolódó irat</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Szerződés</b><small>kapcsolódó irat</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Előlegszámla</b><small>eredeti dokumentum</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Végszámla</b><small>kapcsolódó irat</small></div>\n          <div class="keeper-case-row"><span>05</span><b>Garanciális dokumentumok</b><small>2 dokumentum</small></div>\n          <div class="keeper-case-row"><span>06</span><b>Határidők és teendők</b><small>következő lépés</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>JELENLEGI HELYZET</span><strong>Az átadás időpontjának egyeztetése következik.</strong></div>\n      </aside>'
                  )
              ],
              'en/index.html': [
                  (
                      '<aside class="keeper-case-card" aria-label="AXIONA Keeper warranty example">\n        <div class="keeper-case-head"><span>KEEPER / ONE MATTER, ONE PLACE</span><b>EXAMPLE</b></div>\n        <div class="keeper-case-title"><small>HOME · WARRANTY</small><strong>Household appliance · service</strong></div>\n        <div class="keeper-case-list"><div class="keeper-case-row"><span>01</span><b>Purchase receipt</b><small>related</small></div><div class="keeper-case-row"><span>02</span><b>Warranty certificate</b><small>related</small></div><div class="keeper-case-row"><span>03</span><b>Service request</b><small>related</small></div><div class="keeper-case-row"><span>04</span><b>Service correspondence</b><small>2 documents</small></div></div>\n        <div class="keeper-case-foot"><span>NEXT STEP</span><strong>Waiting for the service appointment.</strong></div>\n      </aside>',
                      '<aside class="keeper-case-card" aria-label="AXIONA Keeper renovation example">\n        <div class="keeper-case-head"><span>KEEPER / ONE MATTER, ONE PLACE</span><b>EXAMPLE</b></div>\n        <div class="keeper-case-title"><small>PROPERTY · RENOVATION</small><strong>Renovation · documents</strong></div>\n        <div class="keeper-case-list"><div class="keeper-case-row"><span>01</span><b>Contractor quote</b><small>related</small></div><div class="keeper-case-row"><span>02</span><b>Contract</b><small>related</small></div><div class="keeper-case-row"><span>03</span><b>Invoices</b><small>3 documents</small></div><div class="keeper-case-row"><span>04</span><b>Warranty and handover</b><small>related</small></div></div>\n        <div class="keeper-case-foot"><span>NEXT STEP</span><strong>Arrange the final handover.</strong></div>\n      </aside>'
                  )
              ],
              'en/keeper.html': [
                  (
                      '<aside class="keeper-case-card" aria-label="Example of one organised warranty matter">\n        <div class="keeper-case-head"><span>KEEPER / MATTER VIEW</span><b>EXAMPLE</b></div>\n        <div class="keeper-case-title"><small>HOME · WARRANTY · SERVICE</small><strong>Household appliance · warranty</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Purchase receipt</b><small>related document</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Warranty certificate</b><small>related document</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Product details</b><small>original document</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Service request</b><small>related document</small></div>\n          <div class="keeper-case-row"><span>05</span><b>Service correspondence</b><small>2 documents</small></div>\n          <div class="keeper-case-row"><span>06</span><b>Deadlines and actions</b><small>next step</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>CURRENT POSITION</span><strong>Waiting for the service appointment to be confirmed.</strong></div>\n      </aside>',
                      '<aside class="keeper-case-card" aria-label="Example of one organised renovation matter">\n        <div class="keeper-case-head"><span>KEEPER / MATTER VIEW</span><b>EXAMPLE</b></div>\n        <div class="keeper-case-title"><small>PROPERTY · RENOVATION · WORKS</small><strong>Renovation · documents</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Contractor quote</b><small>related document</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Contract</b><small>related document</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Deposit invoice</b><small>original document</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Final invoice</b><small>related document</small></div>\n          <div class="keeper-case-row"><span>05</span><b>Warranty documents</b><small>2 documents</small></div>\n          <div class="keeper-case-row"><span>06</span><b>Deadlines and actions</b><small>next step</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>CURRENT POSITION</span><strong>The next step is to arrange the handover.</strong></div>\n      </aside>'
                  )
              ],
              'de/index.html': [
                  (
                      '<aside class="keeper-case-card" aria-label="AXIONA Keeper Garantiebeispiel">\n        <div class="keeper-case-head"><span>KEEPER / EIN VORGANG, EIN ORT</span><b>BEISPIEL</b></div>\n        <div class="keeper-case-title"><small>HAUSHALT · GARANTIE</small><strong>Haushaltsgerät · Service</strong></div>\n        <div class="keeper-case-list"><div class="keeper-case-row"><span>01</span><b>Kaufbeleg</b><small>zugehörig</small></div><div class="keeper-case-row"><span>02</span><b>Garantienachweis</b><small>zugehörig</small></div><div class="keeper-case-row"><span>03</span><b>Serviceanfrage</b><small>zugehörig</small></div><div class="keeper-case-row"><span>04</span><b>Service-Schriftverkehr</b><small>2 Dokumente</small></div></div>\n        <div class="keeper-case-foot"><span>NÄCHSTER SCHRITT</span><strong>Wir warten auf den Servicetermin.</strong></div>\n      </aside>',
                      '<aside class="keeper-case-card" aria-label="AXIONA Keeper Renovierungsbeispiel">\n        <div class="keeper-case-head"><span>KEEPER / EIN VORGANG, EIN ORT</span><b>BEISPIEL</b></div>\n        <div class="keeper-case-title"><small>IMMOBILIE · RENOVIERUNG</small><strong>Renovierung · Unterlagen</strong></div>\n        <div class="keeper-case-list"><div class="keeper-case-row"><span>01</span><b>Handwerkerangebot</b><small>zugehörig</small></div><div class="keeper-case-row"><span>02</span><b>Vertrag</b><small>zugehörig</small></div><div class="keeper-case-row"><span>03</span><b>Rechnungen</b><small>3 Dokumente</small></div><div class="keeper-case-row"><span>04</span><b>Garantie und Übergabe</b><small>zugehörig</small></div></div>\n        <div class="keeper-case-foot"><span>NÄCHSTER SCHRITT</span><strong>Übergabetermin abstimmen.</strong></div>\n      </aside>'
                  )
              ],
              'de/keeper.html': [
                  (
                      '<aside class="keeper-case-card" aria-label="Beispiel für einen geordneten Garantiefall">\n        <div class="keeper-case-head"><span>KEEPER / VORGANG</span><b>BEISPIEL</b></div>\n        <div class="keeper-case-title"><small>HAUSHALT · GARANTIE · SERVICE</small><strong>Haushaltsgerät · Garantie</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Kaufbeleg</b><small>zugehöriges Dokument</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Garantienachweis</b><small>zugehöriges Dokument</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Produktdaten</b><small>Originaldokument</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Serviceanfrage</b><small>zugehöriges Dokument</small></div>\n          <div class="keeper-case-row"><span>05</span><b>Service-Schriftverkehr</b><small>2 Dokumente</small></div>\n          <div class="keeper-case-row"><span>06</span><b>Fristen und Aufgaben</b><small>nächster Schritt</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>AKTUELLER STAND</span><strong>Wir warten auf die Bestätigung des Servicetermins.</strong></div>\n      </aside>',
                      '<aside class="keeper-case-card" aria-label="Beispiel für einen geordneten Renovierungsvorgang">\n        <div class="keeper-case-head"><span>KEEPER / VORGANG</span><b>BEISPIEL</b></div>\n        <div class="keeper-case-title"><small>IMMOBILIE · RENOVIERUNG · AUSFÜHRUNG</small><strong>Renovierung · Unterlagen</strong></div>\n        <div class="keeper-case-list">\n          <div class="keeper-case-row"><span>01</span><b>Handwerkerangebot</b><small>zugehöriges Dokument</small></div>\n          <div class="keeper-case-row"><span>02</span><b>Vertrag</b><small>zugehöriges Dokument</small></div>\n          <div class="keeper-case-row"><span>03</span><b>Anzahlungsrechnung</b><small>Originaldokument</small></div>\n          <div class="keeper-case-row"><span>04</span><b>Schlussrechnung</b><small>zugehöriges Dokument</small></div>\n          <div class="keeper-case-row"><span>05</span><b>Garantieunterlagen</b><small>2 Dokumente</small></div>\n          <div class="keeper-case-row"><span>06</span><b>Fristen und Aufgaben</b><small>nächster Schritt</small></div>\n        </div>\n        <div class="keeper-case-foot"><span>AKTUELLER STAND</span><strong>Als Nächstes wird der Übergabetermin abgestimmt.</strong></div>\n      </aside>'
                  )
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one showcase block, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'UPDATED {filename}')
          PY

          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py

      - name: Commit bounded migration and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/keeper-showcase-renovation-r93.yml
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html keeper.html en/index.html en/keeper.html de/index.html de/keeper.html .github/workflows/keeper-showcase-renovation-r93.yml
          git diff --cached --check
          git commit -m "Replace Keeper showcase with renovation matter"
          git push origin HEAD:fix/keeper-showcase-renovation-r93
