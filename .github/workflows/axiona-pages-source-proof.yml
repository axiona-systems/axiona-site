name: AXIONA Pages Source Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/axiona-pages-source-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  prove-source:
    name: Prove actual Pages source
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read GitHub Pages configuration and latest build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages" > /tmp/pages.json

          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest" > /tmp/pages-latest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          pages = json.loads(Path('/tmp/pages.json').read_text())
          latest = json.loads(Path('/tmp/pages-latest.json').read_text())
          source = pages.get('source') or {}

          print(f"AXIONA_PAGES_BUILD_TYPE={pages.get('build_type')}")
          print(f"AXIONA_PAGES_SOURCE_BRANCH={source.get('branch')}")
          print(f"AXIONA_PAGES_SOURCE_PATH={source.get('path')}")
          print(f"AXIONA_PAGES_CNAME={pages.get('cname')}")
          print(f"AXIONA_PAGES_STATUS={pages.get('status')}")
          print(f"AXIONA_PAGES_LATEST_BUILD_STATUS={latest.get('status')}")
          print(f"AXIONA_PAGES_LATEST_BUILD_COMMIT={latest.get('commit')}")
          print(f"AXIONA_PAGES_LATEST_BUILD_UPDATED_AT={latest.get('updated_at')}")

          if not source.get('branch'):
              raise SystemExit('STOP_AXIONA_PAGES_SOURCE_BRANCH_MISSING')
          PY

      - name: Inspect live HTML and visual assets
        shell: bash
        env:
          PROOF_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          STAMP="${PROOF_SHA}-$(date +%s)-r111"

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "https://axiona.systems/?axiona_source_proof=${STAMP}" > /tmp/live-home.html

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "https://axiona.systems/assets/visual-r110.css?axiona_source_proof=${STAMP}" > /tmp/live-r110.css

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "https://axiona.systems/assets/visual-r109.css?release=R110&axiona_source_proof=${STAMP}" > /tmp/live-r109.css

          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          home = Path('/tmp/live-home.html').read_text(errors='replace')
          r110 = Path('/tmp/live-r110.css').read_text(errors='replace')
          r109 = Path('/tmp/live-r109.css').read_text(errors='replace')

          release = re.search(r'<meta content="([^"]+)" name="axiona-release"\s*/?>', home)
          release_value = release.group(1) if release else 'MISSING'
          direct_link = '<link href="/assets/visual-r110.css" rel="stylesheet"/>' in home
          r110_import = 'visual-r109.css?release=R110' in r110
          r109_marker = 'AXIONA R109 — engineered visual composition' in r109

          print(f"AXIONA_LIVE_RELEASE={release_value}")
          print(f"AXIONA_LIVE_DIRECT_R110_LINK={str(direct_link).lower()}")
          print(f"AXIONA_LIVE_R110_IMPORT={str(r110_import).lower()}")
          print(f"AXIONA_LIVE_R109_MARKER={str(r109_marker).lower()}")
          print(f"AXIONA_LIVE_HOME_SHA256={hashlib.sha256(home.encode()).hexdigest()}")
          print(f"AXIONA_LIVE_R110_SHA256={hashlib.sha256(r110.encode()).hexdigest()}")
          print(f"AXIONA_LIVE_R109_SHA256={hashlib.sha256(r109.encode()).hexdigest()}")
          print(f"AXIONA_LIVE_HOME_BYTES={len(home.encode())}")
          print(f"AXIONA_LIVE_R110_BYTES={len(r110.encode())}")
          print(f"AXIONA_LIVE_R109_BYTES={len(r109.encode())}")

          if not (release_value == 'R110' and direct_link and r110_import and r109_marker):
              raise SystemExit('STOP_AXIONA_LIVE_R110_NOT_MATERIALIZED')
          PY

      - name: Verify browser runtime
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "OK_AXIONA_CHROME=$CHROME_PATH"

      - name: Install pinned render inspector
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Inspect live computed composition
        shell: bash
        run: |
          set -euo pipefail
          echo "OK_AXIONA_R111_RENDER_INSPECTOR_ESM_V2"
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox']
          });

          async function inspect(label, width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            const stamp = `${Date.now()}-${label}`;
            await page.goto(`https://axiona.systems/?axiona_render_proof=${stamp}`, { waitUntil: 'networkidle' });

            const result = await page.evaluate(() => {
              const pick = (selector) => {
                const el = document.querySelector(selector);
                if (!el) return null;
                const s = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  selector,
                  display: s.display,
                  position: s.position,
                  color: s.color,
                  backgroundColor: s.backgroundColor,
                  backgroundImage: s.backgroundImage,
                  fontSize: s.fontSize,
                  lineHeight: s.lineHeight,
                  transform: s.transform,
                  boxShadow: s.boxShadow,
                  width: Math.round(r.width),
                  height: Math.round(r.height),
                  top: Math.round(r.top)
                };
              };

              return {
                release: document.querySelector('meta[name="axiona-release"]')?.content || null,
                sheets: [...document.styleSheets].map(s => s.href).filter(Boolean),
                hero: pick('.page-overview .hero'),
                heroH1: pick('.page-overview .hero-copy h1'),
                projectSheet: pick('.page-overview .project-sheet'),
                problem: pick('.page-overview .problem-spectrum'),
                problemIntro: pick('.page-overview .problem-spectrum-intro'),
                lifecycle: pick('.page-overview .lifecycle-story'),
                lifecycleBoard: pick('.page-overview .lifecycle-board'),
                keeper: pick('.page-overview .keeper-preview'),
                keeperPanel: pick('.page-overview .keeper96-preview-panel')
              };
            });

            console.log(`AXIONA_RENDER_${label.toUpperCase()}=${JSON.stringify(result)}`);

            if (result.release !== 'R110') throw new Error(`live release mismatch: ${result.release}`);
            if (!result.sheets.some(href => href && href.includes('/assets/visual-r110.css'))) throw new Error('visual-r110 stylesheet missing from rendered page');
            if (!result.heroH1 || parseFloat(result.heroH1.fontSize) < (width >= 1000 ? 70 : 48)) throw new Error(`hero typography not materially active: ${result.heroH1?.fontSize}`);
            if (!result.projectSheet || result.projectSheet.transform === 'none') throw new Error('project sheet perspective transform missing');
            if (!result.problem || !result.problem.backgroundImage.includes('gradient')) throw new Error('problem chapter composition missing');
            if (!result.keeper || !result.keeper.backgroundColor) throw new Error('keeper chapter composition missing');
            await page.close();
          }

          await inspect('desktop', 1440, 1100);
          await inspect('mobile', 390, 844);
          await browser.close();
          NODE
