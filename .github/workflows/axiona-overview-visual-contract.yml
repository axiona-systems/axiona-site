name: AXIONA Overview Visual Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "en/index.html"
      - "de/index.html"
      - "assets/visual-r110.css"
      - "assets/visual-r112.css"
      - "assets/visual-r113.css"
      - "assets/visual-r113-tuning.css"
      - "assets/visual-r115.css"
      - "assets/js/visual-r112.js"
      - ".github/workflows/axiona-overview-visual-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contract:
    name: Verify rendered overview structure
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify browser runtime
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "STOP_AXIONA_VISUAL_CONTRACT_CHROME_MISSING"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Install pinned render inspector
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/axiona-r115-http.log 2>&1 &
          echo $! > /tmp/axiona-r115-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then
              echo "OK_AXIONA_R115_SERVER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/axiona-r115-http.log || true
          exit 1

      - name: Verify R115 visual composition and repeatable motion
        shell: bash
        env:
          AXIONA_BASE: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          mkdir -p /tmp/r115-shots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox']
          });

          const routes = ['/', '/en/', '/de/'];
          const legacySelectors = ['.project-sheet', '.fact-strip', '.problem-spectrum', '.lifecycle-board', '.keeper96-preview-panel'];

          async function inspect(route, label, width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(`${process.env.AXIONA_BASE}${route}`, { waitUntil: 'networkidle' });

            const r115Text = await page.evaluate(async () => (await fetch('/assets/visual-r115.css?contract=R115')).text());
            if (!r115Text.includes('AXIONA R115 — Keeper-derived hero + system story visual language')) {
              throw new Error(`${route} R115 stylesheet marker missing`);
            }

            const result = await page.evaluate(({ legacySelectors }) => {
              const one = (selector) => document.querySelector(selector);
              const style = (selector) => {
                const el = one(selector);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  width: Math.round(r.width), height: Math.round(r.height), top: Math.round(r.top), bottom: Math.round(r.bottom),
                  display: s.display, grid: s.gridTemplateColumns, background: s.backgroundColor,
                  backgroundImage: s.backgroundImage, color: s.color, boxShadow: s.boxShadow,
                  transform: s.transform, borderLeftColor: s.borderLeftColor
                };
              };
              const hrefs = [...document.styleSheets].map(sheet => sheet.href || '');
              const steps = [...document.querySelectorAll('.ax112-step')].map((el) => getComputedStyle(el).backgroundColor);

              return {
                release: document.querySelector('meta[name="axiona-release"]')?.content || null,
                directR110: hrefs.some(href => href.includes('/assets/visual-r110.css?release=R115')),
                directR112: hrefs.some(href => href.includes('/assets/visual-r112.css?release=R115')),
                directR113: hrefs.some(href => href.includes('/assets/visual-r113.css?release=R115')),
                directTuning: hrefs.some(href => href.includes('/assets/visual-r113-tuning.css?release=R115')),
                directR115: hrefs.some(href => href.includes('/assets/visual-r115.css?release=R115')),
                visualJs: document.querySelector('script[src*="visual-r112.js?release=R115"]') !== null,
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                counts: {
                  hero: document.querySelectorAll('.ax112-hero').length,
                  model: document.querySelectorAll('.ax112-model').length,
                  steps: document.querySelectorAll('.ax112-step').length,
                  fields: document.querySelectorAll('.ax112-field-row').length,
                  cycle: document.querySelectorAll('.ax112-cycle > li').length,
                  trust: document.querySelectorAll('.ax112-trust').length,
                  caseStudy: document.querySelectorAll('.ax112-case').length,
                  cta: document.querySelectorAll('.ax112-cta').length,
                  legacy: legacySelectors.reduce((sum, selector) => sum + document.querySelectorAll(selector).length, 0)
                },
                hero: style('.ax112-hero'),
                copy: style('.ax112-hero-copy'),
                visual: style('.ax112-hero-visual'),
                model: style('.ax112-model'),
                stage: style('.ax112-stage'),
                networkSvg: style('.ax112-stage svg'),
                core: style('.ax112-node.is-core'),
                output: style('.ax112-node.is-output'),
                story: style('.ax112-story'),
                storyList: style('.ax112-story-list'),
                currentStep: style('.ax112-step.is-current'),
                nextStep: style('.ax112-step:not(.is-current)'),
                stepVisual: style('.ax112-step-visual'),
                miniLine: style('.ax112-mini-line'),
                trust: style('.ax112-trust'),
                device: style('.ax112-device'),
                stepBackgrounds: steps
              };
            }, { legacySelectors });

            console.log(`AXIONA_R115_${route.replaceAll('/', '_') || 'root'}_${label}=${JSON.stringify(result)}`);

            const expected = result.counts.hero === 1 && result.counts.model === 1 && result.counts.steps === 3 && result.counts.fields === 6 && result.counts.cycle === 6 && result.counts.trust === 1 && result.counts.caseStudy === 1 && result.counts.cta === 1;
            if (result.release !== 'R115') throw new Error(`${route} release is ${result.release}, expected R115`);
            if (!result.directR110 || !result.directR112 || !result.directR113 || !result.directTuning || !result.directR115 || !result.visualJs) {
              throw new Error(`${route} R115 direct binding incomplete`);
            }
            if (!expected || result.counts.legacy !== 0) throw new Error(`${route} structural contract mismatch`);
            if (result.scrollWidth > result.clientWidth + 2) throw new Error(`${route} ${label} horizontal overflow ${result.scrollWidth}/${result.clientWidth}`);

            if (!result.visual?.background.includes('229, 223, 211')) throw new Error(`${route} hero warm field missing`);
            if (!result.model?.background.includes('251, 250, 246')) throw new Error(`${route} hero is still a dark diagram instead of Keeper work surface: ${result.model?.background}`);
            if (result.networkSvg?.display !== 'none') throw new Error(`${route} legacy relationship network still visible`);
            if (result.stage?.display !== 'grid') throw new Error(`${route} hero work surface is not grid`);
            if (!result.core?.background.includes('255, 253, 248')) throw new Error(`${route} system core is not document-like work surface`);
            if (!result.output?.background.includes('11, 30, 37')) throw new Error(`${route} controlled output lost petrol control surface`);

            if (!result.story?.background.includes('229, 223, 211')) throw new Error(`${route} story chapter lost warm AXIONA field`);
            if (!result.storyList?.background.includes('11, 30, 37')) throw new Error(`${route} story lacks one common petrol frame`);
            if (!result.currentStep?.background.includes('251, 250, 246') || !result.nextStep?.background.includes('251, 250, 246')) {
              throw new Error(`${route} story still flips whole-card colors`);
            }
            if (new Set(result.stepBackgrounds).size !== 1) throw new Error(`${route} story step backgrounds differ: ${result.stepBackgrounds.join(',')}`);
            if (result.miniLine?.display !== 'none') throw new Error(`${route} old diagram lines still visible in story`);
            if (!result.trust?.background.includes('11, 30, 37')) throw new Error(`${route} deliberate dark trust chapter changed unexpectedly`);
            if (!result.device?.background.includes('251, 250, 246')) throw new Error(`${route} Keeper case visual changed unexpectedly`);

            if (route === '/') {
              const probe = page.locator('.ax112-field-row').first();
              await probe.scrollIntoViewIfNeeded();
              await page.waitForTimeout(180);
              if (!(await probe.evaluate(el => el.classList.contains('is-visible')))) throw new Error('R115 reveal did not activate');
              await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
              await page.waitForTimeout(220);
              if (await probe.evaluate(el => el.classList.contains('is-visible'))) throw new Error('R115 reveal remained permanently latched');
              await probe.scrollIntoViewIfNeeded();
              await page.waitForTimeout(180);
              if (!(await probe.evaluate(el => el.classList.contains('is-visible')))) throw new Error('R115 reveal did not reactivate on return scroll');

              await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
              await page.waitForTimeout(80);
              await page.screenshot({ path: `/tmp/r115-shots/axiona-r115-${label}-full.png`, fullPage: true });
              await page.locator('.ax112-hero').screenshot({ path: `/tmp/r115-shots/axiona-r115-${label}-hero.png` });
              await page.locator('.ax112-story').screenshot({ path: `/tmp/r115-shots/axiona-r115-${label}-story.png` });
            }

            await page.close();
          }

          for (const route of routes) {
            await inspect(route, 'desktop', 1440, 1000);
            await inspect(route, 'mobile', 390, 844);
          }

          await browser.close();
          console.log('OK_AXIONA_R115_KEEPER_VISUAL_REPEATABLE_MOTION_CONTRACT');
          NODE

      - name: Upload rendered R115 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axiona-r115-render-evidence
          path: /tmp/r115-shots/*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
