name: AXIONA Browser Quality Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.html"
      - "en/*.html"
      - "de/*.html"
      - "assets/**"
      - "scripts/axe-audit.mjs"
      - "lighthouserc.json"
      - ".github/workflows/axiona-browser-audit.yml"
  workflow_dispatch:

jobs:
  browser-audit:
    name: Lighthouse + axe
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify browser audit runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "STOP_AXIONA_BROWSER_AUDIT_CHROME_MISSING"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "OK_AXIONA_BROWSER_AUDIT_CHROME=$CHROME_PATH"

      - name: Install pinned browser audit tools without lifecycle scripts
        shell: bash
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund \
            @lhci/cli@0.15.1 \
            playwright-core@1.62.1 \
            axe-core@4.12.1

      - name: Run Lighthouse quality budgets
        shell: bash
        run: npx --no-install lhci autorun --config=./lighthouserc.json

      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/axiona-http.log 2>&1 &
          echo $! > /tmp/axiona-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "OK_AXIONA_STATIC_SERVER_READY"
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/axiona-http.log || true
          echo "STOP_AXIONA_STATIC_SERVER_NOT_READY"
          exit 1

      - name: Run axe WCAG audit
        shell: bash
        env:
          AXIONA_AUDIT_BASE: http://127.0.0.1:4173
        run: node scripts/axe-audit.mjs
