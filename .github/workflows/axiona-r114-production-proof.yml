name: AXIONA R114 Production Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/axiona-r114-production-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  prove-production:
    name: Prove R114 production convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify exact Pages build and live direct R114 bindings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN: 8d77586731725fc189640d433b5e395028ba3260
        run: |
          set -euo pipefail

          latest_pages() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/pages/builds/latest"
          }

          for attempt in $(seq 1 36); do
            PAYLOAD="$(latest_pages)"
            read -r STATUS COMMIT < <(printf '%s' "$PAYLOAD" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status","unknown"), d.get("commit","missing"))')
            echo "PAGES_ATTEMPT=${attempt} STATUS=${STATUS} COMMIT=${COMMIT} EXPECTED=${EXPECTED_MAIN}"
            if [ "$COMMIT" = "$EXPECTED_MAIN" ] && [ "$STATUS" = "built" ]; then
              break
            fi
            if [ "$attempt" = 36 ]; then
              echo "STOP_AXIONA_R114_EXACT_PAGES_BUILD_NOT_READY" >&2
              exit 1
            fi
            sleep 5
          done

          overview_ok() {
            local html="$1"
            grep -Fq 'content="R114" name="axiona-release"' <<<"$html" \
              && grep -Fq '/assets/visual-r110.css?release=R114' <<<"$html" \
              && grep -Fq '/assets/visual-r112.css?release=R114' <<<"$html" \
              && grep -Fq '/assets/visual-r113.css?release=R114' <<<"$html" \
              && grep -Fq '/assets/visual-r113-tuning.css?release=R114' <<<"$html" \
              && grep -Fq '/assets/js/visual-r112.js?release=R114' <<<"$html" \
              && grep -Fq 'class="ax112-hero"' <<<"$html" \
              && grep -Fq 'class="ax112-model"' <<<"$html" \
              && grep -Fq 'class="ax112-story"' <<<"$html" \
              && grep -Fq 'class="ax112-cycle"' <<<"$html" \
              && ! grep -Fq 'class="project-sheet"' <<<"$html"
          }

          for attempt in $(seq 1 30); do
            KEY="${EXPECTED_MAIN}-r114-production-${attempt}"
            HU="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/?proof=${KEY}" || true)"
            EN="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/en/?proof=${KEY}" || true)"
            DE="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/de/?proof=${KEY}" || true)"
            R110="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/visual-r110.css?release=R114&proof=${KEY}" || true)"
            R112="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/visual-r112.css?release=R114&proof=${KEY}" || true)"
            R113="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/visual-r113.css?release=R114&proof=${KEY}" || true)"
            TUNING="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/visual-r113-tuning.css?release=R114&proof=${KEY}" || true)"
            VISUAL_JS="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/js/visual-r112.js?release=R114&proof=${KEY}" || true)"

            if overview_ok "$HU" && overview_ok "$EN" && overview_ok "$DE" \
              && grep -Fq 'visual-r113.css?release=R113' <<<"$R110" \
              && grep -Fq 'AXIONA R112 — structural visual redesign' <<<"$R112" \
              && grep -Fq 'AXIONA R113 — Keeper-calibrated overview visual language' <<<"$R113" \
              && grep -Fq 'AXIONA R113 — final homepage calibration' <<<"$TUNING" \
              && grep -Fq 'content:none!important' <<<"$TUNING" \
              && grep -Fq 'AXIONA R112 — structural interaction layer' <<<"$VISUAL_JS"; then
              echo "OK_AXIONA_R114_PRODUCTION_CONVERGED=${EXPECTED_MAIN}"
              exit 0
            fi
            sleep 5
          done

          echo "STOP_AXIONA_R114_PRODUCTION_NOT_CONVERGED" >&2
          exit 1
