name: AXIONA Support R123 Visual Contract

on:
  pull_request:
    branches: [main]
    paths:
      - support.html
      - en/support.html
      - de/support.html
      - assets/support-r123.css
      - assets/js/support-r123.js
      - .github/workflows/axiona-support-r123-visual-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contract:
    name: Verify rendered support page contract
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare browser inspector
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || exit 1
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          python3 -m http.server 4180 --bind 127.0.0.1 >/tmp/r123-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4180/support.html >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Verify HU EN DE desktop and mobile
        shell: bash
        env:
          BASE: http://127.0.0.1:4180
        run: |
          set -euo pipefail
          mkdir -p /tmp/r123-shots
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
          const routes=[['/support.html','hu'],['/en/support.html','en'],['/de/support.html','de']];
          const has=(v,x)=>v?.includes(x);
          for(const [route,lang] of routes) for(const [label,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width:w,height:h}});
            await page.goto(process.env.BASE+route,{waitUntil:'networkidle'});
            const marker=await page.evaluate(async()=>({css:await(await fetch('/assets/support-r123.css')).text(),js:await(await fetch('/assets/js/support-r123.js')).text()}));
            if(!marker.css.includes('AXIONA R123 — Support page visual contract')||!marker.js.includes('AXIONA R123 — repeatable, progressive-enhancement support reveal motion')) throw Error(route+' asset marker');
            const r=await page.evaluate(()=>{const st=q=>{const e=document.querySelector(q),s=e&&getComputedStyle(e);return s&&{bg:s.backgroundColor,bgi:s.backgroundImage,cursor:s.cursor,opacity:s.opacity,color:s.color}};return{
              release:document.querySelector('meta[name="axiona-release"]')?.content,lang:document.documentElement.lang,
              css:[...document.styleSheets].some(x=>(x.href||'').includes('/assets/support-r123.css?release=R123')),js:[...document.scripts].some(x=>(x.src||'').includes('/assets/js/support-r123.js?release=R123')),
              sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,
              c:[document.querySelectorAll('main h1').length,document.querySelectorAll('.method-list article').length,document.querySelectorAll('.credit-card').length,document.querySelectorAll('.stage-list article').length,document.querySelectorAll('.contact.standalone-contact').length,document.querySelectorAll('.contact a[href^="mailto:hello@axiona.systems"]').length,document.querySelectorAll('footer').length],
              body:st('body'),method:st('.method'),methodRow:st('.method-list article'),credit:st('.credit-card'),anatomy:st('.anatomy'),stage:st('.stage-list article'),contact:st('.contact.standalone-contact'),contactRow:st('.contact>aside p')};});
            if(r.release!=='R123'||r.lang!==lang||!r.css||!r.js||r.sw>r.cw+2) throw Error(route+' binding/overflow');
            if(JSON.stringify(r.c)!==JSON.stringify([1,4,1,4,1,1,1])) throw Error(route+' structure '+JSON.stringify(r.c));
            if(!has(r.body.bg,'241, 238, 230')||!has(r.method.bg,'241, 238, 230')||r.method.bgi!=='none') throw Error(route+' paper opening');
            if(!has(r.methodRow.bg,'255, 253, 248')||!has(r.credit.bg,'11, 30, 37')||!has(r.anatomy.bg,'232, 235, 229')||!has(r.stage.bg,'251, 250, 246')||!has(r.contact.bg,'229, 223, 211')||!has(r.contactRow.bg,'255, 253, 248')) throw Error(route+' surfaces');
            for(const item of [r.methodRow,r.stage,r.contactRow]) if(item.cursor!=='default'||item.opacity!=='1') throw Error(route+' informational affordance/opacity');
            if(route==='/support.html'&&label==='desktop'){
              const probe=page.locator('.stage-list article').last();await probe.scrollIntoViewIfNeeded();await page.waitForTimeout(220);if(!await probe.evaluate(e=>e.classList.contains('is-visible')))throw Error('reveal-on');await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(260);if(await probe.evaluate(e=>e.classList.contains('is-visible')))throw Error('reveal-latched');await probe.scrollIntoViewIfNeeded();await page.waitForTimeout(220);if(!await probe.evaluate(e=>e.classList.contains('is-visible')))throw Error('reveal-return');
            }
            await page.evaluate(()=>document.querySelectorAll('[data-support-reveal]').forEach(e=>e.classList.add('is-visible')));
            await page.screenshot({path:`/tmp/r123-shots/${lang}-${label}.png`,fullPage:true});await page.close();
          }
          await browser.close();console.log('OK_AXIONA_SUPPORT_R123_VISUAL_CONTRACT');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axiona-support-r123-render-evidence
          path: /tmp/r123-shots/*.png
          if-no-files-found: error
          retention-days: 3
