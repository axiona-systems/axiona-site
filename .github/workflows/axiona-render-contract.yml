name: AXIONA Render Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "en/**"
      - "de/**"
      - "assets/**"
      - "scripts/**"
      - "site.webmanifest"
      - ".github/workflows/axiona-render-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiona-render-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-contract:
    name: Verify current canonical render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify repository policy before browser work
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_asset_references.py
          python3 scripts/verify_workflow_hardening.py

      - name: Prepare browser runtime
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || { echo STOP_AXIONA_RENDER_CHROME_MISSING; exit 1; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/axiona-render-http.log 2>&1 &
          echo $! >/tmp/axiona-render-http.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4176/ >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/axiona-render-http.log || true
          exit 1

      - name: Verify route, navigation, geometry and motion contracts
        shell: bash
        env:
          AXIONA_BASE: http://127.0.0.1:4176
        run: node scripts/verify_render_contract.mjs
