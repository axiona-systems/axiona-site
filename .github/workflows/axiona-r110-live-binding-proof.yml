name: AXIONA R110 Live Binding Proof

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/visual-r110.css"
      - "assets/visual-r109.css"
      - "assets/visual-r109-compat.css"
      - ".github/workflows/axiona-r110-live-binding-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live-binding:
    name: Prove R110 live binding
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify canonical source contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prove canonical R110 binding
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<meta content="R110" name="axiona-release"/>' index.html
          grep -Fq '<link href="/assets/visual-r110.css" rel="stylesheet"/>' index.html
          grep -Fq 'visual-r109.css?release=R110' assets/visual-r110.css
          grep -Fq 'visual-r109-compat.css?release=R110' assets/visual-r110.css
          echo "OK_AXIONA_R110_CANONICAL_BINDING"

      - name: Prove public R110 binding
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            stamp="${GITHUB_SHA}-${attempt}-r110"
            home="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/?axiona_r110=${stamp}" || true)"
            css="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://axiona.systems/assets/visual-r110.css?axiona_r110=${stamp}" || true)"
            if grep -Fq '<meta content="R110" name="axiona-release"/>' <<<"$home" \
              && grep -Fq '<link href="/assets/visual-r110.css" rel="stylesheet"/>' <<<"$home" \
              && grep -Fq 'visual-r109.css?release=R110' <<<"$css"; then
              echo "OK_AXIONA_R110_LIVE_BINDING"
              exit 0
            fi
            sleep 5
          done
          echo "STOP_AXIONA_R110_LIVE_BINDING_NOT_CONVERGED" >&2
          exit 1
