name: AXIONA Brand Master Package

on:
  pull_request:
    paths:
      - 'brand/**'
      - '.github/workflows/brand-master-package.yml'
  push:
    branches: [main]
    paths:
      - 'brand/**'
      - '.github/workflows/brand-master-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-brand-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install export dependencies
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.7.1' 'Pillow==11.3.0'

      - name: Build canonical exports
        run: >-
          python brand/assets/master-v1/build_exports.py
          --source-dir brand/assets/master-v1
          --output dist/axiona-brand-master-v1

      - name: Upload complete brand package
        uses: actions/upload-artifact@v4
        with:
          name: axiona-brand-master-v1
          path: |
            dist/axiona-brand-master-v1/
            dist/axiona-brand-master-v1.zip
          if-no-files-found: error
          retention-days: 90
