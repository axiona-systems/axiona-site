name: AXIONA Keeper R125 Visual Contract

on:
  pull_request:
    branches: [main]
    paths:
      - keeper.html
      - en/keeper.html
      - de/keeper.html
      - assets/keeper-r125.css
      - assets/js/keeper-r125.js
      - .github/workflows/axiona-keeper-r125-visual-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contract:
    name: Verify rendered Keeper page contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare browser inspector
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || exit 1
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          python3 -m http.server 4182 --bind 127.0.0.1 >/tmp/r125-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4182/keeper.html >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Verify HU EN DE desktop and mobile
        shell: bash
        env:
          BASE: http://127.0.0.1:4182
        run: |
          set -euo pipefail
          mkdir -p /tmp/r125-shots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
          const routes=[['/keeper.html','hu'],['/en/keeper.html','en'],['/de/keeper.html','de']];
          const has=(v,x)=>v?.includes(x);
          for(const [route,lang] of routes) for(const [label,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width:w,height:h}});
            await page.goto(process.env.BASE+route,{waitUntil:'networkidle'});
            const markers=await page.evaluate(async()=>({css:await(await fetch('/assets/keeper-r125.css')).text(),js:await(await fetch('/assets/js/keeper-r125.js')).text()}));
            if(!markers.css.includes('AXIONA R125 — Keeper visual alignment and cache-safe hardening')||!markers.js.includes('AXIONA R125 — repeatable, progressive-enhancement Keeper reveal motion')) throw Error(route+' asset marker');
            const r=await page.evaluate(()=>{const st=q=>{const e=document.querySelector(q),s=e&&getComputedStyle(e);return s&&{bg:s.backgroundColor,bgi:s.backgroundImage,cursor:s.cursor,opacity:s.opacity}};return{
              release:document.querySelector('meta[name="axiona-release"]')?.content,
              lang:document.documentElement.lang,
              css:[...document.styleSheets].some(x=>(x.href||'').includes('/assets/keeper-r125.css?release=R125')),
              js:[...document.scripts].some(x=>(x.src||'').includes('/assets/js/keeper-r125.js?release=R125')),
              sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,
              c:[document.querySelectorAll('main h1').length,document.querySelectorAll('.keeper96-workcard').length,document.querySelectorAll('.keeper96-workrow').length,document.querySelectorAll('.keeper96-question').length,document.querySelectorAll('.keeper96-process-step').length,document.querySelectorAll('.keeper96-compare-row').length,document.querySelectorAll('.keeper96-example').length,document.querySelectorAll('.keeper96-trust-card').length,document.querySelectorAll('.keeper96-dev').length,document.querySelectorAll('.ax-share').length,document.querySelectorAll('footer').length],
              status:(document.querySelector('.keeper-status-badge')?.textContent||'').trim(),
              planned:(document.querySelector('.keeper96-workcard-head b')?.textContent||'').trim(),
              body:st('body'),hero:st('.keeper96-hero'),workcard:st('.keeper96-workcard'),incoming:st('.keeper96-incoming'),core:st('.keeper96-core'),question:st('.keeper96-question'),process:st('.keeper96-process-step'),contrast:st('.keeper96-contrast'),compare:st('.keeper96-compare-row'),example:st('.keeper96-example'),trust:st('.keeper96-trust'),trustCard:st('.keeper96-trust-card'),devBadge:st('.keeper96-dev-badge')};});
            if(r.release!=='R125'||r.lang!==lang||!r.css||!r.js||r.sw>r.cw+2) throw Error(route+' binding/overflow');
            if(JSON.stringify(r.c)!==JSON.stringify([1,1,5,4,6,5,4,4,1,1,1])) throw Error(route+' structure '+JSON.stringify(r.c));
            if(!r.status||!r.planned) throw Error(route+' product status/planned wording missing');
            if(!has(r.body.bg,'241, 238, 230')||!has(r.hero.bg,'241, 238, 230')||r.hero.bgi!=='none') throw Error(route+' paper hero');
            if(!has(r.workcard.bg,'251, 250, 246')||!has(r.incoming.bg,'255, 253, 248')||!has(r.core.bg,'232, 235, 229')||!has(r.question.bg,'251, 250, 246')||!has(r.process.bg,'251, 250, 246')||!has(r.contrast.bg,'11, 30, 37')||!has(r.example.bg,'251, 250, 246')||!has(r.trust.bg,'232, 235, 229')||!has(r.trustCard.bg,'251, 250, 246')||!has(r.devBadge.bg,'11, 30, 37')) throw Error(route+' surfaces');
            for(const item of [r.question,r.process,r.compare,r.example,r.trustCard]) if(item.cursor!=='default'||item.opacity!=='1') throw Error(route+' informational affordance/opacity');
            if(route==='/keeper.html'&&label==='desktop'){
              const probe=page.locator('.keeper96-trust-card').last();
              await probe.scrollIntoViewIfNeeded();await page.waitForTimeout(220);
              if(!await probe.evaluate(e=>e.classList.contains('is-visible'))) throw Error('reveal-on');
              await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(260);
              if(await probe.evaluate(e=>e.classList.contains('is-visible'))) throw Error('reveal-latched');
              await probe.scrollIntoViewIfNeeded();await page.waitForTimeout(220);
              if(!await probe.evaluate(e=>e.classList.contains('is-visible'))) throw Error('reveal-return');
            }
            await page.evaluate(()=>document.querySelectorAll('[data-keeper125-reveal]').forEach(e=>e.classList.add('is-visible')));
            await page.screenshot({path:`/tmp/r125-shots/${lang}-${label}.png`,fullPage:true});
            if(lang==='hu'&&label==='desktop'){
              await page.locator('.keeper96-hero').screenshot({path:'/tmp/r125-shots/hu-hero.png'});
              await page.locator('.keeper96-contrast').screenshot({path:'/tmp/r125-shots/hu-contrast.png'});
              await page.locator('.keeper96-trust').screenshot({path:'/tmp/r125-shots/hu-trust.png'});
            }
            await page.close();
          }
          await browser.close();console.log('OK_AXIONA_KEEPER_R125_VISUAL_CONTRACT');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axiona-keeper-r125-render-evidence
          path: /tmp/r125-shots/*.png
          if-no-files-found: error
          retention-days: 3
