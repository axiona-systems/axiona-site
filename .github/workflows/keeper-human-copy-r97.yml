name: Keeper R97 Human Copy

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'feature/keeper-human-copy-r97'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/keeper-human-copy-r97
      - name: Apply R97 human copy and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_keeper_human_copy_r97.py
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/patch_keeper_human_copy_r97.py .github/workflows/keeper-human-copy-r97.yml
          git add keeper.html index.html solutions.html en/keeper.html en/index.html en/solutions.html de/keeper.html de/index.html de/solutions.html scripts/verify_public_quality.py .github/workflows/axiona-pages-rebuild.yml
          git commit -m "Polish Keeper copy for natural language"
          git push origin HEAD:feature/keeper-human-copy-r97
