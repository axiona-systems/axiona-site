name: Keeper Intelligence Story R96 Migration

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feature/keeper-intelligence-story-r96'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/keeper-intelligence-story-r96
      - name: Apply R96 Keeper story and gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_keeper_intelligence_story_r96.py
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/patch_keeper_intelligence_story_r96.py .github/workflows/keeper-intelligence-story-r96-migration.yml
          git add keeper.html en/keeper.html de/keeper.html index.html en/index.html de/index.html solutions.html en/solutions.html de/solutions.html assets/keeper-r94.css scripts/verify_public_quality.py .github/workflows/axiona-pages-rebuild.yml
          git commit -m "Reframe Keeper around document intelligence"
          git push origin HEAD:feature/keeper-intelligence-story-r96
