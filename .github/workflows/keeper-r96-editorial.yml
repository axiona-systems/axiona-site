name: Keeper R96 Editorial Polish

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'feature/keeper-intelligence-story-r96'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/keeper-intelligence-story-r96
      - name: Apply editorial polish and gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/editorial_keeper_r96.py
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/editorial_keeper_r96.py .github/workflows/keeper-r96-editorial.yml
          git add keeper.html en/keeper.html de/keeper.html
          git commit -m "Polish Keeper R96 product copy"
          git push origin HEAD:feature/keeper-intelligence-story-r96
