name: AXIONA R143 Candidate Patch V2 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r143-candidate-patch-v2-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout main control worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Checkout exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/r143-repo-cleanup-hardening
          path: candidate
          fetch-depth: 2

      - name: Patch and commit candidate source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C candidate rev-parse HEAD)"
          EXPECTED=58cc64a90c6eb4f6b291f5996e45ae69f198dc63
          test "$ACTUAL" = "$EXPECTED" || { echo "STOP_R143_PATCH_V2_HEAD expected=${EXPECTED} actual=${ACTUAL}"; exit 1; }

          python3 <<'PY'
          from pathlib import Path

          p=Path('candidate/assets/multipage-r78.css')
          text=p.read_text(encoding='utf-8')
          old='@import url("/assets/multipage-r74.css");\n@import url("/assets/motion-r105.css");\n'
          new='@import url("/assets/visual-r109.css");\n@import url("/assets/visual-r109-compat.css");\n'
          if text.count(old) != 1:
              raise SystemExit('STOP_R143_MULTIPAGE_IMPORT_PATTERN')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('candidate/assets/js/share-r86.js')
          text=p.read_text(encoding='utf-8')
          block="""  const motionStyleId = 'axiona-motion-r108';
  if (!document.getElementById(motionStyleId)) {
    const link = document.createElement('link');
    link.id = motionStyleId;
    link.rel = 'stylesheet';
    link.href = '/assets/motion-r108.css';
    document.head.appendChild(link);
  }

"""
          if text.count(block) != 1:
              raise SystemExit('STOP_R143_SHARE_BOOTSTRAP_PATTERN')
          p.write_text(text.replace(block,'',1),encoding='utf-8')

          p=Path('candidate/.github/workflows/axiona-browser-audit.yml')
          text=p.read_text(encoding='utf-8')
          if text.count('axe-core@4.12.1') != 1:
              raise SystemExit('STOP_R143_AXE_VERSION_PATTERN')
          p.write_text(text.replace('axe-core@4.12.1','axe-core@4.13.0'),encoding='utf-8')
          PY

          git -C candidate diff --check
          git -C candidate config user.name 'AXIONA Release Automation'
          git -C candidate config user.email 'actions@users.noreply.github.com'
          git -C candidate add assets/multipage-r78.css assets/js/share-r86.js .github/workflows/axiona-browser-audit.yml
          git -C candidate commit -m 'R143: flatten remaining compatibility imports and refresh axe'
          git -C candidate push origin HEAD:agent/r143-repo-cleanup-hardening

      - name: Remove one-shot patcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/axiona-r143-candidate-patch-v2-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R143: remove candidate patcher v2'
          git push origin HEAD:main
