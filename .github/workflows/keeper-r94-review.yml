name: Keeper R94 Review

on:
  push:
    branches:
      - feature/keeper-product-story-r94
    paths:
      - "scripts/patch_keeper_r94_review.py"
      - ".github/workflows/keeper-r94-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply review refinements
        run: python3 scripts/patch_keeper_r94_review.py

      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check
          if grep -Fq 'keeper-doc-type">DÁTUM' keeper.html; then exit 1; fi
          if grep -Fq 'keeper-doc-type">DATE' en/keeper.html; then exit 1; fi
          if grep -Fq 'keeper-doc-type">TERMIN' de/keeper.html; then exit 1; fi
          echo "OK_KEEPER_R94_REVIEW_GATES"

      - name: Commit reviewed R94 state
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch_keeper_r94_review.py
          rm -f .github/workflows/keeper-r94-review.yml
          git add -A
          if git diff --cached --quiet; then
            echo "STOP_R94_REVIEW_NO_CHANGES"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine Keeper R94 product story"
          git push origin HEAD:feature/keeper-product-story-r94
          echo "OK_KEEPER_R94_REVIEW_COMMITTED"
