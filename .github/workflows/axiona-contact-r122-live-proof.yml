name: AXIONA Contact R122 Live Proof

on:
  push:
    branches: [main]
    paths:
      - contact.html
      - en/contact.html
      - de/contact.html
      - assets/contact-r122.css
      - assets/js/contact-r122.js
      - .github/workflows/axiona-contact-r122-live-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live:
    name: Verify live R122 contact release
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify exact live R122 bindings and assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            KEY="${GITHUB_SHA}-contact-r122-${attempt}"
            HU="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/contact.html?proof=${KEY}" || true)"
            EN="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/en/contact.html?proof=${KEY}" || true)"
            DE="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/de/contact.html?proof=${KEY}" || true)"
            CSS="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/assets/contact-r122.css?release=R122&proof=${KEY}" || true)"
            JS="$(curl -fsSL -H 'Cache-Control: no-cache' "https://axiona.systems/assets/js/contact-r122.js?release=R122&proof=${KEY}" || true)"
            ok=true
            for PAGE in "$HU" "$EN" "$DE"; do
              grep -Fq '/assets/contact-r122.css?release=R122' <<<"$PAGE" || ok=false
              grep -Fq '/assets/js/contact-r122.js?release=R122' <<<"$PAGE" || ok=false
              grep -Fq '/assets/js/contact-intake.js' <<<"$PAGE" || ok=false
              grep -Fq 'content="R122" name="axiona-release"' <<<"$PAGE" || ok=false
              grep -Fq 'data-intake-form' <<<"$PAGE" || ok=false
            done
            if [ "$ok" = true ] && grep -Fq 'AXIONA R122 — Contact page visual contract' <<<"$CSS" && grep -Fq 'AXIONA R122 — repeatable, progressive-enhancement contact reveal motion' <<<"$JS"; then
              echo "OK_AXIONA_CONTACT_R122_LIVE"
              echo "PROVEN_PAGES_SOURCE_SHA=${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "STOP_AXIONA_CONTACT_R122_NOT_LIVE_FOR_SHA=${GITHUB_SHA}" >&2
          exit 1
