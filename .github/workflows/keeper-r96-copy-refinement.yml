name: Keeper R96 Copy Refinement

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'feature/keeper-intelligence-story-r96'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/keeper-intelligence-story-r96
      - name: Refine human-facing Keeper copy and run gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refine_keeper_r96_copy.py
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/refine_keeper_r96_copy.py .github/workflows/keeper-r96-copy-refinement.yml
          git add keeper.html en/keeper.html de/keeper.html
          git commit -m "Refine Keeper R96 copy for clarity"
          git push origin HEAD:feature/keeper-intelligence-story-r96
