name: AXIONA Sitemap R130 Invariants Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "sitemap.xml"
      - "scripts/verify_sitemap_hreflang.py"
      - ".github/workflows/axiona-repo-guard.yml"
      - ".github/workflows/axiona-sitemap-r130-invariants-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap-contract:
    name: Prove sitemap hreflang invariants fail closed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Baseline sitemap must pass
        shell: bash
        run: python3 scripts/verify_sitemap_hreflang.py

      - name: Negative sitemap fixtures must fail
        shell: bash
        run: |
          set -euo pipefail

          make_case() {
            rm -rf /tmp/r130-case
            mkdir -p /tmp/r130-case
            tar --exclude=.git -cf - . | tar -xf - -C /tmp/r130-case
          }

          expect_fail() {
            local marker="$1"
            if python3 /tmp/r130-case/scripts/verify_sitemap_hreflang.py --root /tmp/r130-case >/tmp/r130-out 2>&1; then
              echo "STOP_R130_NEGATIVE_CASE_PASSED_UNEXPECTEDLY: $marker"
              cat /tmp/r130-out
              exit 1
            fi
            grep -Fq "$marker" /tmp/r130-out || {
              echo "STOP_R130_EXPECTED_MARKER_MISSING: $marker"
              cat /tmp/r130-out
              exit 1
            }
          }

          make_case
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r130-case/sitemap.xml')
          t=p.read_text(encoding='utf-8')
          old='<xhtml:link rel="alternate" hreflang="en" href="https://axiona.systems/en/systems.html"/>'
          new='<xhtml:link rel="alternate" hreflang="en" href="https://axiona.systems/de/systems.html"/>'
          assert old in t
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          expect_fail "sitemap hreflang mismatch"

          make_case
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r130-case/sitemap.xml')
          t=p.read_text(encoding='utf-8')
          needle='    <xhtml:link rel="alternate" hreflang="en" href="https://axiona.systems/en/"/>\n'
          assert needle in t
          p.write_text(t.replace(needle,needle+needle,1),encoding='utf-8')
          PY
          expect_fail "duplicate sitemap hreflang"

          echo OK_AXIONA_SITEMAP_R130_NEGATIVE_CONTRACT
