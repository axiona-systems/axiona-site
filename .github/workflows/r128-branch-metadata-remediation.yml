name: R128 Branch Metadata Remediation

on:
  push:
    branches:
      - feature/public-surface-invariants-r128
    paths:
      - .github/workflows/r128-branch-metadata-remediation.yml

permissions:
  contents: write

concurrency:
  group: r128-branch-metadata-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Restore canonical and hreflang parity then self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Insert missing metadata in the four affected route families
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          host = 'https://axiona.systems'
          routes = ('systems.html','process.html','security.html','solutions.html')
          langs = {'hu':'','en':'en/','de':'de/'}

          def url(prefix: str, route: str) -> str:
              return f'{host}/{prefix}{route}'

          for lang, prefix in langs.items():
              for route in routes:
                  path = Path(prefix) / route if prefix else Path(route)
                  text = path.read_text(encoding='utf-8')
                  if 'rel="canonical"' in text:
                      raise SystemExit(f'STOP_R128_CANONICAL_ALREADY_PRESENT={path}')
                  if 'hreflang=' in text:
                      raise SystemExit(f'STOP_R128_HREFLANG_ALREADY_PRESENT={path}')
                  hu = url('', route)
                  block = (
                      f'\n<link href="{url(prefix, route)}" rel="canonical"/>'
                      f'\n<link href="{hu}" hreflang="hu" rel="alternate"/>'
                      f'\n<link href="{url("en/", route)}" hreflang="en" rel="alternate"/>'
                      f'\n<link href="{url("de/", route)}" hreflang="de" rel="alternate"/>'
                      f'\n<link href="{hu}" hreflang="x-default" rel="alternate"/>'
                  )
                  if text.count('</head>') != 1:
                      raise SystemExit(f'STOP_R128_HEAD_COUNT={path}')
                  path.write_text(text.replace('</head>', block + '\n</head>', 1), encoding='utf-8')
                  print(f'R128_METADATA_UPDATED={path}')
          PY
      - name: Prove remediated branch satisfies strengthened verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_site.py
          git diff --check
      - name: Self-remove migration workflow and push one remediation commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r128-branch-metadata-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems.html process.html security.html solutions.html \
                  en/systems.html en/process.html en/security.html en/solutions.html \
                  de/systems.html de/process.html de/security.html de/solutions.html \
                  .github/workflows/r128-branch-metadata-remediation.yml
          git diff --cached --check
          git commit -m "R128: restore canonical and hreflang metadata parity"
          git push origin HEAD:feature/public-surface-invariants-r128
          echo OK_R128_BRANCH_METADATA_REMEDIATION_PUSHED
