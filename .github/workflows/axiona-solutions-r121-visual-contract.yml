name: AXIONA Solutions R121 Visual Contract

on:
  pull_request:
    branches: [main]
    paths:
      - solutions.html
      - en/solutions.html
      - de/solutions.html
      - assets/solutions-r121.css
      - assets/js/solutions-r121.js
      - .github/workflows/axiona-solutions-r121-visual-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contract:
    name: Verify rendered solutions page contract
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare browser inspector
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || exit 1
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          python3 -m http.server 4178 --bind 127.0.0.1 >/tmp/r121-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4178/solutions.html >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Verify HU EN DE desktop and mobile
        shell: bash
        env:
          BASE: http://127.0.0.1:4178
        run: |
          set -euo pipefail
          mkdir -p /tmp/r121-shots
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
          const routes=[['/solutions.html','hu'],['/en/solutions.html','en'],['/de/solutions.html','de']];
          const has=(v,x)=>v?.includes(x);
          for(const [route,lang] of routes) for(const [label,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width:w,height:h}});
            await page.goto(process.env.BASE+route,{waitUntil:'networkidle'});
            const marker=await page.evaluate(async()=>({css:await(await fetch('/assets/solutions-r121.css')).text(),js:await(await fetch('/assets/js/solutions-r121.js')).text()}));
            if(!marker.css.includes('AXIONA R121 — Solutions page visual contract')||!marker.js.includes('AXIONA R121 — repeatable, progressive-enhancement solutions reveal motion')) throw Error(route+' marker');
            const r=await page.evaluate(()=>{const st=q=>{const e=document.querySelector(q);const s=e&&getComputedStyle(e);return s&&{bg:s.backgroundColor,bgi:s.backgroundImage,cursor:s.cursor,opacity:s.opacity}};return{
              release:document.querySelector('meta[name="axiona-release"]')?.content,lang:document.documentElement.lang,
              css:[...document.styleSheets].some(x=>(x.href||'').includes('/assets/solutions-r121.css?release=R121')),js:[...document.scripts].some(x=>(x.src||'').includes('/assets/js/solutions-r121.js?release=R121')),
              sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,
              c:[document.querySelectorAll('main h1').length,document.querySelectorAll('.service-editorial.website-service').length,document.querySelectorAll('.solution-fit-card').length,document.querySelectorAll('.solution-layer-list article').length,document.querySelectorAll('.solution-choice-panel').length,document.querySelectorAll('.keeper-solutions-card').length,document.querySelectorAll('.keeper96-mini-row').length,document.querySelectorAll('.ax-share').length,document.querySelectorAll('footer').length],
              body:st('body'),open:st('.services'),brief:st('.service-editorial.website-service'),copy:st('.service-copy'),fitSec:st('.solution-fit'),fit:st('.solution-fit-card'),stack:st('.solution-stack'),layer:st('.solution-layer-list article'),choiceSec:st('.solution-choice'),choice:st('.solution-choice-panel'),keeper:st('.keeper-solutions-card'),krow:st('.keeper96-mini-row')};});
            if(r.release!=='R121'||r.lang!==lang||!r.css||!r.js||r.sw>r.cw+2) throw Error(route+' binding/overflow');
            if(JSON.stringify(r.c)!==JSON.stringify([1,1,4,5,1,1,5,1,1])) throw Error(route+' structure '+JSON.stringify(r.c));
            if(!has(r.body.bg,'241, 238, 230')||!has(r.open.bg,'241, 238, 230')||r.open.bgi!=='none') throw Error(route+' opening');
            if(!has(r.brief.bg,'11, 30, 37')||!has(r.stack.bg,'11, 30, 37')||!has(r.keeper.bg,'11, 30, 37')) throw Error(route+' petrol');
            if(!has(r.copy.bg,'255, 253, 248')||!has(r.fit.bg,'251, 250, 246')||!has(r.layer.bg,'251, 250, 246')||!has(r.choice.bg,'255, 253, 248')||!has(r.krow.bg,'251, 250, 246')) throw Error(route+' surfaces');
            if(!has(r.fitSec.bg,'229, 223, 211')||!has(r.choiceSec.bg,'232, 235, 229')) throw Error(route+' fields');
            for(const x of [r.fit,r.layer,r.krow]) if(x.cursor!=='default'||x.opacity!=='1') throw Error(route+' affordance/opacity');
            if(route==='/solutions.html'&&label==='desktop'){const p=page.locator('.solution-fit-card').first();await p.scrollIntoViewIfNeeded();await page.waitForTimeout(220);if(!await p.evaluate(e=>e.classList.contains('is-visible')))throw Error('reveal-on');await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(260);if(await p.evaluate(e=>e.classList.contains('is-visible')))throw Error('reveal-latched');await p.scrollIntoViewIfNeeded();await page.waitForTimeout(220);if(!await p.evaluate(e=>e.classList.contains('is-visible')))throw Error('reveal-return');}
            await page.evaluate(()=>document.querySelectorAll('[data-solutions-reveal]').forEach(e=>e.classList.add('is-visible')));
            await page.screenshot({path:`/tmp/r121-shots/${lang}-${label}.png`,fullPage:true});
            await page.close();
          }
          await browser.close(); console.log('OK_AXIONA_SOLUTIONS_R121_VISUAL_CONTRACT');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axiona-solutions-r121-render-evidence
          path: /tmp/r121-shots/*.png
          if-no-files-found: error
          retention-days: 3
