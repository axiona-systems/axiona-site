name: Keeper R98 Semantic Copy

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/keeper-semantics-r98'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/keeper-semantics-r98
      - name: Apply semantic copy corrections and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_keeper_semantics_r98.py
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git diff --check
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keeper.html index.html solutions.html en/keeper.html en/index.html en/solutions.html de/keeper.html de/index.html de/solutions.html scripts/verify_public_quality.py
          git commit -m "Clarify Keeper work versus user work"
          git push origin HEAD:fix/keeper-semantics-r98
