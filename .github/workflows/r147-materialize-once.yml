name: R147 Brand Runtime Materializer

on:
  push:
    branches:
      - feature/r147-master-brand-runtime-migration
    paths:
      - '.github/workflows/r147-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild exact canonical brand derivatives
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/r147-brand-source
          DIST=/tmp/r147-brand-dist
          mkdir -p "$SOURCE"
          HISTORICAL=c0e3ff49949b6bea1419c642f536f5480994c15d
          for file in \
            axiona-master-horizontal-fullcolor.svg \
            axiona-symbol-fullcolor.svg \
            build_exports.py \
            README.md \
            EXPORT_SPEC_V1.md
          do
            git show "$HISTORICAL:brand/assets/master-v1/$file" > "$SOURCE/$file"
          done
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.7.1' 'Pillow==11.3.0'
          python3 "$SOURCE/build_exports.py" --source-dir "$SOURCE" --output "$DIST"

      - name: Prove exact authority artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r147-brand-dist
          cat > /tmp/r147-required.sha256 <<'EOF'
          dca03db3af56c0d3956e2c63f5154750034d7bf6ec37da26ec0bc07581f9be8d  axiona-master-horizontal-fullcolor.svg
          8c5b276b8e2ba2ebfe7ce9e8832b25d3f34d15785a87e48f9bf6c3513f237c76  axiona-horizontal-monochrome-white.svg
          a551d43284d05c5a2a84da91fc7815d9181e595636ec73b2e4aabafc55e9fb13  axiona-symbol-fullcolor.svg
          25f9adf725e27ce3998f092a9923be7ccb9e683f77e1eca73930a36183829d74  axiona-master-horizontal-fullcolor.png
          acb7caa1f7a57783646cfb42c5e94a1396f769cd73cc8be0668df310b46b9fae  axiona-symbol-16.png
          f1713c0c22966c876daf6ebfec19507cc1d3511cb99a5d26e3158ac7cd56ce67  axiona-symbol-32.png
          763b11ae6c1b8528c60b058249372cb6ba4ab529936ae202a93948c00bbbe338  axiona-symbol.ico
          c8beb1c608c83f254db243e686ed3c9cfbac844556d55111ee55105fb71d9363  axiona-symbol-paper-180.png
          245b330d957100172f311d4d21ced6311b39621fd4a413040ed52b28d048ff51  axiona-symbol-paper-192.png
          ac019d3118682a8f5b6d63fe89f211225d27e8000e32966257f049ba1f62bee7  axiona-symbol-paper-512.png
          EOF
          sha256sum -c /tmp/r147-required.sha256
          echo 'R147_BRAND_AUTHORITY_BYTES=PASS'

      - name: Materialize complete public runtime migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r147-materialize.py --brand-dist /tmp/r147-brand-dist

      - name: Verify migrated source before finalizing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_site.py
          python3 scripts/verify_sitemap_hreflang.py
          python3 scripts/verify_security_txt.py
          python3 scripts/verify_social_metadata.py
          python3 scripts/verify_retired_routes.py
          python3 scripts/verify_browser_identity.py
          python3 scripts/verify_asset_references.py
          python3 scripts/verify_brand_consumer_boundary.py

      - name: Remove one-shot construction authority and run canonical guards
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r147-materialize-once.yml
          rm scripts/r147-materialize.py
          python3 scripts/verify_workflow_hardening.py
          python3 scripts/verify_brand_consumer_boundary.py
          git diff --check
          test ! -e .github/workflows/r147-materialize-once.yml
          test ! -e scripts/r147-materialize.py
          echo 'R147_ONE_SHOT_REMOVED=PASS'

      - name: Commit exact R147 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXIONA R147 Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'R147: migrate runtime identity to canonical master brand'
          git push origin HEAD:feature/r147-master-brand-runtime-migration
          echo "R147_CANDIDATE_SHA=$(git rev-parse HEAD)"
