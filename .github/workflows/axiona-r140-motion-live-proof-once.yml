# Existing-on-main diagnostic trigger for R140 motion behavior.
name: AXIONA R140 Motion Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axiona-r140-motion-live-proof-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH" || { echo STOP_R140_CHROME_MISSING; exit 1; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
      - name: Capture live motion behavior
        shell: bash
        run: |
          set -u
          mkdir -p docs/status
          node --input-type=module > docs/status/R140_MOTION_DIAGNOSTIC.txt 2>&1 <<'NODE'
          import { chromium } from 'playwright-core';
          const routes=['/','/systems.html','/process.html','/security.html','/solutions.html','/support.html'];
          const selector='[data-ax112-reveal],[data-system-reveal],[data-process-reveal],[data-security-reveal],[data-solutions-reveal],[data-contact-reveal],[data-support-reveal],[data-keeper125-reveal],[data-policy-reveal]';
          let failed=false;
          let browser;
          try {
            browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
            for(const route of routes){
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              try{
                const url=`https://axiona.systems${route}?axiona_verify=${Date.now()}`;
                await page.goto(url,{waitUntil:'networkidle',timeout:45000});
                const binding=await page.evaluate(()=>({
                  css:[...document.styleSheets].filter(s=>(s.href||'').includes('/assets/motion-r138.css?release=R140')).length,
                  js:[...document.scripts].filter(s=>(s.src||'').includes('/assets/js/motion-r138.js?release=R140')).length,
                  root:document.documentElement.className
                }));
                const css=await page.evaluate(()=>{
                  const s=getComputedStyle(document.documentElement);
                  return {distance:s.getPropertyValue('--ax-r140-reveal-y').trim(),opacity:s.getPropertyValue('--ax-r140-reveal-opacity-start').trim(),duration:s.getPropertyValue('--ax-r140-reveal-transform-duration').trim()};
                });
                console.log('ROUTE',route,'BINDING',JSON.stringify(binding),'TUNING',JSON.stringify(css));
                const nodes=page.locator(selector);
                const count=await nodes.count();
                let target=null;
                for(let i=0;i<count;i++){
                  const box=await nodes.nth(i).boundingBox();
                  if(box&&box.y>1400){target=nodes.nth(i);break;}
                }
                if(!target){console.log('ROUTE',route,'NO_TARGET');await page.close();continue;}
                await target.evaluate(el=>{window.__ax140=[];new MutationObserver(()=>window.__ax140.push({t:Math.round(performance.now()),active:el.classList.contains('ax-reveal-active'),cls:el.className})).observe(el,{attributes:true,attributeFilter:['class']});});
                const before=await target.evaluate(el=>({active:el.classList.contains('ax-reveal-active'),top:el.getBoundingClientRect().top+scrollY}));
                console.log('ROUTE',route,'BEFORE',JSON.stringify(before));
                await target.scrollIntoViewIfNeeded();
                await page.waitForTimeout(850);
                const first=await target.evaluate(el=>({active:el.classList.contains('ax-reveal-active'),transform:getComputedStyle(el).transform,opacity:getComputedStyle(el).opacity,entry:getComputedStyle(el).getPropertyValue('--ax-r140-entry-y').trim()}));
                console.log('ROUTE',route,'FIRST',JSON.stringify(first));
                const absoluteTop=await target.evaluate(el=>el.getBoundingClientRect().top+scrollY);
                await page.evaluate(y=>scrollTo({top:y,behavior:'instant'}),absoluteTop+1900);
                await page.waitForTimeout(650);
                const rearmed=await target.evaluate(el=>({active:el.classList.contains('ax-reveal-active'),transform:getComputedStyle(el).transform,opacity:getComputedStyle(el).opacity,entry:getComputedStyle(el).getPropertyValue('--ax-r140-entry-y').trim(),rect:el.getBoundingClientRect().toJSON()}));
                console.log('ROUTE',route,'REARMED',JSON.stringify(rearmed));
                await target.scrollIntoViewIfNeeded();
                await page.waitForTimeout(850);
                const returned=await target.evaluate(el=>({active:el.classList.contains('ax-reveal-active'),transform:getComputedStyle(el).transform,opacity:getComputedStyle(el).opacity,entry:getComputedStyle(el).getPropertyValue('--ax-r140-entry-y').trim()}));
                const transitions=await page.evaluate(()=>window.__ax140||[]);
                console.log('ROUTE',route,'RETURN',JSON.stringify(returned),'TRANSITIONS',JSON.stringify(transitions));
                if(binding.css!==1||binding.js!==1||css.distance!=='9px'||!first.active||rearmed.active||!returned.active) failed=true;
              }catch(err){failed=true;console.log('ROUTE',route,'ERROR',err?.stack||String(err));}
              await page.close();
            }
          }catch(err){failed=true;console.log('FATAL',err?.stack||String(err));}
          finally{if(browser)await browser.close();}
          console.log(failed?'RESULT=FAIL':'RESULT=PASS');
          NODE
          echo "NODE_EXIT=$?" >> docs/status/R140_MOTION_DIAGNOSTIC.txt
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/axiona-r140-motion-live-proof-once.yml
          git config user.name 'AXIONA Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'R140: record live motion diagnostic'
          git push origin HEAD:main
