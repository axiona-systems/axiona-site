name: AXIONA Security.txt R131 Live Proof

on:
  push:
    branches: [main]
    paths:
      - .well-known/security.txt
      - scripts/verify_security_txt.py
      - .github/workflows/axiona-security-txt-r131-live-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    name: Prove live RFC 9116 security.txt delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch live security.txt and headers
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.well-known"
          url="https://axiona.systems/.well-known/security.txt?proof=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --dump-header "$tmp/headers" --output "$tmp/.well-known/security.txt" "$url"
          grep -Eiq '^content-type:[[:space:]]*text/plain([;[:space:]]|$)' "$tmp/headers" || {
            echo "STOP_R131_LIVE_CONTENT_TYPE"
            cat "$tmp/headers"
            exit 1
          }
          python3 scripts/verify_security_txt.py --root "$tmp"
          grep -Fqx 'Canonical: https://axiona.systems/.well-known/security.txt' "$tmp/.well-known/security.txt"
          grep -Fqx 'Policy: https://axiona.systems/security.html' "$tmp/.well-known/security.txt"
          echo OK_AXIONA_SECURITY_TXT_R131_LIVE
          echo "PROVEN_PAGES_SOURCE_SHA=${GITHUB_SHA}"
