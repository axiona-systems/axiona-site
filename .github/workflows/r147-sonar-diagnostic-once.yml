name: R147 Sonar Diagnostic Once

on:
  push:
    branches: [feature/r147-live-brand-proof]
    paths:
      - ".github/workflows/r147-sonar-diagnostic-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query SonarCloud PR issues
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sonarcloud.io/api/issues/search?componentKeys=axiona-systems_axiona-site&pullRequest=101&resolved=false&ps=100'
          curl --fail-with-body --silent --show-error "$URL" -o /tmp/issues.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/issues.json').read_text())
          print('TOTAL=', d.get('total'))
          for issue in d.get('issues', []):
              print('ISSUE')
              for key in ('key','rule','severity','type','component','line','message','cleanCodeAttribute','impacts','status'):
                  print(f'{key}={issue.get(key)}')
          PY
