name: Keeper Overview R95 PR Migration

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'fix/keeper-overview-benefit-r95'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/keeper-overview-benefit-r95
      - name: Apply bounded R95 patch and gates
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#<span class="micro">iPhone + iPad</span>#<span class="micro">iPhone + iPad · Apple App Store</span>#g' scripts/patch_keeper_overview_r95.py
          python3 scripts/patch_keeper_overview_r95.py
          python3 scripts/verify_seo.py
          python3 scripts/verify_public_quality.py
          git config user.name "AXIONA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/patch_keeper_overview_r95.py .github/workflows/keeper-overview-r95-pr-migration.yml
          git add index.html en/index.html de/index.html assets/keeper-r94.css scripts/verify_public_quality.py
          git commit -m "Focus Keeper overview on visitor benefits"
          git push origin HEAD:fix/keeper-overview-benefit-r95
