<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="720" viewBox="0 0 2400 720" role="img" aria-label="AXIONA Systems logo">

  <defs>
    <linearGradient id="markGrad" x1="180" y1="840" x2="840" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18D8F2"/>
      <stop offset="52%" stop-color="#11C7C4"/>
      <stop offset="100%" stop-color="#25E08A"/>
    </linearGradient>
    <linearGradient id="markGrad2" x1="220" y1="170" x2="810" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18D8F2"/>
      <stop offset="100%" stop-color="#25E08A"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="2400" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18D8F2"/>
      <stop offset="45%" stop-color="#102336"/>
      <stop offset="100%" stop-color="#25E08A"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.86  0 0 0 0 0.88  0 0 0 .45 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0F2436"/>
      <stop offset="58%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#03070D"/>
    </radialGradient>
  </defs>



  <g id="axiona-mark" transform="translate(76 96) scale(0.5078125)" filter="url(#softGlow)">
    <polygon points="268,780 353,780 506,514 506,384 430,384" fill="url(#markGrad)"/>
    <polygon points="756,780 671,780 518,514 518,384 594,384" fill="url(#markGrad2)"/>
    <polygon points="188,900 279,900 389,704 300,704" fill="url(#markGrad)"/>
    <polygon points="836,900 745,900 635,704 724,704" fill="url(#markGrad2)"/>
    <rect x="334" y="673" width="160" height="18" rx="4" fill="#16D4E8"/>
    <rect x="530" y="673" width="160" height="18" rx="4" fill="#24D79A"/>
    <rect x="486" y="640" width="52" height="52" rx="5" fill="url(#markGrad2)"/>
    <rect x="503" y="300" width="18" height="66" rx="4" fill="#18D8F2"/>
    <rect x="495" y="248" width="34" height="34" rx="4" fill="#18D8F2"/>
    <rect x="503" y="728" width="18" height="96" rx="4" fill="#24D79A"/>
    <rect x="495" y="850" width="34" height="34" rx="4" fill="#24D79A"/>
  </g>

  <text x="720" y="332" fill="#F4FAFF" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="180" font-weight="700" letter-spacing="42">AXIONA</text>
  <text x="724" y="468" fill="#8EA6B6" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="82" font-weight="500" letter-spacing="20">SYSTEMS</text>
</svg>